function scheduleAutosave(){
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = 'Modifiche in corso...';
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(doAutosave, 1200);
}

async function doAutosave(){
  if(!editingType) return;
  const sections = editingType==='player' ? PLAYER_SECTIONS : TEAM_SECTIONS;
  const formData = collectFormData(sections);
  if(!formData.nome || !formData.nome.trim()){
    const statusEl = document.getElementById('saveStatus');
    if(statusEl) statusEl.textContent = 'Inserisci almeno il nome per salvare';
    return;
  }
  const table = editingType==='player' ? 'players' : 'teams';
  const arr = editingType==='player' ? players : teams;
  const existing = editingId ? arr.find(x=>x.id===editingId) : null;
  const existingData = existing ? (({id, ...rest}) => rest)(existing) : {};
  const data = { ...existingData, ...formData };

  if(editingType==='player'){
    const custom = { ...(data.custom||{}) };
Object.keys(custom).forEach(k => { if(!INTERNAL_CUSTOM_KEYS.includes(k) && !editingCustomFields.some(cf => cf.k && cf.k.trim()===k)) delete custom[k]; });
editingCustomFields.forEach(cf => { if(cf.k && cf.k.trim()) custom[cf.k.trim()] = cf.v; });

data.custom = custom;
    data.tag = editingTags.slice();
    const fasciaEl = document.getElementById('f_fascia');
    const valoreEffEl = document.getElementById('f_valoreEffettivo');
    const prezzoPrevEl = document.getElementById('f_prezzoPrevistoNum');
    if(fasciaEl) data.fascia = fasciaEl.value || null;
    if(valoreEffEl) data.valoreEffettivo = valoreEffEl.value===''? null : parseFloat(valoreEffEl.value);
    if(prezzoPrevEl) data.prezzoPrevisto = prezzoPrevEl.value===''? null : parseFloat(prezzoPrevEl.value);
  }
  if(editingType==='team'){
    data.tag = editingTeamTags.slice();
  }
  data.updatedBy = myName || 'anonimo';
  data.updatedAt = new Date().toISOString();

  const id = editingId || uid(editingType==='player'?'p':'t');
  editingId = id;
  const rec = { id, ...data };

  const idx = arr.findIndex(x=>x.id===id);
  if(idx>-1) arr[idx] = rec; else arr.push(rec);

  try{
    const changed = computeChangedFields(editingBaseline, data);
    const merged = await mergeSaveRow(table, id, changed);
    if (merged) {
      editingBaseline = Object.assign({}, editingBaseline, changed);
      const idx2 = arr.findIndex(x=>x.id===id);
      const mergedRec = Object.assign({id}, merged);
      if (idx2>-1) arr[idx2] = mergedRec; else arr.push(mergedRec);
    }
    const statusEl = document.getElementById('saveStatus');
    if(statusEl) statusEl.textContent = 'Salvato ✓ · ' + new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    console.error('Errore persistenza giocatore:', e);
    const statusEl = document.getElementById('saveStatus');
    if(statusEl) statusEl.textContent = 'Errore di salvataggio, controlla la connessione';
  }
  // Non aggiornare i datalist durante autosave per non perdere il focus negli input
  // if(table==='teams') renderTeamDatalist();
  // if(table==='teams') renderAllTeamTagsDatalist();
  // if(table==='players') renderAllTagsDatalist();
  // Non fare render() completo durante autosave per non perdere il focus negli input
  // render();
  // if(currentTab==='teams') renderTeams();
  // if(currentTab==='compare') renderCompare();
}

  Promise.all(pending).finally(() => {

async function removeRecord(type, id){
  const rec = (type==='player' ? players : teams).find(x=>x.id===id);
  const nome = rec ? (rec.nome||'Senza nome') : '';
  const confirmed = await showConfirmModal({
    title: `Eliminare ${type==='player'?'il giocatore':'la squadra'}?`,
    body: `<b>${escapeHtml(nome)}</b> verrà eliminato definitivamente — anche per il tuo compagno. Questa azione non si può annullare.`,
    confirmLabel: 'Elimina definitivamente',
  });
  if(!confirmed) return;
  const table = type==='player' ? 'players' : 'teams';
  try{ await sb.from(table).delete().eq('id', id); }catch(e){ showToast('Errore eliminazione'); return; }
  if(type==='player'){ players = players.filter(p=>p.id!==id); compareIds = compareIds.filter(x=>x!==id); renderAllTagsDatalist(); }
  else { teams = teams.filter(t=>t.id!==id); renderTeamDatalist(); }
  // Dopo eliminazione, fare render() completo è corretto perché l'elemento non esiste più
  render();
  if(currentTab==='teams') renderTeams();
  if(currentTab==='compare') renderCompare();
  // Close any WM windows showing this record
  WM.windows.forEach((win, winId) => {
    if(win.state.type===type && win.state.recordId===id) WM.close(winId);
  });
  showToast('Eliminato');
}

function renderCompare(){
  const picker = document.getElementById('comparePicker');
  picker.innerHTML = players.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(p => `
    <span class="pill ${compareIds.includes(p.id)?'selected':''}" data-id="${p.id}">${escapeHtml(p.nome)}</span>
  `).join('');
  picker.querySelectorAll('.pill').forEach(el => { el.onclick = () => { toggleCompare(el.dataset.id); }; });

  const countEl = document.getElementById('comparePickerCount');
  if(countEl) countEl.textContent = `(${compareIds.length}/3)`;
  const details = document.getElementById('comparePickerDetails');
  if(details) details.open = compareIds.length < 2;

  const area = document.getElementById('compareArea');
  if(compareIds.length === 0){
    area.innerHTML = '<div class="compare-empty">Seleziona 2 o 3 giocatori qui sopra per il confronto affiancato.</div>';
    return;
  }
  const selected = compareIds.map(id => players.find(p=>p.id===id)).filter(Boolean);

  const allCustomKeys = new Set();
  selected.forEach(p => Object.keys(p.custom||{}).forEach(k => allCustomKeys.add(k)));

  let rowsHtml = '';
  PLAYER_SECTIONS.forEach(sec => {
    const open = expandedCompareSections.has(sec.key);
    rowsHtml += `<tr class="section-header-row" data-sec="${sec.key}"><td colspan="${selected.length+1}">${open?'▾':'▸'} ${sec.label}</td></tr>`;
    if(open){
      sectionFields(sec).forEach(f => {
        rowsHtml += `<tr><td>${f.label}</td>` + selected.map(p => `<td>${formatCompareValue(f, p[f.k])}</td>`).join('') + `</tr>`;
      });
      if(sec.key === 'previsioni'){
        rowsHtml += `<tr><td>Tag</td>` + selected.map(p => `<td>${(p.tag&&p.tag.length) ? escapeHtml(p.tag.join(', ')) : '-'}</td>`).join('') + `</tr>`;
      }
    }
  });
  if(allCustomKeys.size){
    const open = expandedCompareSections.has('custom');
    rowsHtml += `<tr class="section-header-row" data-sec="custom"><td colspan="${selected.length+1}">${open?'▾':'▸'} Campi personalizzati</td></tr>`;
    if(open){
      [...allCustomKeys].forEach(k => {
        rowsHtml += `<tr><td>${escapeHtml(k)}</td>` + selected.map(p => `<td>${escapeHtml((p.custom&&p.custom[k])||'-')}</td>`).join('') + `</tr>`;
      });
    }
  }

  const aiOpen = expandedCompareSections.has('aiSummary');
  rowsHtml += `<tr class="section-header-row" data-sec="aiSummary"><td colspan="${selected.length+1}">${aiOpen?'▾':'▸'} Riassunto AI <span class="section-toggle-original" data-action="toggleOriginal">${compareShowOriginalNotes?'mostra riassunto':'mostra note originali'}</span></td></tr>`;
  if(aiOpen){
    if(compareShowOriginalNotes){
      rowsHtml += `<tr><td>Note originali</td>` + selected.map(p => {
        const blob = [p.noteAnnoScorso, p.titolaritaNote, p.valutazioneSquadraNote, p.noteVarie].filter(Boolean).join('\n\n') || '-';
        return `<td><div class="orig-note-block">${escapeHtml(blob)}</div></td>`;
      }).join('') + `</tr>`;
    } else {
      rowsHtml += `<tr><td>Parole chiave</td>` + selected.map(p => {
        const s = p.aiSummary;
        return `<td>${s&&s.keywords&&s.keywords.length ? `<div class="ai-kw-td">${s.keywords.map(k=>`<span class="ai-kw">${escapeHtml(k)}</span>`).join('')}</div>` : '-'}</td>`;
      }).join('') + `</tr>`;
      rowsHtml += `<tr><td>Punti giocatore</td>` + selected.map(p => {
        const s = p.aiSummary;
        return `<td>${s&&s.punti_giocatore&&s.punti_giocatore.length ? `<ul class="ai-list">${s.punti_giocatore.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '-'}</td>`;
      }).join('') + `</tr>`;
      rowsHtml += `<tr><td>Punti squadra</td>` + selected.map(p => {
        const s = p.aiSummary;
        return `<td>${s&&s.punti_squadra&&s.punti_squadra.length ? `<ul class="ai-list">${s.punti_squadra.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '-'}</td>`;
      }).join('') + `</tr>`;
      rowsHtml += `<tr><td>Rischi</td>` + selected.map(p => {
        const s = p.aiSummary;
        return `<td>${s&&s.flag_rischio&&s.flag_rischio.length ? `<ul class="ai-list risk">${s.flag_rischio.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '-'}</td>`;
      }).join('') + `</tr>`;
      rowsHtml += `<tr><td>Generato</td>` + selected.map(p => {
        const s = p.aiSummary;
        if(!s) return '<td>-</td>';
        const stale = s.sourceHash !== computeNotesSignature(p);
        return `<td>${formatRelative(s.generatedAt)}${stale?' ⚠️':''}</td>`;
      }).join('') + `</tr>`;
    }
  }

  area.innerHTML = `<div class="compare-scroll"><table class="compare-table">
    <thead><tr><th>Campo</th>${selected.map(p=>`<th>${escapeHtml(p.nome)}</th>`).join('')}</tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;

  area.querySelectorAll('.section-header-row').forEach(tr => {
    tr.onclick = (e) => {
      if(e.target.dataset.action === 'toggleOriginal'){ compareShowOriginalNotes = !compareShowOriginalNotes; renderCompare(); return; }
      const key = tr.dataset.sec;
      if(expandedCompareSections.has(key)) expandedCompareSections.delete(key); else expandedCompareSections.add(key);
      renderCompare();
    };
  });
}

function formatCompareValue(f, val){
  if(val==null || val==='') return '-';
  if(f.type==='select'){
    const opt = f.options.find(o=>String(o[0])===String(val));
    return escapeHtml(opt ? opt[1] : val);
  }
  if(f.type==='tags'){ return Array.isArray(val) && val.length ? escapeHtml(val.join(', ')) : '-'; }
  return escapeHtml(String(val));
}

// ========== KIT V14 · WAR ROOM 2.0 · QUARTIER GENERALE ==========
let wrActiveSection = 'plancia';
let wrFormation = { modulo:'4-3-3', titolari:[] };
let wrSettings = {
  partiteTotali:38,
  votoUfficio:6,
  fasce:[
    {min:0, bonus:0},
    {min:6.0, bonus:1},
    {min:6.5, bonus:2},
    {min:6.75, bonus:3},
    {min:7.0, bonus:4},
    {min:7.25, bonus:6}
  ]
};
const WR_SLOT_REPARTO = {'POR':'P','TD':'D','DC':'D','TS':'D','CC':'C','CDC':'C','COC':'C','ED':'C','ES':'C','AD':'A','AS':'A','PU':'A'};

function wrLoadState(){
  try{ const f=localStorage.getItem('df_wr_formation'); if(f) wrFormation=Object.assign(wrFormation, JSON.parse(f)); }catch(e){ console.warn('Errore caricamento formazione War Room:', e.message); }

}
function wrSaveFormation(){ try{ localStorage.setItem('df_wr_formation', JSON.stringify(wrFormation)); }catch(e){ console.warn('Errore salvataggio formazione War Room:', e.message); } }
function wrSaveSettings(){ try{ localStorage.setItem('df_wr_settings', JSON.stringify(wrSettings)); }catch(e){ console.warn('Errore salvataggio impostazioni War Room:', e.message); } }

function wrMyTeam(){ return leagueTeams.find(t=>t.isMine)||null; }
function wrMyPurchases(){ const m=wrMyTeam(); if(!m) return []; return players.filter(p=>p.asta && p.asta.team===m.nome); }
function wrGetPlayer(id){ return players.find(p=>p.id===id); }
function wrMedia(p){ const v=p.fmAnnoScorso; return (v!=null && String(v).trim()!=='')?Number(v):null; }
function wrPresenze(p){ const v=p.presenzeAnnoScorso; return (v!=null && String(v).trim()!=='')?Number(v):null; }

function wrComputePlayer(p){
  const partite=Number(wrSettings.partiteTotali)||38;
  const votoUff=wrSettings.votoUfficio!=null?Number(wrSettings.votoUfficio):6;
  const media=wrMedia(p);
  const presRaw=wrPresenze(p);
  const presenze=(presRaw==null)?partite:Math.min(Math.max(0,presRaw),partite);
  const nonGiocate=partite-presenze;
  const mediaEff=(media==null)?votoUff:media;
  const totale=mediaEff*presenze+votoUff*nonGiocate;
  return {media,presenzeRaw:presRaw,presenze,nonGiocate,totale,mediaProiettata:totale/partite};
}

function wrComputePiazzati(){
  const schema=FORMATIONS[wrFormation.modulo]||FORMATIONS['4-3-3'];
  const byRep={P:[],D:[],C:[],A:[]};
  wrFormation.titolari.forEach(pid=>{ const p=wrGetPlayer(pid); if(p&&byRep[p.posFanta]!=null) byRep[p.posFanta].push(p); });
  const cursors={P:0,D:0,C:0,A:0};
  const piazzati=[]; const panchina=[];
  schema.forEach((slot,idx)=>{
    const rep=WR_SLOT_REPARTO[slot.ruolo]||'C';
    const arr=byRep[rep];
    if(arr && cursors[rep]<arr.length){ piazzati.push({slotIdx:idx,ruolo:slot.ruolo,x:slot.x,y:slot.y,player:arr[cursors[rep]],calc:wrComputePlayer(arr[cursors[rep]])}); cursors[rep]++; }
    else piazzati.push({slotIdx:idx,ruolo:slot.ruolo,x:slot.x,y:slot.y,player:null,calc:null});
  });
  ['P','D','C','A'].forEach(rep=>{ for(let i=cursors[rep];i<byRep[rep].length;i++) panchina.push(byRep[rep][i]); });
  return {piazzati,panchina};
}

function wrFasciaForMedia(media){
  let idx=0;
  wrSettings.fasce.forEach((f,i)=>{ if(media>=Number(f.min)) idx=i; });
  return {idx, fascia:wrSettings.fasce[idx]};
}

function wrModAnalysis(){
  const {piazzati}=wrComputePiazzati();
  const D=piazzati.filter(s=>s.player && s.player.posFanta==='D');
  if(D.length===0) return null;
  const medie=D.map(s=>s.calc.mediaProiettata);
  const somma=medie.reduce((a,b)=>a+b,0);
  const mediaDif=somma/D.length;
  const n=D.length;
  let minIdx=0; medie.forEach((m,i)=>{ if(m<medie[minIdx]) minIdx=i; });
  const minMedia=medie[minIdx];
  const minPlayer=D[minIdx].player;
  const att=wrFasciaForMedia(mediaDif);
  const roadmap=[];
  for(let i=att.idx+1;i<wrSettings.fasce.length;i++){
    const f=wrSettings.fasce[i];
    const soglia=Number(f.min);
    roadmap.push({idx:i, soglia, bonus:f.bonus, gap:soglia-mediaDif, X_needed:soglia*n-somma+minMedia});
  }
  return {mediaDif,n,minMedia,minPlayer,att,roadmap};
}

function wrSimTeam(){
  const {piazzati,panchina}=wrComputePiazzati();
  const attivi=piazzati.filter(s=>s.player);
  const n=attivi.length;
  const sommaMedie=attivi.reduce((s,a)=>s+a.calc.mediaProiettata,0);
  const mediaBase=n?sommaMedie/n:0;
  const perReparto={P:{sum:0,n:0},D:{sum:0,n:0},C:{sum:0,n:0},A:{sum:0,n:0}};
  attivi.forEach(a=>{ const r=a.player.posFanta; if(perReparto[r]){ perReparto[r].sum+=a.calc.mediaProiettata; perReparto[r].n++; } });
  const mod=wrModAnalysis();
  const bonus=mod?mod.att.fascia.bonus:0;
  const punteggioGiornata=sommaMedie+bonus;
  const partite=Number(wrSettings.partiteTotali)||38;
  return {piazzati,panchina,attivi,n,sommaMedie,mediaBase,perReparto,mod,bonus,punteggioGiornata,punteggioStagione:punteggioGiornata*partite};
}

function wrAutoFillFromPurchases(){
  const schema=FORMATIONS[wrFormation.modulo]||FORMATIONS['4-3-3'];
  const slotPerRep={P:0,D:0,C:0,A:0};
  schema.forEach(s=>{ const r=WR_SLOT_REPARTO[s.ruolo]||'C'; slotPerRep[r]++; });
  const purchases=wrMyPurchases();
  const byRep={P:[],D:[],C:[],A:[]};
  purchases.forEach(p=>{ if(byRep[p.posFanta]) byRep[p.posFanta].push(p); });
  const nuovi=[];
  ['P','D','C','A'].forEach(r=>{
    byRep[r].sort((a,b)=>wrComputePlayer(b).mediaProiettata-wrComputePlayer(a).mediaProiettata);
    byRep[r].slice(0,slotPerRep[r]).forEach(p=>nuovi.push(p.id));
  });
  wrFormation.titolari=nuovi;
  wrSaveFormation();
  showToast('Formazione composta dai migliori acquisti');
}

        </div>`;

// ---- 2) MOTORE PROIEZIONE MEDIA VOTO ----
function dfNum(v){ return (v!=null && String(v).trim()!=='') ? Number(v) : null; }
function dfClamp(x,a,b){ return Math.max(a, Math.min(b,x)); }
function dfVerdetto(delta){
  if(delta>=0.35)  return {label:'Forte crescita', arrow:'▲▲', cls:'up2',   color:'#4C9A6A'};
  if(delta>=0.12)  return {label:'Crescita',       arrow:'▲',  cls:'up',    color:'#4C9A6A'};
  if(delta>-0.12)  return {label:'Stabile',        arrow:'＝', cls:'flat',  color:'#C9C7B8'};
  if(delta>-0.35)  return {label:'Calo',           arrow:'▼',  cls:'down',  color:'#C1543F'};
  return {label:'Forte calo', arrow:'▼▼', cls:'down2', color:'#C1543F'};
}
function dfProiezione(p){
  const fm=dfNum(p.fmAnnoScorso); if(fm==null) return null;
  const factors=[]; let delta=0, dataPoints=0;
  const recent=dfNum(p.mediaVotoUltime5);
  if(recent!=null){ const gap=recent-fm; const imp=dfClamp(gap*0.45,-0.6,0.6); delta+=imp; dataPoints++;
    factors.push({label:'Forma recente', impact:imp, note: gap>=0?'ultime gare sopra la media':'ultime gare sotto la media'}); }
  const xg=dfNum(p.xgAnnoScorso), gol=dfNum(p.golAnnoScorso);
  if(xg!=null && gol!=null && xg>0){ const over=gol-xg; const imp=dfClamp(-over*0.1,-0.5,0.5); delta+=imp; dataPoints++;
    factors.push({label:'Rendimento vs xG', impact:imp, note: over>0.5?'ha reso più del previsto (possibile regressione)':(over<-0.5?'ha reso meno del previsto (possibile rimbalzo)':'in linea con le attese')}); }
  const eta=dfNum(p.eta);
  if(eta!=null){ let imp=0; if(eta<=22)imp=0.18; else if(eta<=25)imp=0.10; else if(eta<=28)imp=0.03; else if(eta<=31)imp=-0.06; else if(eta<=33)imp=-0.14; else imp=-0.25;
    delta+=imp; dataPoints++; factors.push({label:'Curva età ('+eta+' anni)', impact:imp, note: imp>=0?'fase di crescita/prime':'fase di declino'}); }
  const tit=dfNum(p.titolaritaVoto);
  if(tit!=null){ const imp=dfClamp((tit-6)*0.05,-0.3,0.3); delta+=imp; dataPoints++;
    factors.push({label:'Titolarità', impact:imp, note: tit>=7?'titolare solido':(tit<=4?'rischio panchina':'ballottaggio')}); }
  const frag=dfNum(p.fragilita);
  if(frag!=null){ let imp=dfClamp(-(frag-5)*0.05,-0.35,0.2); const gg=dfNum(p.infortuniGiorniTotali); if(gg!=null&&gg>30)imp-=0.08; imp=dfClamp(imp,-0.4,0.2);
    delta+=imp; dataPoints++; factors.push({label:'Fragilità fisica', impact:imp, note: frag>=7?'fragile, rischio stop':'fisico affidabile'}); }
  const golPrev=dfNum(p.golPrevisti);
  if(golPrev!=null && gol!=null){ const diff=golPrev-gol; const imp=dfClamp(diff*0.06,-0.5,0.5); delta+=imp; dataPoints++;
    factors.push({label:'Gol previsti vs scorsi', impact:imp, note: diff>0?'ti aspetti più gol':'ti aspetti meno gol'}); }
  const team=getTeamByName(p.squadra);
  if(team && (p.posFanta==='A'||p.posFanta==='C')){ const off=dfNum(team.offensivita);
    if(off!=null){ const imp=dfClamp((off-6)*0.03,-0.15,0.15); if(Math.abs(imp)>0.02){ delta+=imp; dataPoints++;
      factors.push({label:'Contesto offensivo squadra', impact:imp, note: off>=7?'squadra molto offensiva':'squadra poco offensiva'}); } } }
  delta=dfClamp(delta,-1.5,1.5);
  const fmPrevista=fm+delta;
  return {baseline:fm, delta, fmPrevista, verdict:dfVerdetto(delta), factors, dataPoints,
          affidabilita: dataPoints>=5?'alta':(dataPoints>=3?'media':'bassa')};
}
function dfFinalFm(p){ const pr=dfProiezione(p); if(!pr) return null; const tw=(p.proiezione&&dfNum(p.proiezione.twist))||0; return pr.fmPrevista+tw; }

// guardie: se per qualche motivo mancano le utility del v15, le definisco
if(typeof dfNum==='undefined'){ dfNum=function(v){ return (v!=null && String(v).trim()!=='') ? Number(v) : null; }; }
if(typeof dfClamp==='undefined'){ dfClamp=function(x,a,b){ return Math.max(a, Math.min(b,x)); }; }
if(typeof dfVerdetto==='undefined'){
  dfVerdetto=function(delta){
    if(delta>=0.35)  return {label:'Forte crescita', arrow:'▲▲', cls:'up2',   color:'#4C9A6A'};
    if(delta>=0.12)  return {label:'Crescita',       arrow:'▲',  cls:'up',    color:'#4C9A6A'};
    if(delta>-0.12)  return {label:'Stabile',        arrow:'＝', cls:'flat',  color:'#C9C7B8'};
    if(delta>-0.35)  return {label:'Calo',           arrow:'▼',  cls:'down',  color:'#C1543F'};
    return {label:'Forte calo', arrow:'▼▼', cls:'down2', color:'#C1543F'};
  };
}

var DF_TREND_DELTA = {
  forte_crescita: 0.45,
  crescita: 0.20,
  stabile: 0.00,
  calo: -0.20,
  forte_calo: -0.45
};

// Euristica automatica: SOLO fallback/suggerimento, più conservativa
function dfEuristica(p){
  var fm=dfNum(p.fmAnnoScorso); if(fm==null) return {delta:0, factors:[], dataPoints:0};
  var factors=[]; var delta=0; var dataPoints=0;

  // Quanto fidarsi delle statistiche "totale stagione" (xG, gol previsti vs scorsi):
  // con poche presenze quei numeri sono rumore, non segnale. Sotto le 10 presenze si
  // riduce di molto il loro peso; da 20 presenze in su si usano al 100%.
  var pres=dfNum(p.presenzeAnnoScorso);
  var sampleConf = (pres!=null) ? dfClamp(pres/20, 0.2, 1) : 0.55;

  var recent=dfNum(p.mediaVotoUltime5);
  if(recent!=null){ var gap=recent-fm; var imp=dfClamp(gap*0.4,-0.5,0.5); delta+=imp; dataPoints++;
    factors.push({label:'Forma recente', impact:imp, note: gap>=0?'ultime gare sopra media':'ultime gare sotto media'}); }
  var xg=dfNum(p.xgAnnoScorso), gol=dfNum(p.golAnnoScorso);
  if(xg!=null && gol!=null && xg>0){ var over=gol-xg; var imp2=dfClamp(-over*0.08,-0.4,0.4)*sampleConf; delta+=imp2; dataPoints++;
    factors.push({label:'Rendimento vs xG', impact:imp2, note: (pres!=null && pres<10)?'campione piccolo ('+pres+' presenze), peso ridotto':(over>0.5?'ha reso più del previsto':(over<-0.5?'ha reso meno del previsto':'in linea'))}); }
  var eta=dfNum(p.eta);
  if(eta!=null){
    var impE=0;
    if(p.posFanta==='P'){
      // i portieri sbocciano e declinano più tardi degli altri ruoli
      if(eta<=24)impE=0.12; else if(eta<=29)impE=0.08; else if(eta<=33)impE=0.02; else if(eta<=36)impE=-0.05; else impE=-0.15;
    } else {
      if(eta<=22)impE=0.15; else if(eta<=25)impE=0.08; else if(eta<=28)impE=0.02; else if(eta<=31)impE=-0.05; else if(eta<=33)impE=-0.12; else impE=-0.2;
    }
    delta+=impE; dataPoints++; factors.push({label:'Curva età ('+eta+')', impact:impE, note:''}); }
  var tit=dfNum(p.titolaritaVoto);
  if(tit!=null){ var impT=dfClamp((tit-6)*0.04,-0.25,0.25); delta+=impT; dataPoints++;
    factors.push({label:'Titolarità', impact:impT, note:''}); }
  var frag=dfNum(p.fragilita);
  if(frag!=null){ var impF=dfClamp(-(frag-5)*0.04,-0.3,0.15); var gg=dfNum(p.infortuniGiorniTotali); if(gg!=null&&gg>30)impF-=0.06; impF=dfClamp(impF,-0.35,0.15);
    delta+=impF; dataPoints++; factors.push({label:'Fragilità fisica', impact:impF, note:''}); }
  var gp=dfNum(p.golPrevisti);
  if(gp!=null && gol!=null){ var diff=gp-gol; var impG=dfClamp(diff*0.05,-0.4,0.4)*sampleConf; delta+=impG; dataPoints++;
    factors.push({label:'Gol previsti vs scorsi', impact:impG, note: diff>0?'più gol attesi':'meno gol attesi'}); }
  var team=getTeamByName(p.squadra);
  if(team && (p.posFanta==='A'||p.posFanta==='C')){ var off=dfNum(team.offensivita);
    if(off!=null){ var impC=dfClamp((off-6)*0.02,-0.1,0.1); if(Math.abs(impC)>0.02){ delta+=impC; dataPoints++;
      factors.push({label:'Contesto offensivo', impact:impC, note:''}); } } }
  if(team && (p.posFanta==='P'||p.posFanta==='D')){ var fragDif=dfNum(team.fragilitaDifensiva);
    if(fragDif!=null){ var impD=dfClamp((5.5-fragDif)*0.035,-0.15,0.15); if(Math.abs(impD)>0.02){ delta+=impD; dataPoints++;
      factors.push({label:'Contesto difensivo squadra', impact:impD, note: fragDif<=4?'squadra difensivamente solida':(fragDif>=7?'squadra fragile in difesa':'')}); } } }
  delta=dfClamp(delta,-1.0,1.0);
  return {delta:delta, factors:factors, dataPoints:dataPoints};
}

// Proiezione: il giudizio umano ha priorità, l'euristica è solo fallback
dfProiezione = function(p){
  var fm=dfNum(p.fmAnnoScorso); if(fm==null) return null;
  var delta=null; var fonte='auto';
  var varMan=dfNum(p.variazionePrevista);
  if(varMan!=null){ delta=dfClamp(varMan,-2,2); fonte='umana'; }
  else if(p.trendPrevisto && DF_TREND_DELTA[p.trendPrevisto]!=null){ delta=DF_TREND_DELTA[p.trendPrevisto]; fonte='umana'; }
  var factors=[]; var dataPoints=0;
  if(delta==null){
    var e=dfEuristica(p); delta=e.delta; factors=e.factors; dataPoints=e.dataPoints; fonte='auto';
  }
  var fmPrevista=fm+delta;
  return {baseline:fm, delta:delta, fmPrevista:fmPrevista, verdict:dfVerdetto(delta), fonte:fonte, factors:factors, dataPoints:dataPoints,
          affidabilita: fonte==='umana' ? 'la tua valutazione' : 'ipotesi automatica'};
};

dfFinalFm = function(p){
  var pr=dfProiezione(p); if(!pr) return null;
  var legacyTwist=(p.proiezione && dfNum(p.proiezione.twist))||0;
  return pr.fmPrevista + legacyTwist;
};

dfOpenProjectionModal = function(pid){

var rosterPlans=[];
var pianoActiveReparto='P'; // quale tab reparto stai guardando nel Piano della War Room
var activePlanIdByReparto={P:null,D:null,C:null,A:null}; // un piano attivo per ciascun reparto
var PIANO_REP_LABEL={P:"Portieri",D:"Difensori",C:"Centrocampisti",A:"Attaccanti"};
var PIANO_REP_ORDER=["P","D","C","A"];

async function loadRosterPlans(){
  try{
    var r=await sb.from("roster_plans").select("*");
    if(r.error)throw r.error;
    rosterPlans=(r.data||[]).map(function(x){return Object.assign({id:x.id},x.data)});
    // per ogni reparto, se non c'è ancora un piano attivo scelto, prova a preselezionarne uno
    // valido: prima un piano dedicato a quel reparto, altrimenti un piano "generico" storico
    // (multi-reparto, da prima di questa funzionalità) che abbia già slot per quel reparto.
    PIANO_REP_ORDER.forEach(function(rep){
      if(activePlanIdByReparto[rep])return;
      var candidate=rosterPlans.find(function(p){return p.reparto===rep;})
        || rosterPlans.find(function(p){return !p.reparto && p.slots && p.slots[rep] && p.slots[rep].length;});
      if(candidate)activePlanIdByReparto[rep]=candidate.id;
    });
  }catch(e){console.warn(e);}
}
async function savePlan(p, touchedRep, touchedIdx){
  try{
    var id=p.id;
    var r=await sb.from("roster_plans").select("data").eq("id",id).maybeSingle();
    var serverData=(r&&r.data&&r.data.data)?r.data.data:{};
    var merged=Object.assign({},serverData);
    for(var k in p){ if(k!=='id'&&k!=='slots'&&Object.prototype.hasOwnProperty.call(p,k)) merged[k]=p[k]; }
    var mergedSlots=Object.assign({},serverData.slots||{});
    if(touchedRep!=null && touchedIdx!=null){
      // Sappiamo esattamente quale slot abbiamo appena modificato: aggiorniamo SOLO quello e
      // lasciamo tutti gli altri slot (anche dello stesso reparto) come sono più freschi sul
      // server. Così due persone che toccano slot diversi dello stesso piano, anche nello
      // stesso reparto, non si cancellano più a vicenda.
      var arr=(mergedSlots[touchedRep]||[]).slice();
      var localSlot=(p.slots&&p.slots[touchedRep]&&p.slots[touchedRep][touchedIdx]) || {fascia:"",archetipo:"",budget:"",note:""};
      while(arr.length<=touchedIdx) arr.push({fascia:"",archetipo:"",budget:"",note:""});
      arr[touchedIdx]=localSlot;
      mergedSlots[touchedRep]=arr;
    } else {
      // Non conosciamo lo slot preciso (piano nuovo o rinominato): fallback, usato solo
      // quando non ci sono ancora slot in conflitto da proteggere.
      var localSlots=p.slots||{};
      Object.keys(localSlots).forEach(function(rep){
        var serverArr=(mergedSlots[rep]||[]).slice();
        var localArr=localSlots[rep]||[];
        for(var i=0;i<localArr.length;i++){ serverArr[i]=localArr[i]; }
        mergedSlots[rep]=serverArr;
      });
    }
    merged.slots=mergedSlots;
    await sb.from("roster_plans").upsert({id:id,data:merged,updated_at:new Date().toISOString()});
    var idx=rosterPlans.findIndex(function(x){return x.id===id;});
    var mergedRec=Object.assign({id:id},merged);
    if(idx>-1) rosterPlans[idx]=mergedRec; else rosterPlans.push(mergedRec);
    return merged;
  }catch(e){console.warn(e);}
}
async function deletePlan(pid){
  try{
    await sb.from("roster_plans").delete().eq("id",pid);
    rosterPlans=rosterPlans.filter(function(x){return x.id!==pid;});
    PIANO_REP_ORDER.forEach(function(rep){
      if(activePlanIdByReparto[rep]!==pid)return;
      var fallback=rosterPlans.find(function(p){return p.reparto===rep;})
        || rosterPlans.find(function(p){return !p.reparto;});
      activePlanIdByReparto[rep]=fallback?fallback.id:null;
    });
  }catch(e){console.warn(e);}
}
function getActivePlan(){
  var id=activePlanIdByReparto[pianoActiveReparto];
  return rosterPlans.find(function(p){return p.id===id;})||null;
}
function getActivePlanForReparto(rep){
  var id=activePlanIdByReparto[rep];
  return rosterPlans.find(function(p){return p.id===id;})||null;
}
function calculatePlanBudget(plan, onlyRep){
  if(!plan||!plan.slots)return 0;
  var tot=0;
  var reps=onlyRep?[onlyRep]:Object.keys(plan.slots);
  for(var i=0;i<reps.length;i++){
    var arr=plan.slots[reps[i]]||[];
    for(var j=0;j<arr.length;j++){tot+=parseInt(arr[j].budget)||0;}
  }
  return tot;
}
function checkPianoMatch(player,plan){if(!plan||!plan.slots)return null;var rep=player.posFanta;var slots=plan.slots[rep];if(!slots)return null;for(var i=0;i<slots.length;i++){if(slots[i].fascia&&player.fascia&&slots[i].fascia===player.fascia){return{reparto:rep,slotNumber:i+1,budget:slots[i].budget,archetipo:slots[i].archetipo};}}return null;}
function wrPianoOverviewHtml(){
  var budget=auctionSettings.budgetTotale||500;
  var perRep={};
  var totalAlloc=0;
  PIANO_REP_ORDER.forEach(function(rep){
    var plan=getActivePlanForReparto(rep);
    var alloc=plan?calculatePlanBudget(plan, rep):0;
    perRep[rep]={alloc:alloc, plan:plan};
    totalAlloc+=alloc;
  });
  var over=totalAlloc>budget;
  // Se siamo entro budget, i segmenti sono proporzionati sul budget totale (lasciando visibile
  // la parte "libera" a destra). Se lo sforiamo, la barra si riempie tutta e i segmenti si
  // ridistribuiscono in proporzione a quanto ciascun reparto pesa sul totale allocato — la
  // barra da sola non può più dirti "quanto manca", ma ci pensa la scritta accanto.
  var denom = over ? (totalAlloc||1) : (budget||1);
  var pct = Math.round((totalAlloc/budget)*100);

  var h='<div class="wr-piano-overview'+(over?' over':'')+'">';
  h+='<div class="wr-piano-overview-head"><span class="wr-piano-overview-title">Budget asta · panoramica per reparto</span>';
  h+='<span class="wr-piano-overview-total'+(over?' over':'')+'">'+totalAlloc+' / '+budget+' crediti allocati ('+pct+'%)'+(over?' · oltre budget':'')+'</span></div>';
  h+='<div class="wr-piano-overview-bar">';
  PIANO_REP_ORDER.forEach(function(rep){
    var alloc=perRep[rep].alloc;
    if(alloc<=0)return;
    var w=Math.max(0,Math.min(100,(alloc/denom)*100));
    h+='<div class="wr-piano-overview-seg seg-'+rep+'" data-rep="'+rep+'" style="width:'+w+'%" title="'+PIANO_REP_LABEL[rep]+': '+alloc+' crediti ('+Math.round((alloc/budget)*100)+'% del budget totale)"></div>';
  });
  if(!over){
    var free=Math.max(0,100-(totalAlloc/budget)*100);
    if(free>0) h+='<div class="wr-piano-overview-seg seg-empty" style="width:'+free+'%"></div>';
  }
  h+='</div>';
  h+='<div class="wr-piano-overview-legend">';
  var any=false;
  PIANO_REP_ORDER.forEach(function(rep){
    var info=perRep[rep];
    if(!info.plan && info.alloc<=0)return;
    any=true;
    var pctOfBudget=Math.round((info.alloc/budget)*100);

    if(arch){
      var btn=document.createElement('button');
      btn.className='btn small v20-ric-btn';
      btn.textContent='🔍';
      btn.title='Imposta ricerca per ruolo reale + fascia';
      var chip=document.createElement('span');
      chip.className='v20-ric-chip';
      chip.style.display='none';
      arch.insertAdjacentElement('afterend',btn);
      btn.insertAdjacentElement('afterend',chip);
      btn.onclick=function(){ v20OpenBuilder(rep,idx); };
    }
  }
  v20RenderRicChip(slotEl,rep,idx);
}
function v20RenderRicChip(slotEl,rep,idx){
  var chip=slotEl.querySelector('.v20-ric-chip');
  if(!chip) return;
  var d=v20GetSlot(rep,idx);
  var ric=d&&d.slot.ricerca;
  var has=ric&&((ric.posReali&&ric.posReali.length)||(ric.fasce&&ric.fasce.length));
  if(!has){ chip.style.display='none'; chip.onclick=null; return; }
  var n=v20FindMatches(rep,ric).length;
  var parts=[];
  if(ric.posReali&&ric.posReali.length) parts.push(ric.posReali.join(', '));
  if(ric.fasce&&ric.fasce.length) parts.push(ric.fasce.join('/'));
  chip.textContent='🔍 '+parts.join(' · ')+' · '+n;
  chip.style.display='inline-flex';
  chip.title='Clicca per vedere i '+n+' papabili';
  chip.onclick=function(){ v20OpenResults(rep,idx); };
}
function v20Enhance(scope){
  if(!scope) return;
  var slots=scope.querySelectorAll('.wr-piano-slot');
  for(var i=0;i<slots.length;i++) v20EnhanceSlot(slots[i]);
}

function v20OpenBuilder(rep,idx){
  var d=v20GetSlot(rep,idx);
  if(!d) return;
  var existing=d.slot.ricerca||{};
  var selPR={}; (existing.posReali||[]).forEach(function(x){ selPR[v20norm(x)]=x; });
  var selF={}; (existing.fasce||[]).forEach(function(x){ selF[x]=true; });
  var posRealeOpts=(typeof getPosRealeOptions==='function')?getPosRealeOptions(rep):[];
  var fasciaOpts=(typeof FASCE_PER_RUOLO!=='undefined'&&FASCE_PER_RUOLO[rep])?FASCE_PER_RUOLO[rep]:[];

  var overlay=document.createElement('div');
  overlay.className='overlay'; overlay.id='v20BuilderOverlay';
  overlay.innerHTML=
    '<div class="modal">'
    +'<div class="modal-head"><h2>🔍 Ricerca · '+v20RepNome(rep)+' · slot '+(idx+1)+'</h2><button class="close-x" id="v20Bclose">✕</button></div>'
    +'<div class="settings-hint">Scegli i criteri: i giocatori in rosa che li rispettano tutti diventano i "papabili". Clicca le opzioni per attivarle/disattivarle, poi Salva.</div>'
    +'<div class="field"><label>Ruolo reale</label><div class="v20-chips" id="v20PRchips"></div></div>'
    +'<div class="field"><label>Fascia</label><div class="v20-chips" id="v20Fchips"></div></div>'
    +'<div class="v20-livecount" id="v20LiveCount"></div>'
    +'<div class="modal-actions">'
    +'<button class="btn danger" id="v20Bclear">Pulisci</button>'
    +'<button class="btn" id="v20Bannulla">Annulla</button>'
    +'<button class="btn primary" id="v20Bsave" style="flex:1;">Salva ricerca</button>'
    +'</div></div>';
  document.body.appendChild(overlay);

  var prWrap=overlay.querySelector('#v20PRchips');
  var fWrap=overlay.querySelector('#v20Fchips');
  function currentRicerca(){
    return {posReali:Object.keys(selPR).map(function(k){return selPR[k];}), fasce:Object.keys(selF)};
  }
  function buildPR(){
    prWrap.innerHTML='';
    if(!posRealeOpts.length){ prWrap.innerHTML='<span class="tag-picker-hint">Nessun ruolo reale censito per questo reparto: compila il campo "posizione reale" nelle schede dei giocatori.</span>'; return; }
    posRealeOpts.forEach(function(opt){
      var c=document.createElement('span');
      var on=selPR.hasOwnProperty(v20norm(opt));
      c.className='v20-toggle'+(on?' on':'');
      c.textContent=opt;
      c.onclick=function(){
        if(selPR.hasOwnProperty(v20norm(opt))) delete selPR[v20norm(opt)]; else selPR[v20norm(opt)]=opt;
        buildPR(); liveCount();
      };
      prWrap.appendChild(c);
    });
  }
  function buildF(){
    fWrap.innerHTML='';
    if(!fasciaOpts.length){ fWrap.innerHTML='<span class="tag-picker-hint">Nessuna fascia disponibile.</span>'; return; }
    fasciaOpts.forEach(function(opt){
      var c=document.createElement('span');
      var on=!!selF[opt];
      c.className='v20-toggle'+(on?' on':'');
      c.textContent=opt;
      c.onclick=function(){
        if(selF[opt]) delete selF[opt]; else selF[opt]=true;
        buildF(); liveCount();
      };
      fWrap.appendChild(c);
    });
  }
  function liveCount(){
    var n=v20FindMatches(rep,currentRicerca()).length;
    overlay.querySelector('#v20LiveCount').innerHTML='👥 <b>'+n+'</b> papabili in rosa con questi criteri';
  }
  buildPR(); buildF(); liveCount();

  function close(){ overlay.remove(); }
  overlay.querySelector('#v20Bclose').onclick=close;
  overlay.querySelector('#v20Bannulla').onclick=close;
  overlay.querySelector('#v20Bsave').onclick=function(){
    d.slot.ricerca=currentRicerca();
    if(typeof savePlan==='function') savePlan(d.plan, rep, idx);
    close(); v20Refresh(); showToast('Ricerca salvata');
  };
  overlay.querySelector('#v20Bclear').onclick=function(){
    d.slot.ricerca=null;
    if(typeof savePlan==='function') savePlan(d.plan, rep, idx);
    close(); v20Refresh(); showToast('Ricerca rimossa');
  };
}

function v20OpenResults(rep,idx){
  var d=v20GetSlot(rep,idx);
  if(!d) return;
  var ric=d.slot.ricerca;
  var matches=v20FindMatches(rep,ric);
  matches.sort(function(a,b){
    var ga=Number(a.golPrevisti)||0, gb=Number(b.golPrevisti)||0;
    if(gb!==ga) return gb-ga;
    return (Number(b.titolaritaVoto)||0)-(Number(a.titolaritaVoto)||0);
  });
  var parts=[];
  if(ric&&ric.posReali&&ric.posReali.length) parts.push(ric.posReali.join(', '));
  if(ric&&ric.fasce&&ric.fasce.length) parts.push(ric.fasce.join('/'));
  var rows='';
  if(!matches.length){
    rows='<div class="empty">Nessun giocatore in rosa rispetta questi criteri.</div>';
  } else {
    rows=matches.map(function(p){
      var already=d.slot.candidati&&d.slot.candidati.indexOf(p.id)>=0;
      return '<div class="quick-row" data-pid="'+p.id+'" style="cursor:pointer;">'
        +'<span><span class="badge '+(p.posFanta||'A')+' qbadge">'+(ROLE_LABEL[p.posFanta]||'-')+'</span> <span class="qname">'+escapeHtml(p.nome)+'</span> <span style="color:var(--chalk-dim);font-size:11px;">'+escapeHtml(p.squadra||'')+(p.posReale?' · '+escapeHtml(p.posReale):'')+(p.fascia?' · '+escapeHtml(p.fascia):'')+'</span></span>'
        +'<button class="btn small v20-addcand'+(already?' primary':'')+'" data-add="'+p.id+'">'+(already?'✓ candidato':'+ candidato')+'</button>'
        +'</div>';
    }).join('');
  }
  var overlay=document.createElement('div');
  overlay.className='overlay'; overlay.id='v20ResultsOverlay';
  overlay.innerHTML=
    '<div class="modal">'
    +'<div class="modal-head"><h2>🔍 Papabili · '+v20RepNome(rep)+' · slot '+(idx+1)+'</h2><button class="close-x" id="v20Rclose">✕</button></div>'
    +'<div class="settings-hint">'+escapeHtml(parts.join(' · '))+' · <b>'+matches.length+'</b> giocatori. Clicca una riga per aprire la scheda; "+ candidato" lo aggiunge ai candidati dello slot.</div>'
    +'<div id="v20ResultsList" style="max-height:420px;overflow-y:auto;">'+rows+'</div>'
    +'<div class="modal-actions"><button class="btn" id="v20Rclose2" style="flex:1;">Chiudi</button></div>'
    +'</div>';
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('#v20Rclose').onclick=close;
  overlay.querySelector('#v20Rclose2').onclick=close;
  overlay.querySelectorAll('.quick-row[data-pid]').forEach(function(row){
    row.onclick=function(e){
      if(e.target.closest&&e.target.closest('.v20-addcand')) return;
      v20Open(row.getAttribute('data-pid'));
    };
  });
  overlay.querySelectorAll('.v20-addcand').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var pid=btn.getAttribute('data-add');
      if(!d.slot.candidati) d.slot.candidati=[];
      if(d.slot.candidati.indexOf(pid)<0){
        d.slot.candidati.push(pid);
        if(typeof savePlan==='function') savePlan(d.plan, rep, idx);
        btn.textContent='✓ candidato'; btn.classList.add('primary');
        v20Refresh();
      }
    };
  });
}

// hooks
if(typeof window.bindPianoEvents==='function'){
  var __v20origBind=window.bindPianoEvents;
  window.bindPianoEvents=function(sec){
    var r=__v20origBind.apply(this,arguments);
    try{ v20Enhance(sec); }catch(e){ console.warn('kit v20',e); }
    return r;
  };
}
var __v20pending=false;
var __v20obs=new MutationObserver(function(){
  if(__v20pending) return;
  var sec=document.getElementById('wrSection');
  if(sec&&sec.querySelector('.wr-piano-slot')){
    __v20pending=true;
    setTimeout(function(){ __v20pending=false; try{ v20Enhance(sec);}catch(e){} },60);
  }
});
function __v20start(){
  if(document.body){ __v20obs.observe(document.body,{childList:true,subtree:true}); }
  else setTimeout(__v20start,200);
}
__v20start();
})();

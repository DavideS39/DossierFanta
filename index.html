function anyModalOpen(){
  if(WM.activeId) return true;
  return !!(document.getElementById('editorOverlay') || document.getElementById('astaSettingsOverlay') ||
    document.getElementById('assignFormOverlay') || document.getElementById('assignPickerOverlay') ||
    document.getElementById('rosterOverlay') || document.getElementById('settingsOverlay') ||
    document.getElementById('importOverlay') || document.getElementById('cardFieldsOverlay'));
}

function renderQuickMode(){
  const area = document.getElementById('quickFloatingPanel');
  if(leagueTeams.length === 0){
    area.innerHTML = '<div class="quick-panel-head"><b>⚡ Assegnazione rapida</b><button class="close-x" id="quickPanelClose">✕</button></div><div class="empty">Configura prima le squadre in ⚙️ Impostazioni asta.</div>';
    document.getElementById('quickPanelClose').onclick = toggleQuickMode;
    return;
  }
  if(!quickActiveTeam || !leagueTeams.some(t=>t.nome===quickActiveTeam)){
    quickActiveTeam = (leagueTeams.find(t=>t.isMine) || leagueTeams[0]).nome;
  }
  area.innerHTML = `
    <div class="quick-panel-head"><b>⚡ Assegnazione rapida</b><button class="close-x" id="quickPanelClose">✕</button></div>
    <div class="quick-bar">
      <div class="quick-teams-row" id="quickTeamsRow">
        ${leagueTeams.map((t,i) => `<span class="quick-team-pill ${t.nome===quickActiveTeam?'active':''}" data-team="${escapeHtml(t.nome)}">${i<9?`<span class="qkey">${i+1}</span>`:''}${escapeHtml(t.nome)}${t.isMine?' ★':''}</span>`).join('')}
      </div>
      <div class="quick-inputs">
        <input type="number" id="quickPrezzoInput" placeholder="Cr" inputmode="numeric">
        <input type="text" id="quickSearchInput" placeholder="Digita il nome..." autocomplete="off">
      </div>
      <div class="quick-toggle-row">
        <span>Assegna a <b style="color:var(--amber);">${escapeHtml(quickActiveTeam)}</b></span>
        <label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" id="quickShowTakenChk" ${quickShowTaken?'checked':''}> mostra già assegnati</label>
      </div>
      <div class="quick-budget-line" id="quickBudgetLine"></div>
      <div class="quick-hint">⌥/Alt+1-9 squadra · ↑↓ naviga · Invio assegna · Esc pulisci · Ctrl/⌘+Z annulla ultima</div>
      <div id="quickLastAssigned"></div>
    </div>
    <div id="quickPlayerList"></div>
  `;

  document.querySelectorAll('.quick-team-pill').forEach(el => {
    el.onclick = () => { quickActiveTeam = el.dataset.team; renderQuickMode(); document.getElementById('quickSearchInput').focus(); };
  });
  document.getElementById('quickPanelClose').onclick = toggleQuickMode;
  document.getElementById('quickShowTakenChk').onchange = (e) => { quickShowTaken = e.target.checked; quickHighlightIndex=-1; renderQuickList(); };
  document.getElementById('quickSearchInput').oninput = () => { quickHighlightIndex = -1; renderQuickList(); };
  document.getElementById('quickSearchInput').addEventListener('keydown', handleQuickSearchKeydown);
  document.getElementById('quickPrezzoInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('quickSearchInput').focus(); }
  });
  renderQuickList();
  renderQuickLastAssigned();
  document.getElementById('quickSearchInput').focus();
}

function handleQuickSearchKeydown(e){
  const items = getQuickFiltered();
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    quickHighlightIndex = Math.min(quickHighlightIndex+1, items.length-1);
    highlightQuickRow();
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    quickHighlightIndex = Math.max(quickHighlightIndex-1, 0);
    highlightQuickRow();
  } else if(e.key === 'Enter'){
    if(quickHighlightIndex>=0 && items[quickHighlightIndex]) quickAssignFromRow(items[quickHighlightIndex].id);
    else if(items.length === 1) quickAssignFromRow(items[0].id);
  } else if(e.key === 'Escape'){
    e.target.value = '';
    quickHighlightIndex = -1;
    renderQuickList();
  }
}

function highlightQuickRow(){
  document.querySelectorAll('#quickPlayerList .quick-row').forEach((el,i) => {
    el.classList.toggle('kbd-hl', i===quickHighlightIndex);
    if(i===quickHighlightIndex) el.scrollIntoView({block:'nearest'});
  });
}

// Scorciatoie globali: Alt+1-9 cambia squadra da qualsiasi campo, Ctrl/Cmd+Z annulla l'ultima assegnazione
document.addEventListener('keydown', (e) => {
  if(!quickMode || anyModalOpen()) return;
  if(e.altKey && /^[1-9]$/.test(e.key)){
    const idx = parseInt(e.key)-1;
    if(leagueTeams[idx]){ e.preventDefault(); quickActiveTeam = leagueTeams[idx].nome; renderQuickMode(); }
    return;
  }
  const tag = document.activeElement.tagName;
  const inTextInput = tag==='INPUT' || tag==='TEXTAREA';
  if(!inTextInput && /^[1-9]$/.test(e.key)){
    const idx = parseInt(e.key)-1;
    if(leagueTeams[idx]){ e.preventDefault(); quickActiveTeam = leagueTeams[idx].nome; renderQuickMode(); }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
e.preventDefault();
undoLastQuickAssign();
}
});
// ---------- v8: drag & drop giocatore → squadra + Alt+W cycle finestre ----------
document.addEventListener('dragstart', (e) => {
const card = e.target.closest && e.target.closest('.card[data-pid]');
if (card) {
e.dataTransfer.setData('text/plain', card.dataset.pid);
e.dataTransfer.effectAllowed = 'copy';
card.classList.add('dragging');
}
});
document.addEventListener('dragend', (e) => {
const card = e.target.closest && e.target.closest('.card[data-pid]');
if (card) card.classList.remove('dragging');
// pulizia di sicurezza: se il drag finisce in modo anomalo (es. rilasciato fuori da una
// zona valida, o Esc durante il trascinamento) e "dragleave" non arriva a ripulire
// l'evidenziazione, la togliamo comunque da tutte le possibili zone di drop.
document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
});
document.addEventListener('keydown', (e) => {
if (e.altKey && (e.key === 'w' || e.key === 'W') && WM.isDesktop && WM.windows.size > 0) {
e.preventDefault();
const ids = [...WM.windows.keys()];
const curIdx = ids.indexOf(WM.activeId);
const nextId = ids[(curIdx + 1) % ids.length];
const w = WM.windows.get(nextId);
if (w.minimized) WM.restore(nextId); else WM.focus(nextId);
}
});

function getQuickFiltered(){
  const q = (document.getElementById('quickSearchInput')?.value || '').trim().toLowerCase();
  let list = players;
  if(!quickShowTaken) list = list.filter(p => !p.asta);
  if(q) list = list.filter(p => (p.nome||'').toLowerCase().includes(q));
  return list.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).slice(0,60);
}

function renderQuickBudgetLine(){
  const el = document.getElementById('quickBudgetLine');
  if(!el || !quickActiveTeam) return;
  const teamRow = leagueTeams.find(t=>t.nome===quickActiveTeam);
  const budgetTot = teamRow && teamRow.budgetTotale!=null ? teamRow.budgetTotale : auctionSettings.budgetTotale;
  const {spent, slotsFilled} = computeTeamStats(quickActiveTeam);
  const remaining = budgetTot - spent;
  const low = remaining < budgetTot*0.15;
  const slots = auctionSettings.slots;
  el.innerHTML = `Budget: <b class="${low?'low':''}">${remaining}</b>/${budgetTot}cr rimasti · Slot: P <b>${slotsFilled.P}/${slots.P}</b> · D <b>${slotsFilled.D}/${slots.D}</b> · C <b>${slotsFilled.C}/${slots.C}</b> · A <b>${slotsFilled.A}/${slots.A}</b>`;
}

function renderQuickList(){
  renderQuickBudgetLine();
  const listEl = document.getElementById('quickPlayerList');
  if(!listEl) return;
  const items = getQuickFiltered();
  if(items.length === 0){ listEl.innerHTML = '<div class="empty">Nessun giocatore trovato.</div>'; return; }
  listEl.innerHTML = items.map((p,i) => {
    let hint = '';
    if(!p.asta && auctionSettings.modalitaAsta && p.fascia){
      const temp = computeMarketTemperature(p.posFanta, p.fascia);
      const t = TEMP_LABELS[temp.level];
      const parts = [`${t.icon} ${p.fascia}`];
      if(p.valoreEffettivo!=null) parts.push(`tetto ${p.valoreEffettivo}cr`);
      hint = `<span class="qtaken-label">${parts.join(' · ')}</span>`;
    }
    return `
    <div class="quick-row ${p.asta?'taken':''} ${i===quickHighlightIndex?'kbd-hl':''}" data-id="${p.id}">
      <span><span class="badge ${p.posFanta||'A'} qbadge">${ROLE_LABEL[p.posFanta]||'-'}</span><span class="qname">${escapeHtml(p.nome)}</span></span>
      ${p.asta ? `<span class="qtaken-label">${escapeHtml(p.asta.team)} · ${p.asta.prezzo}cr</span>` : hint}
    </div>
  `;
  }).join('');
  listEl.querySelectorAll('.quick-row').forEach(el => {
    el.onclick = () => quickAssignFromRow(el.dataset.id);
    el.onmouseenter = () => { quickHighlightIndex = items.findIndex(p=>p.id===el.dataset.id); highlightQuickRow(); };
  });
}

async function quickAssignFromRow(playerId){
  const prezzoInput = document.getElementById('quickPrezzoInput');
  const prezzo = prezzoInput.value;
  if(prezzo === '' || isNaN(parseFloat(prezzo))){ showToast('Inserisci prima il prezzo'); prezzoInput.focus(); return; }
  const p = players.find(x=>x.id===playerId);
  quickAssignLog.push({ playerId, playerName: p?p.nome:'', team: quickActiveTeam, prezzo, ts: Date.now() });
  if(quickAssignLog.length > 10) quickAssignLog.shift();
  showToast(`${p?p.nome:'Giocatore'} → ${quickActiveTeam} (${prezzo}cr)`);
  prezzoInput.value = '';
  document.getElementById('quickSearchInput').value = '';
  quickHighlightIndex = -1;
  document.getElementById('quickSearchInput').focus();
  assignPlayer(playerId, quickActiveTeam, prezzo);
  renderQuickList();
  renderQuickLastAssigned();
}

async function undoLastQuickAssign(){
  const entry = quickAssignLog.pop();
  if(!entry){ showToast('Niente da annullare'); return; }
  await unassignPlayer(entry.playerId);
  showToast(`Annullato: ${entry.playerName}`);
  renderQuickList();
  renderQuickLastAssigned();
}

function renderQuickLastAssigned(){
  const el = document.getElementById('quickLastAssigned');
  if(!el) return;
  if(quickAssignLog.length === 0){ el.innerHTML = ''; return; }
  const last = quickAssignLog[quickAssignLog.length-1];
  el.innerHTML = `<div class="quick-toggle-row" style="margin-top:6px;">
    <span>✅ Ultimo: <b>${escapeHtml(last.playerName)}</b> → ${escapeHtml(last.team)} (${last.prezzo}cr)</span>
    <span class="ai-raw-toggle" id="undoLastBtn">↩ annulla</span>
  </div>`;
  document.getElementById('undoLastBtn').onclick = undoLastQuickAssign;
}

function renderFieldHtml(f, value, ctx){
const val = value==null ? '' : value;
if(f.type==='posReale'){
const role = ctx && ctx.posFanta;
return `<input id="f_${f.k}" list="posRealeListGlobal" value="${escapeHtml(val)}" placeholder="Scrivi o scegli..." autocomplete="off"><datalist id="posRealeListGlobal">${getPosRealeOptions(role).map(o=>`<option value="${escapeHtml(o)}">`).join('')}</datalist>`;
}
if(f.type==='checkbox'){
const checked = (f.k==='_fuoriSerieA') ? !!(ctx && ctx.custom && ctx.custom.fuoriSerieA) : !!val;
return `<label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; padding:6px 0;"><input type="checkbox" id="f_${f.k}" ${checked?'checked':''}> ${f.k==='_fuoriSerieA'?'Questo giocatore non è più in Serie A':''}</label>`;
}
if(f.type==='select'){
return `<select id="f_${f.k}">` + f.options.map(o => `<option value="${o[0]}" ${String(val)===String(o[0])?'selected':''}>${o[1]}</option>`).join('') + `</select>`;
}
  if(f.type==='textarea'){
    return `<textarea id="f_${f.k}">${escapeHtml(val)}</textarea>`;
  }
  if(f.type==='team'){
    return `<input id="f_${f.k}" list="teamNamesList" value="${escapeHtml(val)}" placeholder="Nome squadra">`;
  }
  if(f.type==='tags'){
    return `<input id="f_${f.k}" value="${escapeHtml(Array.isArray(val)?val.join(', '):val)}" placeholder="es. must buy, occasione">`;
  }
  if(f.type==='number'){
    return `<input id="f_${f.k}" type="number" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} value="${val}">`;
  }
  return `<input id="f_${f.k}" type="text" value="${escapeHtml(val)}">`;
}

function sectionFields(sec){
  return sec.subsections ? sec.subsections.flatMap(ss => ss.fields) : sec.fields;
}

function renderSectionsForm(sections, dataObj){
  const fieldDiv = f => `<div class="field${f.type==='textarea'?' field-wide':''}"><label>${f.label}</label>${renderFieldHtml(f, dataObj[f.k], dataObj)}</div>`;
  return sections.map((sec,i) => `
    <details class="section-block" data-section-key="${sec.key}" ${i===0?'open':''}>
      <summary>${sec.label}</summary>
      <div class="section-body${sec.subsections?' has-subsections':''}">
        ${sec.subsections
          ? sec.subsections.map(ss => `
              <details class="subsection-block">
                <summary>${ss.label}</summary>
                <div class="subsection-body">
                  ${ss.fields.map(fieldDiv).join('')}
                </div>
              </details>
            `).join('')
          : sec.fields.map(fieldDiv).join('')
        }
      </div>
    </details>
  `).join('');
}

function collectFormData(sections){
  const result = {};
  sections.forEach(sec => sectionFields(sec).forEach(f => {
    const el = document.getElementById('f_'+f.k);
    if(!el) return;
    let val = el.value;
    if(f.type==='number'){ val = val===''? null : parseFloat(val); }
    else if(f.type==='tags'){ val = val.split(',').map(s=>s.trim()).filter(Boolean); }
    else if(f.type==='select' && (f.k==='priorita')){ val = parseInt(val)||0; }
    else { val = typeof val === 'string' ? val.trim() : val; }
    result[f.k] = val;
  }));
  return result;
}


// ========== WINDOW MANAGER ==========
const WM = {
  windows: new Map(),
  zCounter: 100,
  nextId: 0,
  isDesktop: window.matchMedia('(min-width: 1024px)').matches,

  _mqListener: null,
  initResponsive() {
    if (this._mqListener) return;
    const mq = window.matchMedia('(min-width: 1024px)');
    this._mqListener = (e) => {
      this.isDesktop = e.matches;
      // When switching to mobile, close all WM windows gracefully
      if (!this.isDesktop && this.windows.size > 0) {
        [...this.windows.keys()].forEach(wid => this.close(wid));
      }
    };
    mq.addEventListener('change', this._mqListener);
  },

  create(options) {
    const winId = 'wm_' + (++this.nextId);
    const el = document.createElement('div');
    el.className = 'wm-window';
    el.dataset.winId = winId;

    // Default size and position
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.min(740, vw - 80);
    const h = Math.min(vh - 100, 620);
    const slotIdx = this.windows.size % 10;
    const ox = 60 + slotIdx * 32;
    const oy = 40 + slotIdx * 28;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = Math.min(ox, vw - w - 20) + 'px';
    el.style.top = Math.min(oy, vh - h - 20) + 'px';

    el.innerHTML = `
      <div class="wm-chrome">
        <span class="wm-title">${escapeHtml(options.title || 'Finestra')}</span>
        <div class="wm-chrome-btns">
          <button class="wm-chrome-btn minimize" title="Riduci a icona">&#8212;</button>
          <button class="wm-chrome-btn close" title="Chiudi">&#10005;</button>
        </div>
      </div>
      <div class="wm-body"></div>
      <div class="wm-resize"></div>
    `;
    document.body.appendChild(el);

    const body = el.querySelector('.wm-body');
    const win = {
      el, body, title: options.title || '',
      type: options.type || 'unknown',
      recordId: options.recordId || null,
      state: options.state || {},
      onClose: options.onClose || null,
      minimized: false,
    };
    this.windows.set(winId, win);

    // Chrome button handlers
    el.querySelector('.wm-chrome-btn.close').onclick = () => this.close(winId);
    el.querySelector('.wm-chrome-btn.minimize').onclick = () => this.minimize(winId);

    // Focus on click anywhere in window
    el.addEventListener('pointerdown', () => this.focus(winId), true);

    this.initDrag(winId);
    this.initResize(winId);
    this.focus(winId);
    this.updateTaskbar();
    return winId;
  },

  close(winId) {
    const win = this.windows.get(winId);
    if (!win) return;
    if (win.onClose) {
      try { win.onClose(winId, win); } catch(e) { console.error('WM onClose error', e); }
    }
    win.el.remove();
    this.windows.delete(winId);
    this.updateTaskbar();
    if (this.activeId === winId) {
      const remaining = [...this.windows.keys()];
      this.activeId = remaining.length ? remaining[remaining.length - 1] : null;
    }
  },

  focus(winId) {
    const win = this.windows.get(winId);
    if (!win) return;
    this.zCounter++;
    win.el.style.zIndex = this.zCounter;
    this.windows.forEach((w, id) => w.el.classList.toggle('wm-focused', id === winId));
    this.activeId = winId;
    this.updateTaskbar();
  },

  minimize(winId) {
    const win = this.windows.get(winId);
    if (!win) return;
    win.el.style.display = 'none';
    win.minimized = true;
    this.updateTaskbar();
  },

  restore(winId) {
    const win = this.windows.get(winId);
    if (!win) return;
    win.el.style.display = '';
    win.minimized = false;
    this.focus(winId);
  },

  updateTaskbar() {
    const bar = document.getElementById('wmTaskbar');
    if (!bar) return;
    bar.innerHTML = [...this.windows.entries()].map(([id, w]) =>
      `<span class="wm-taskbar-item ${id===this.activeId?'active':''} ${w.minimized?'minimized':''}" data-win-id="${id}">${escapeHtml(w.title)}</span>`
    ).join('');
    bar.querySelectorAll('.wm-taskbar-item').forEach(el => {
      el.onclick = () => {
        const wid = el.dataset.winId;
        const w = this.windows.get(wid);
        if (!w) return;
        if (w.minimized) this.restore(wid);
        else if (this.activeId === wid) this.minimize(wid);
        else this.focus(wid);
      };
    });
  },

  initDrag(winId) {
const win = this.windows.get(winId);
const chrome = win.el.querySelector('.wm-chrome');
let dragging = false, sx, sy, ol, ot;
chrome.addEventListener('pointerdown', (e) => {
if (e.target.closest('.wm-chrome-btn')) return;
dragging = true;
chrome.setPointerCapture(e.pointerId);
if (win.snapped && win.preSnap) {
win.el.style.width = win.preSnap.width + 'px';
win.el.style.height = win.preSnap.height + 'px';
win.el.style.left = Math.max(0, e.clientX - win.preSnap.width / 2) + 'px';
win.el.style.top = Math.max(0, e.clientY - 24) + 'px';
win.snapped = null;
}
sx = e.clientX; sy = e.clientY;
ol = win.el.offsetLeft; ot = win.el.offsetTop;
});
chrome.addEventListener('pointermove', (e) => {
if (!dragging) return;
const nx = ol + e.clientX - sx;
const ny = ot + e.clientY - sy;
win.el.style.left = Math.max(0, nx) + 'px';
win.el.style.top = Math.max(0, ny) + 'px';
this.updateSnapPreview(e.clientX, e.clientY);
});
chrome.addEventListener('pointerup', (e) => {
if (!dragging) return;
dragging = false;
const zone = this.snapZoneFor(e.clientX, e.clientY);
this.hideSnapPreview();
if (zone) this.applySnap(winId, zone);
});
chrome.addEventListener('pointercancel', () => { dragging = false; this.hideSnapPreview(); });
chrome.addEventListener('dblclick', (e) => {
if (e.target.closest('.wm-chrome-btn')) return;
this.toggleMax(winId);
});
},
snapZoneFor(x, y) {
const vw = window.innerWidth;
if (y < 12) return 'max';
if (x < 16) return 'left';
if (x > vw - 16) return 'right';
return null;
},
updateSnapPreview(x, y) {
const zone = this.snapZoneFor(x, y);
let pv = document.getElementById('wmSnapPreview');
if (!zone) { if (pv) pv.style.display = 'none'; return; }
if (!pv) { pv = document.createElement('div'); pv.id = 'wmSnapPreview'; document.body.appendChild(pv); }
const vw = window.innerWidth, vh = window.innerHeight, TB = 50;
pv.style.display = 'block';
if (zone === 'max') { pv.style.left='6px'; pv.style.top='6px'; pv.style.width=(vw-12)+'px'; pv.style.height=(vh-TB-10)+'px'; }
else if (zone === 'left') { pv.style.left='6px'; pv.style.top='6px'; pv.style.width=(vw/2-10)+'px'; pv.style.height=(vh-TB-10)+'px'; }
else { pv.style.left=(vw/2+4)+'px'; pv.style.top='6px'; pv.style.width=(vw/2-10)+'px'; pv.style.height=(vh-TB-10)+'px'; }
},
hideSnapPreview() {
const pv = document.getElementById('wmSnapPreview');
if (pv) pv.style.display = 'none';
},
applySnap(winId, zone) {
const win = this.windows.get(winId);
if (!win) return;
if (!win.snapped) {
win.preSnap = { left: win.el.offsetLeft, top: win.el.offsetTop, width: win.el.offsetWidth, height: win.el.offsetHeight };
}
const vw = window.innerWidth, vh = window.innerHeight, TB = 50;
win.el.style.transition = 'left .18s ease, top .18s ease, width .18s ease, height .18s ease';
if (zone === 'max') { win.el.style.left='4px'; win.el.style.top='4px'; win.el.style.width=(vw-8)+'px'; win.el.style.height=(vh-TB-8)+'px'; }
else if (zone === 'left') { win.el.style.left='6px'; win.el.style.top='6px'; win.el.style.width=(vw/2-10)+'px'; win.el.style.height=(vh-TB-10)+'px'; }
else { win.el.style.left=(vw/2+4)+'px'; win.el.style.top='6px'; win.el.style.width=(vw/2-10)+'px'; win.el.style.height=(vh-TB-10)+'px'; }
win.snapped = zone;
setTimeout(() => { win.el.style.transition = ''; }, 220);
},
toggleMax(winId) {
const win = this.windows.get(winId);
if (!win) return;
if (win.snapped === 'max') {
if (win.preSnap) {
win.el.style.transition = 'left .18s ease, top .18s ease, width .18s ease, height .18s ease';
win.el.style.left = win.preSnap.left + 'px';
win.el.style.top = win.preSnap.top + 'px';
win.el.style.width = win.preSnap.width + 'px';
win.el.style.height = win.preSnap.height + 'px';
setTimeout(() => { win.el.style.transition = ''; }, 220);
}
win.snapped = null;
} else {
this.applySnap(winId, 'max');
}
},

  initResize(winId) {
    const win = this.windows.get(winId);
    const handle = win.el.querySelector('.wm-resize');
    let resizing = false, sx, sy, ow, oh;
    handle.addEventListener('pointerdown', (e) => {
resizing = true;
win.snapped = null;
handle.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY;
      ow = win.el.offsetWidth; oh = win.el.offsetHeight;
      e.stopPropagation(); e.preventDefault();
    });
    handle.addEventListener('pointermove', (e) => {
      if (!resizing) return;
      win.el.style.width = Math.max(380, ow + e.clientX - sx) + 'px';
      win.el.style.height = Math.max(280, oh + e.clientY - sy) + 'px';
    });
    handle.addEventListener('pointerup', () => { resizing = false; });
    handle.addEventListener('pointercancel', () => { resizing = false; });
  }
};

function $f(container, name) {
  return container.querySelector('[data-field="' + name + '"]');
}

function renderFieldHtmlScoped(f, value, ctx) {
const val = value == null ? '' : value;
const attr = 'data-field="f_' + f.k + '"';
if (f.type === 'posReale') {
const role = ctx && ctx.posFanta;
const dlId = 'posRealeList_' + Math.random().toString(36).slice(2, 8);
return '<input ' + attr + ' list="' + dlId + '" value="' + escapeHtml(val) + '" placeholder="Scrivi o scegli..." autocomplete="off">' +
'<datalist id="' + dlId + '" data-field="posRealeDatalist">' + getPosRealeOptions(role).map(o => '<option value="' + escapeHtml(o) + '"></option>').join('') + '</datalist>';
}
if (f.type === 'checkbox') {
const checked = (f.k === '_fuoriSerieA') ? !!(ctx && ctx.custom && ctx.custom.fuoriSerieA) : !!val;
return '<label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; padding:6px 0;"><input type="checkbox" ' + attr + ' ' + (checked ? 'checked' : '') + '> ' + (f.k === '_fuoriSerieA' ? 'Questo giocatore non è più in Serie A' : '') + '</label>';
}
if (f.type === 'select') {
    return '<select ' + attr + '>' + f.options.map(o => '<option value="' + o[0] + '" ' + (String(val) === String(o[0]) ? 'selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
  }
  if (f.type === 'textarea') {
    return '<textarea ' + attr + '>' + escapeHtml(val) + '</textarea>';
  }
  if (f.type === 'team') {
    return '<input ' + attr + ' list="teamNamesList" value="' + escapeHtml(val) + '" placeholder="Nome squadra">';
  }
  if (f.type === 'tags') {
    return '<input ' + attr + ' value="' + escapeHtml(Array.isArray(val) ? val.join(', ') : val) + '" placeholder="es. must buy, occasione">';
  }
  if (f.type === 'number') {
    return '<input ' + attr + ' type="number"' + (f.step ? ' step="' + f.step + '"' : '') + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + ' value="' + escapeHtml(val) + '">';
  }
  return '<input ' + attr + ' type="text" value="' + escapeHtml(val) + '">';
}

function renderSectionsFormScoped(sections, dataObj) {
  const fieldDiv = (f) => '<div class="field' + (f.type === 'textarea' ? ' field-wide' : '') + '"><label>' + f.label + '</label>' + renderFieldHtmlScoped(f, dataObj[f.k], dataObj) + '</div>';
  return sections.map((sec, i) => `
    <details class="section-block" data-section-key="${sec.key}" ${i === 0 ? 'open' : ''}>
      <summary>${sec.label}</summary>
      <div class="section-body${sec.subsections ? ' has-subsections' : ''}">
        ${sec.subsections
          ? sec.subsections.map(ss => `
              <details class="subsection-block">
                <summary>${ss.label}</summary>
                <div class="subsection-body">
                  ${ss.fields.map(fieldDiv).join('')}
                </div>
              </details>
            `).join('')
          : sec.fields.map(fieldDiv).join('')
        }
      </div>
    </details>
  `).join('');
}

function collectFormDataScoped(sections, container) {
  const result = {};
  sections.forEach(sec => sectionFields(sec).forEach(f => {
    const el = $f(container, 'f_' + f.k);
    if (!el) return;
    let val = el.value;
    if (f.type === 'number') { val = val === '' ? null : parseFloat(val); }
    else if (f.type === 'tags') { val = val.split(',').map(s => s.trim()).filter(Boolean); }
    else if (f.type === 'select' && (f.k === 'priorita')) { val = parseInt(val) || 0; }
    else { val = typeof val === 'string' ? val.trim() : val; }
    result[f.k] = val;
  }));
  return result;
}

function openPlayerWindow(id) {
  if (!WM.isDesktop) { openEditor('player', id); return; }
  // If this player is already open in a window, focus it
  if (id) {
    for (const [wid, w] of WM.windows) {
      if (w.state.type === 'player' && w.state.recordId === id) {
        WM.focus(wid);
        if (w.minimized) WM.restore(wid);
        return;
      }
    }
  }

  const rec = id ? players.find(p => p.id === id) : null;
  const roleName = rec ? (ROLE_LABEL[rec.posFanta] || '-') : '';
  const title = (rec ? rec.nome : 'Nuovo giocatore') + (roleName ? ' (' + roleName + ')' : '');

  const winId = WM.create({
    type: 'player', recordId: id, title: title,
  });
  const win = WM.windows.get(winId);
  win.state = {
    type: 'player',
    recordId: id,
    baseline: rec ? JSON.parse(JSON.stringify(rec)) : {},
    customFields: (rec && rec.custom) ? Object.entries(rec.custom).filter(([k]) => !INTERNAL_CUSTOM_KEYS.includes(k)).map(([k, v]) => ({k, v})) : [],
    tags: (rec && rec.tag) ? rec.tag.slice() : [],
    autosaveTimer: null,
  };

  win.onClose = (wid, w) => {
    clearTimeout(w.state.autosaveTimer);
    doAutosaveScoped(wid).catch(e => console.error('Final autosave error', e));
  };

  win.body.innerHTML = buildPlayerEditorBody(rec);
  bindPlayerEditorEvents(winId, rec);
  renderCustomFieldsScoped(winId);
  renderTagPickerScoped(winId);
  $f(win.body, 'aiSummaryArea').innerHTML = renderAiSummaryBlock(rec || {});
  bindAiSummaryHandlersScoped(winId);
  renderHighlightsSectionScoped(winId, rec || {});
  renderAstaValutazioneScoped(winId, rec || {});
  renderPlayerTeamTagsRowScoped(winId, rec || {});

  const dynFields = $f(win.body, 'dynamicFields');
  if (dynFields) {
    dynFields.addEventListener('input', () => scheduleAutosaveScoped(winId));
    dynFields.addEventListener('change', () => scheduleAutosaveScoped(winId));
  }
}

function bindPlayerEditorEvents(winId, rec) {
  const win = WM.windows.get(winId);

  $f(body, 'addCustomField').onclick = () => {

  };

  });

if (posFantaEl) posFantaEl.addEventListener('change', () => { renderAstaValutazioneScoped(winId, rec || {}, true); refreshPosRealeScoped(winId); });

function scheduleAutosaveScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win) return;
  const statusEl = $f(win.body, 'saveStatus');
  if (statusEl) statusEl.textContent = 'Modifiche in corso...';
  clearTimeout(win.state.autosaveTimer);
  win.state.autosaveTimer = setTimeout(() => doAutosaveScoped(winId), 1200);
}

async function doAutosaveScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win || win.state.type !== 'player') return;
  const body = win.body;

  const formData = collectFormDataScoped(PLAYER_SECTIONS, body);
  if (!formData.nome || !formData.nome.trim()) {
    const statusEl = $f(body, 'saveStatus');
    if (statusEl) statusEl.textContent = 'Inserisci almeno il nome per salvare';
    return;
  }

  const id = win.state.recordId;
  const existing = id ? players.find(p => p.id === id) : null;
  const existingData = existing ? Object.fromEntries(Object.entries(existing).filter(([k]) => k !== 'id')) : {};
  const data = { ...existingData, ...formData };

  const custom = { ...(data.custom || {}) };
Object.keys(custom).forEach(k => { if (!INTERNAL_CUSTOM_KEYS.includes(k) && !win.state.customFields.some(cf => cf.k && cf.k.trim() === k)) delete custom[k]; });
win.state.customFields.forEach(cf => { if (cf.k && cf.k.trim()) custom[cf.k.trim()] = cf.v; });

data.custom = custom;
  data.tag = win.state.tags.slice();

  const fasciaEl = $f(body, 'f_fascia');
  const valoreEffEl = $f(body, 'f_valoreEffettivo');
  const prezzoPrevEl = $f(body, 'f_prezzoPrevistoNum');
  if (fasciaEl) data.fascia = fasciaEl.value || null;
  if (valoreEffEl) data.valoreEffettivo = valoreEffEl.value === '' ? null : parseFloat(valoreEffEl.value);
  if (prezzoPrevEl) data.prezzoPrevisto = prezzoPrevEl.value === '' ? null : parseFloat(prezzoPrevEl.value);

  data.updatedBy = myName || 'anonimo';
  data.updatedAt = new Date().toISOString();

  const finalId = id || uid('p');
  win.state.recordId = finalId;
  const rec = { id: finalId, ...data };

  const idx = players.findIndex(p => p.id === finalId);
  if (idx > -1) players[idx] = rec; else players.push(rec);

  try {
    const changed = computeChangedFields(win.state.baseline, data);
    const merged = await mergeSaveRow('players', finalId, changed);
    if (merged) {
      win.state.baseline = Object.assign({}, win.state.baseline, changed);
      const idx2 = players.findIndex(p => p.id === finalId);
      const mergedRec = Object.assign({id: finalId}, merged);
      if (idx2 > -1) players[idx2] = mergedRec; else players.push(mergedRec);
    }
    const statusEl = $f(body, 'saveStatus');
    if (statusEl) statusEl.textContent = 'Salvato ✓ · ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    console.error('Errore salvataggio giocatore:', e);
    const statusEl = $f(body, 'saveStatus');
    if (statusEl) statusEl.textContent = 'Errore di salvataggio, controlla la connessione';
  }
  // Non aggiornare i datalist durante autosave per evitare di perdere il focus negli input
  // renderAllTagsDatalist();
  // Non fare render() completo durante autosave per non perdere il focus negli input
  // render();
  // if (currentTab === 'compare') renderCompare();
}

function ensureAstaValutazioneAreaScoped(body){
  let area = $f(body, 'astaValutazioneArea');
  if(area) return area;
  const dynamicFields = body.querySelector('[data-field="dynamicFields"]');
  const prevBody = dynamicFields && dynamicFields.querySelector('[data-section-key="previsioni"] .section-body');
  if(!prevBody) return null;
  area = document.createElement('div');
  area.setAttribute('data-field', 'astaValutazioneArea');
  area.className = 'asta-valutazione-inline';
  prevBody.appendChild(area);
  return area;
}

function renderAstaValutazioneScoped(winId, rec, refreshOnly) {
  const win = WM.windows.get(winId);
  const body = win.body;
  const area = ensureAstaValutazioneAreaScoped(body);
  if (!area) return;
  const posFantaEl = $f(body, 'f_posFanta');
  const reparto = posFantaEl ? posFantaEl.value : (rec.posFanta || 'C');
  const fasce = FASCE_PER_RUOLO[reparto] || FASCE_PER_RUOLO.C;
  const currentFascia = (refreshOnly && !fasce.includes(rec.fascia)) ? fasce[0] : (rec.fascia && fasce.includes(rec.fascia) ? rec.fascia : fasce[0]);

  area.innerHTML = `
    <div class="field"><label>Fascia (${reparto})</label>
      <select data-field="f_fascia">${fasce.map(f => '<option value="' + f + '" ' + (f === currentFascia ? 'selected' : '') + '>' + f + '</option>').join('')}</select>
    </div>
    <div class="field-row">
      <div class="field"><label>Valore effettivo (tuo tetto)</label><input type="number" data-field="f_valoreEffettivo" value="${rec.valoreEffettivo ?? ''}" placeholder="es. 60"></div>
      <div class="field"><label>Prezzo previsto (tuo, manuale)</label><input type="number" data-field="f_prezzoPrevistoNum" value="${rec.prezzoPrevisto ?? ''}" placeholder="es. 70"></div>
    </div>
    ${auctionSettings.modalitaAsta ? `
      <div data-field="autoPredictedBox" class="ai-empty"></div>
      <div data-field="marketTempBox" class="ai-empty"></div>
      <div data-field="rivalsBox" class="ai-empty"></div>
    ` : '<div class="ai-empty">Previsione automatica, temperatura di mercato e rivali attivi compaiono qui durante l\'asta.</div>'}
  `;

  const refresh = () => {
    if (!auctionSettings.modalitaAsta) return;
    const fasciaVal = $f(body, 'f_fascia').value;
    const auto = computeAutoPredictedPrice(reparto, fasciaVal, rec);
    const apBox = $f(body, 'autoPredictedBox');
    if (apBox) apBox.innerHTML = auto
      ? '🤖 Previsione automatica: <b>~' + auto.value + ' cr</b> <span style="color:var(--chalk-dim);">(' + autoPredictedSourceLabel(auto) + ')</span>'
      : '🤖 Previsione automatica: <span style="color:var(--chalk-dim);">dati insufficienti per ora</span>';
    const temp = computeMarketTemperature(reparto, fasciaVal);
    const t = TEMP_LABELS[temp.level];
    const mtBox = $f(body, 'marketTempBox');
    if (mtBox) mtBox.innerHTML = t.icon + ' Mercato ' + reparto + '/' + fasciaVal + ': <b>' + t.label + '</b><br><span style="color:var(--chalk-dim); font-size:11.5px;">' + t.hint + (temp.count?(' · '+temp.count+' vendite confrontate'+(temp.manualCount?(' ('+temp.manualCount+' con tua stima, '+(temp.count-temp.manualCount)+' con FVM)'):' (da FVM)')+marketTempConfidenceNote(temp)):'') + '</span>';
    const rivals = computeRivalsActiveInReparto(reparto);
    const rbBox = $f(body, 'rivalsBox');
    if (rbBox) rbBox.innerHTML = rivals.length
      ? '👀 Rivali ancora attivi su ' + reparto + ': ' + rivals.map(r => escapeHtml(r.nome) + ' (' + r.remaining + 'cr, ' + r.slotsLeft + ' slot)').join(' · ')
      : '👀 Nessun rivale con slot liberi su ' + reparto + ' al momento.';
  };

  $f(body, 'f_fascia').onchange = () => { refresh(); scheduleAutosaveScoped(winId); };
  $f(body, 'f_valoreEffettivo').addEventListener('input', () => scheduleAutosaveScoped(winId));
  $f(body, 'f_prezzoPrevistoNum').addEventListener('input', () => { refresh(); scheduleAutosaveScoped(winId); });
  refresh();
}

function bindAiSummaryHandlersScoped(winId) {
  const win = WM.windows.get(winId);
  const body = win.body;
  const btn = $f(body, 'aiGenerateBtn');
  if (btn) btn.onclick = () => generateAiSummaryScoped(winId);
  const asyncBtn = $f(body, 'aiAsyncBtn');
  if (asyncBtn) asyncBtn.onclick = () => requestAsyncSummaryScoped(winId);
  const emergencyBtn = $f(body, 'aiEmergencyBtn');
  if (emergencyBtn) emergencyBtn.onclick = () => generateAiSummaryScoped(winId, 'openrouter');
  const cancelBtn = $f(body, 'aiCancelBtn');
  if (cancelBtn) cancelBtn.onclick = () => cancelAsyncRequestScoped(winId);
}

async function generateAiSummaryScoped(winId, forceMode) {
  const win = WM.windows.get(winId);
  if (!win) return;
  const body = win.body;
  const btn = $f(body, 'aiGenerateBtn');
  const activeMode = forceMode || aiSettings.mode;
  if (btn) { btn.disabled = true; btn.textContent = 'Generazione in corso...'; }
  try {
    await doAutosaveScoped(winId);
    const p = players.find(x => x.id === win.state.recordId);
    if (!p) throw new Error('Salva prima almeno il nome del giocatore');
    const userPrompt = buildUserPrompt(p);
    const rawText = activeMode === 'lmstudio' ? await callLmStudio(userPrompt) : await callOpenRouter(userPrompt);
    const parsed = parseAiResponse(rawText);
    const aiSummary = {
      ...parsed,
      generatedAt: new Date().toISOString(),
      generatedBy: myName || 'anonimo',
      sourceHash: computeNotesSignature(p),
      mode: activeMode,
      model: activeMode === 'lmstudio' ? (aiSettings.lmstudioModel || 'modello locale') : activeMode === 'ollama' ? (aiSettings.ollamaModel || 'Ollama') : aiSettings.openrouterModel
    };
    p.aiSummary = aiSummary;
    p.aiRequest = null;
    await persistPlayer(p, ['aiSummary','aiRequest']);
    // Non aggiornare i datalist dopo generazione AI per evitare di perdere il focus
    // renderAllTagsDatalist();
    // Non fare render() completo dopo generazione AI per non perdere il focus
    // render();
    // if (currentTab === 'compare') renderCompare();
    refreshAiSummaryAreaScoped(winId, p);
    showToast(parsed.parseFailed ? 'Riassunto generato ma formato inatteso' : 'Riassunto generato');
  } catch(e) {
    console.error(e);
    showToast(e.message || 'Errore nella generazione del riassunto');
if (btn) { btn.disabled = false; btn.textContent = '✨ Riprova'; }
const p = players.find(x => x.id === win.state.recordId);
const area = $f(win.body, 'aiSummaryArea');
if (area) { area.innerHTML = renderAiSummaryBlock(p || {}) + '<div class="stale-warn" style="margin-top:10px;">❌ ' + escapeHtml(e.message || String(e)) + '</div>'; bindAiSummaryHandlersScoped(winId); }
  }
}

async function requestAsyncSummaryScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win) return;
  await doAutosaveScoped(winId);
  const p = players.find(x => x.id === win.state.recordId);
  if (!p) { showToast('Salva prima almeno il nome del giocatore'); return; }
  p.aiRequest = { status: 'pending', requestedBy: myName || 'anonimo', requestedAt: new Date().toISOString() };
  await persistPlayer(p, ['aiRequest']);
  // Non aggiornare i datalist dopo richiesta AI per evitare di perdere il focus
  // renderAllTagsDatalist();
  // Non fare render() completo per non perdere il focus
  // render();
  refreshAiSummaryAreaScoped(winId, p);
  showToast('Richiesta in coda: verrà elaborata quando accendi lo script sul PC');
}

async function cancelAsyncRequestScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win) return;
  const p = players.find(x => x.id === win.state.recordId);
  if (!p) return;
  p.aiRequest = null;
  await persistPlayer(p, ['aiRequest']);
  render();
  refreshAiSummaryAreaScoped(winId, p);
  showToast('Richiesta annullata');
}

function refreshAiSummaryAreaScoped(winId, p) {

  const area = $f(win.body, 'aiSummaryArea');

function openTeamWindow(id) {
  if (!WM.isDesktop) { openEditor('team', id); return; }
  // If this team is already open in a window, focus it
  if (id) {
    for (const [wid, w] of WM.windows) {
      if (w.state.type === 'team' && w.state.recordId === id) {
        WM.focus(wid);
        if (w.minimized) WM.restore(wid);
        return;
      }
    }
  }

  const rec = id ? teams.find(t => t.id === id) : null;
  const title = rec ? rec.nome : 'Nuova squadra';

  const winId = WM.create({
    type: 'team', recordId: id, title: title,
  });
  const win = WM.windows.get(winId);
  win.state = {
    type: 'team',
    recordId: id,
    baseline: rec ? JSON.parse(JSON.stringify(rec)) : {},
    autosaveTimer: null,
    teamTags: (rec && rec.tag) ? rec.tag.slice() : [],
    // Tactical board per-window state
    lavagne: [],
    activeLavagnaId: null,
    boardMode: 'move',
    drawColor: DRAW_COLORS[0],
    drawArrow: true,
    selectedPositionId: null,
    currentStroke: null,
    currentStrokePathEl: null,
    currentStrokeD: '',
    draggingPositionId: null,
    boardSaveTimer: null,
  };

  win.onClose = (wid, w) => {
    clearTimeout(w.state.autosaveTimer);
    clearTimeout(w.state.boardSaveTimer);
    doTeamAutosaveScoped(wid).catch(e => console.error('Final team autosave error', e));
    persistTeamBoardScoped(wid).catch(e => console.error('Final board save error', e));
  };

  win.body.innerHTML = buildTeamEditorBody(rec);
  bindTeamEditorEvents(winId, rec);

  // Update title when name changes
  const nameField = $f(win.body, 'f_nome');
  if (nameField) nameField.addEventListener('input', () => {
    const nm = nameField.value.trim() || 'Nuova squadra';
    win.title = nm;
    WM.updateTaskbar();
    const chromeTitle = win.body.closest('.wm-window').querySelector('.wm-title');
    if (chromeTitle) chromeTitle.textContent = win.title;
  });

  // Init tactical board
  initTacticalBoardScoped(winId, rec);
}

function bindTeamEditorEvents(winId, rec) {
  const win = WM.windows.get(winId);
  const body = win.body;

  $f(body, 'closeEdit').onclick = () => WM.close(winId);
  $f(body, 'deleteFromModal').onclick = () => {
    const rid = win.state.recordId;
    if (rid) removeRecord('team', rid);
    WM.close(winId);
  };

  renderTeamTagPickerScoped(winId);
  $f(body, 'teamTagAddBtn').onclick = () => addTeamTagFromInputScoped(winId);
  $f(body, 'teamTagInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); addTeamTagFromInputScoped(winId); }
  });

  const dynFields = $f(body, 'dynamicFields');
  if (dynFields) {
    dynFields.addEventListener('input', () => scheduleTeamAutosaveScoped(winId));
    dynFields.addEventListener('change', () => scheduleTeamAutosaveScoped(winId));
  }
}

function renderTeamTagPickerScoped(winId){
  const win = WM.windows.get(winId);
  const area = $f(win.body, 'teamTagChips');
  if(!area) return;
  area.innerHTML = win.state.teamTags.map((t,i) => `
    <span class="tag-chip">${escapeHtml(t)}<button data-idx="${i}">✕</button></span>
  `).join('') || '<span class="tag-picker-hint" style="margin:0;">Nessun tag ancora</span>';
  area.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { win.state.teamTags.splice(parseInt(btn.dataset.idx),1); renderTeamTagPickerScoped(winId); scheduleTeamAutosaveScoped(winId); };
  });
}

function addTeamTagFromInputScoped(winId){
  const win = WM.windows.get(winId);
  const input = $f(win.body, 'teamTagInput');
  const v = input.value.trim();
  if(!v) return;
  if(!win.state.teamTags.some(t => t.toLowerCase() === v.toLowerCase())){
    win.state.teamTags.push(v);
    renderTeamTagPickerScoped(winId);
    scheduleTeamAutosaveScoped(winId);
  }
  input.value = '';
  input.focus();
}

function scheduleTeamAutosaveScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win) return;
  const statusEl = $f(win.body, 'saveStatus');
  if (statusEl) statusEl.textContent = 'Modifiche in corso...';
  clearTimeout(win.state.autosaveTimer);
  win.state.autosaveTimer = setTimeout(() => doTeamAutosaveScoped(winId), 1200);
}

async function doTeamAutosaveScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win || win.state.type !== 'team') return;
  const body = win.body;

  const formData = collectFormDataScoped(TEAM_SECTIONS, body);
  if (!formData.nome || !formData.nome.trim()) {
    const statusEl = $f(body, 'saveStatus');
    if (statusEl) statusEl.textContent = 'Inserisci almeno il nome per salvare';
    return;
  }

  const id = win.state.recordId;
  const existing = id ? teams.find(t => t.id === id) : null;
  const existingData = existing ? Object.fromEntries(Object.entries(existing).filter(([k]) => k !== 'id')) : {};
  const data = { ...existingData, ...formData };

  // Preserve lavagne from window state
  if (win.state.lavagne && win.state.lavagne.length > 0) {
    data.lavagne = win.state.lavagne;
  }
  data.tag = win.state.teamTags.slice();

  data.updatedBy = myName || 'anonimo';
  data.updatedAt = new Date().toISOString();

  const finalId = id || uid('t');
  win.state.recordId = finalId;
  const rec = { id: finalId, ...data };

  const idx = teams.findIndex(t => t.id === finalId);
  if (idx > -1) teams[idx] = rec; else teams.push(rec);

  try {
    const changed = computeChangedFields(win.state.baseline, data);
    const merged = await mergeSaveRow('teams', finalId, changed);
    if (merged) {
      win.state.baseline = Object.assign({}, win.state.baseline, changed);
      const idx2 = teams.findIndex(t => t.id === finalId);
      const mergedRec = Object.assign({id: finalId}, merged);
      if (idx2 > -1) teams[idx2] = mergedRec; else teams.push(mergedRec);
    }
    const statusEl = $f(body, 'saveStatus');
    if (statusEl) statusEl.textContent = 'Salvato ✓ · ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    console.error('Errore salvataggio squadra:', e);
    const statusEl = $f(body, 'saveStatus');
    if (statusEl) statusEl.textContent = 'Errore di salvataggio, controlla la connessione';
    showToast('Errore nel salvataggio automatico della squadra');
  }
  // Non aggiornare i datalist durante autosave per evitare di perdere il focus negli input
  // renderTeamDatalist();
  // renderAllTeamTagsDatalist();
}

// ---------- SCOPED TACTICAL BOARD ----------

function getActiveLavagnaScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win) return null;
  return win.state.lavagne.find(l => l.id === win.state.activeLavagnaId) || win.state.lavagne[0];
}

function initTacticalBoardScoped(winId, rec) {
  const win = WM.windows.get(winId);
  const area = $f(win.body, 'tacticalBoardArea');
  if (!rec) {
    area.innerHTML = '<div class="board-disabled-note">Salva prima la squadra (inserisci almeno il nome), poi riapri la scheda per usare la lavagna tattica.</div>';
    return;
  }
  win.state.lavagne = (rec.lavagne || []).map(l => ({ ...l, posizioni: l.posizioni.map(p => ({...p, riserve: (p.riserve||[]).slice()})), disegni: (l.disegni||[]).map(d => ({...d, points: d.points.slice()})) }));
  if (win.state.lavagne.length === 0) {
    win.state.lavagne.push(makeLavagnaFromModulo('Modulo base', '4-3-3'));
  }
  win.state.activeLavagnaId = win.state.lavagne[0].id;
  win.state.boardMode = 'move';
  win.state.selectedPositionId = null;
  renderTacticalBoardScoped(winId);
}

function renderTacticalBoardScoped(winId) {
  const win = WM.windows.get(winId);
  const area = $f(win.body, 'tacticalBoardArea');
  const lav = getActiveLavagnaScoped(winId);
  if (!lav) { area.innerHTML = ''; return; }

  const boardMode = win.state.boardMode;
  const drawColor = win.state.drawColor;
  const drawArrow = win.state.drawArrow;

  area.innerHTML = `
    <div class="board-tabs" data-field="boardTabs">
      ${win.state.lavagne.map(l => `<span class="board-tab ${l.id===lav.id?'active':''}" data-id="${l.id}">${escapeHtml(l.nome)}</span>`).join('')}
      <span class="board-tab new-tab" data-field="boardNewTab">+ nuova lavagna</span>
    </div>
    <div class="board-toolbar-row">
      <input type="text" data-field="lavagnaNomeInput" value="${escapeHtml(lav.nome)}" style="flex:1;" placeholder="Nome lavagna">
      <select data-field="lavagnaModuloSelect">${Object.keys(FORMATIONS).map(m=>`<option value="${m}" ${m===lav.modulo?'selected':''}>${m}</option>`).join('')}</select>
      <button class="btn small danger" data-field="deleteLavagnaBtn">🗑️</button>
    </div>
    <div class="mode-toggle-row">
      <button class="btn small ${boardMode==='move'?'primary':''}" data-field="modeMove">👤 Sposta giocatori</button>
      <button class="btn small ${boardMode==='draw'?'primary':''}" data-field="modeDraw">✏️ Disegna</button>
    </div>
    ${boardMode==='draw' ? `
    <div class="draw-toolbar">
      ${DRAW_COLORS.map(c=>`<span class="color-swatch ${c===drawColor?'active':''}" data-color="${c}" style="background:${c};"></span>`).join('')}
      <label><input type="checkbox" data-field="arrowToggle" ${drawArrow?'checked':''}> punta freccia</label>
      <button class="btn small" data-field="undoStrokeBtn">↩ annulla tratto</button>
      <button class="btn small danger" data-field="clearStrokesBtn">🗑️ cancella disegni</button>
    </div>` : ''}
    <div class="pitch-wrap" data-field="pitchWrap"></div>
    <div data-field="positionEditorArea"></div>
    <div class="board-save-status" data-field="boardSaveStatus">Salvataggio automatico attivo</div>
  `;

  // Tab clicks
  area.querySelectorAll('.board-tab[data-id]').forEach(el => {
    el.onclick = () => { win.state.activeLavagnaId = el.dataset.id; win.state.selectedPositionId = null; renderTacticalBoardScoped(winId); };
  });

  // New tab
  $f(area, 'boardNewTab').onclick = () => {
    const nome = prompt('Nome della nuova lavagna (es. "Fuori casa", "Contro squadre basse")', 'Nuova lavagna');
    if (nome === null) return;
    const nuova = makeLavagnaFromModulo(nome.trim() || 'Nuova lavagna', '4-3-3');
    win.state.lavagne.push(nuova);
    win.state.activeLavagnaId = nuova.id;
    scheduleBoardSaveScoped(winId);
    renderTacticalBoardScoped(winId);
  };

  // Delete lavagna
  $f(area, 'deleteLavagnaBtn').onclick = () => {
    if (win.state.lavagne.length <= 1) { showToast('Deve restare almeno una lavagna'); return; }
    if (!confirm(`Eliminare la lavagna "${lav.nome}"?`)) return;
    win.state.lavagne = win.state.lavagne.filter(l => l.id !== lav.id);
    win.state.activeLavagnaId = win.state.lavagne[0].id;
    scheduleBoardSaveScoped(winId);
    renderTacticalBoardScoped(winId);
  };

  // Name input
  $f(area, 'lavagnaNomeInput').oninput = (e) => { lav.nome = e.target.value; renderBoardTabsOnlyScoped(winId); scheduleBoardSaveScoped(winId); };

  // Modulo select
  $f(area, 'lavagnaModuloSelect').onchange = (e) => { switchModuloScoped(winId, lav, e.target.value); };

  // Mode toggles
  $f(area, 'modeMove').onclick = () => { win.state.boardMode = 'move'; renderTacticalBoardScoped(winId); };
  $f(area, 'modeDraw').onclick = () => { win.state.boardMode = 'draw'; win.state.selectedPositionId = null; renderTacticalBoardScoped(winId); };

  // Draw toolbar
  if (boardMode === 'draw') {
    area.querySelectorAll('.color-swatch').forEach(el => {
      el.onclick = () => { win.state.drawColor = el.dataset.color; renderTacticalBoardScoped(winId); };
    });
    $f(area, 'arrowToggle').onchange = (e) => { win.state.drawArrow = e.target.checked; };
    $f(area, 'undoStrokeBtn').onclick = () => { lav.disegni.pop(); scheduleBoardSaveScoped(winId); renderPitchSVGScoped(winId); };
    $f(area, 'clearStrokesBtn').onclick = () => {
      if (lav.disegni.length === 0) return;
      if (!confirm('Cancellare tutti i disegni di questa lavagna?')) return;
      lav.disegni = []; scheduleBoardSaveScoped(winId); renderPitchSVGScoped(winId);
    };
  }

  renderPitchSVGScoped(winId);
  renderPositionEditorScoped(winId);
}

function renderBoardTabsOnlyScoped(winId) {
  const win = WM.windows.get(winId);
  const area = $f(win.body, 'tacticalBoardArea');
  if (!area) return;
  const tabs = area.querySelector('.board-tabs');
  if (!tabs) return;
  win.state.lavagne.forEach(l => {
    const tab = tabs.querySelector(`.board-tab[data-id="${l.id}"]`);
    if (tab) tab.textContent = l.name;
  });
}

function switchModuloScoped(winId, lav, nuovoModulo) {
  const preset = FORMATIONS[nuovoModulo] || FORMATIONS['4-3-3'];
  const vecchie = lav.posizioni.slice();
  const nuove = preset.map(p => {
    const idx = vecchie.findIndex(v => v.ruolo === p.ruolo);
    if (idx > -1) {
      const match = vecchie.splice(idx, 1)[0];
      return { id: match.id, ruolo: p.ruolo, x: p.x, y: p.y, titolare: match.titolare, riserve: match.riserve.slice() };
    }
    return { id: uid('pos'), ruolo: p.ruolo, x: p.x, y: p.y, titolare: '', riserve: [] };
  });
  lav.modulo = nuovoModulo;
  lav.posizioni = nuove;
  WM.windows.get(winId).state.selectedPositionId = null;
  scheduleBoardSaveScoped(winId);
  renderTacticalBoardScoped(winId);
}

function renderPitchSVGScoped(winId) {
  const win = WM.windows.get(winId);
  const area = $f(win.body, 'tacticalBoardArea');
  if (!area) return;
  const wrap = $f(area, 'pitchWrap');
  if (!wrap) return;
  const lav = getActiveLavagnaScoped(winId);
  if (!lav) { wrap.innerHTML = ''; return; }

  const selectedPositionId = win.state.selectedPositionId;

  function positionTokenSVGScoped(pos) {
    const sel = pos.id === selectedPositionId;
    const label = pos.titolare ? (pos.titolare.length > 12 ? pos.titolare.slice(0, 11) + '\u2026' : pos.titolare) : '\u2014';
    const v = toVB(pos);
    return `
      <g class="pos-token ${sel ? 'selected' : ''}" data-id="${pos.id}" transform="translate(${v.x},${v.y})">
        <circle r="4.2"></circle>
        <text class="role-label" y="1.1">${escapeHtml(pos.ruolo)}</text>
        <text class="starter-label" y="7.5">${escapeHtml(label)}</text>
      </g>
    `;
  }

  wrap.innerHTML = `
    <svg viewBox="0 0 100 150">
      ${pitchBackgroundSVG()}
      <g data-field="strokesLayer">${lav.disegni.map(strokeToSVG).join('')}</g>
      <g data-field="tokensLayer">${lav.posizioni.map(positionTokenSVGScoped).join('')}</g>
    </svg>
  `;
  const svg = wrap.querySelector('svg');
  attachPitchPointerHandlersScoped(winId, svg, lav);
}

function attachPitchPointerHandlersScoped(winId, svg, lav) {
  const win = WM.windows.get(winId);

  svg.addEventListener('pointerdown', (e) => {
    svg.setPointerCapture(e.pointerId);
    const pt = svgPointFromEvent(svg, e);
    if (win.state.boardMode === 'move') {
      const tokenEl = e.target.closest('.pos-token');
      if (tokenEl) {
        win.state.draggingPositionId = tokenEl.dataset.id;
        win.state.selectedPositionId = tokenEl.dataset.id;
        renderPositionEditorScoped(winId);
        updateTokenSelectionVisualScoped(winId);
      }
    } else {
      win.state.currentStroke = { id: uid('stroke'), color: win.state.drawColor, arrow: win.state.drawArrow, points: [pt] };
      const v = toVB(pt);
      win.state.currentStrokeD = `M ${v.x.toFixed(2)} ${v.y.toFixed(2)}`;
      win.state.currentStrokePathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      win.state.currentStrokePathEl.setAttribute('fill', 'none');
      win.state.currentStrokePathEl.setAttribute('stroke', win.state.drawColor);
      win.state.currentStrokePathEl.setAttribute('stroke-width', '1.2');
      win.state.currentStrokePathEl.setAttribute('stroke-linecap', 'round');
      win.state.currentStrokePathEl.setAttribute('stroke-linejoin', 'round');
      win.state.currentStrokePathEl.setAttribute('d', win.state.currentStrokeD);
      const strokesLayer = $f(win.body, 'strokesLayer');
      if (strokesLayer) strokesLayer.appendChild(win.state.currentStrokePathEl);
    }
  });

  svg.addEventListener('pointermove', (e) => {
    const pt = svgPointFromEvent(svg, e);
    if (win.state.boardMode === 'move' && win.state.draggingPositionId) {
      const pos = lav.posizioni.find(p => p.id === win.state.draggingPositionId);
      if (pos) {
        pos.x = pt.x; pos.y = pt.y;
        const v = toVB(pos);
        const tokenEl = svg.querySelector(`.pos-token[data-id="${pos.id}"]`);
        if (tokenEl) tokenEl.setAttribute('transform', `translate(${v.x},${v.y})`);
      }
    } else if (win.state.boardMode === 'draw' && win.state.currentStroke && win.state.currentStrokePathEl) {
      win.state.currentStroke.points.push(pt);
      const v = toVB(pt);
      win.state.currentStrokeD += ` L ${v.x.toFixed(2)} ${v.y.toFixed(2)}`;
      win.state.currentStrokePathEl.setAttribute('d', win.state.currentStrokeD);
    }
  });

  svg.addEventListener('pointerup', () => {
    if (win.state.boardMode === 'move' && win.state.draggingPositionId) {
      win.state.draggingPositionId = null;
      scheduleBoardSaveScoped(winId);
    } else if (win.state.boardMode === 'draw' && win.state.currentStroke) {
      if (win.state.currentStroke.points.length > 1) {
        lav.disegni.push(win.state.currentStroke);
        scheduleBoardSaveScoped(winId);
      }
      win.state.currentStroke = null;
      win.state.currentStrokePathEl = null;
      win.state.currentStrokeD = '';
      renderPitchSVGScoped(winId);
    }
  });

  svg.addEventListener('pointercancel', () => {
    win.state.draggingPositionId = null;
    win.state.currentStroke = null;
    win.state.currentStrokePathEl = null;
    win.state.currentStrokeD = '';
  });
}

function updateTokenSelectionVisualScoped(winId) {

  const area = $f(win.body, 'tacticalBoardArea');

function renderPositionEditorScoped(winId) {
  const win = WM.windows.get(winId);
  const area = $f(win.body, 'tacticalBoardArea');
  if (!area) return;
  const editorArea = $f(area, 'positionEditorArea');

        </div>

    </div>
  `;
  const renderChips = () => {

    chipsEl.querySelectorAll('button').forEach(b => {
      b.onclick = () => { pos.riserve.splice(parseInt(b.dataset.i), 1); renderChips(); scheduleBoardSaveScoped(winId); };
    });
  };
  renderChips();
  $f(editorArea, 'posTitolareInput').oninput = (e) => {
    pos.titolare = e.target.value;
    const pitchArea = $f(win.body, 'tacticalBoardArea');
    if (pitchArea) {
      const tokenEl = pitchArea.querySelector(`.pos-token[data-id="${pos.id}"] .starter-label`);
      if (tokenEl) tokenEl.textContent = pos.titolare ? (pos.titolare.length > 12 ? pos.titolare.slice(0, 11) + '\u2026' : pos.titolare) : '\u2014';
    }
    scheduleBoardSaveScoped(winId);
  };
  const addRiserva = () => {
    const input = $f(editorArea, 'posRiservaInput');

  $f(editorArea, 'posRiservaAddBtn').onclick = addRiserva;
  $f(editorArea, 'posRiservaInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addRiserva(); } });
  $f(editorArea, 'closePosEditor').onclick = () => { win.state.selectedPositionId = null; renderPositionEditorScoped(winId); updateTokenSelectionVisualScoped(winId); };
}

function scheduleBoardSaveScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win) return;
  const statusEl = $f(win.body, 'boardSaveStatus');
  if (statusEl) statusEl.textContent = 'Modifiche in corso...';
  clearTimeout(win.state.boardSaveTimer);
  win.state.boardSaveTimer = setTimeout(() => persistTeamBoardScoped(winId), 800);
}

async function persistTeamBoardScoped(winId) {
  const win = WM.windows.get(winId);
  if (!win || win.state.type !== 'team' || !win.state.recordId) return;
  const t = teams.find(x => x.id === win.state.recordId);
  if (!t) return;
  t.lavagne = win.state.lavagne;
  const area = $f(win.body, 'tacticalBoardArea');
  const statusEl = area ? $f(area, 'boardSaveStatus') : null;
  try {
    const merged = await mergeSaveRow('teams', win.state.recordId, { lavagne: win.state.lavagne });
    if (merged) {
      win.state.baseline = Object.assign({}, win.state.baseline, { lavagne: win.state.lavagne });
      const idx2 = teams.findIndex(x => x.id === win.state.recordId);
      const mergedRec = Object.assign({id: win.state.recordId}, merged);
      if (idx2 > -1) teams[idx2] = mergedRec; else teams.push(mergedRec);
    }
    if (statusEl) statusEl.textContent = 'Salvato ✓ · ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    console.error('Errore salvataggio lavagna tattica:', e);
    if (statusEl) statusEl.textContent = 'Errore di salvataggio, controlla la connessione';
  }
}

// Realtime propagation for team windows
function refreshTeamWindowsForRecord(rec) {
  WM.windows.forEach((win, winId) => {
    if (win.state.type === 'team' && win.state.recordId === rec.id) {
      const body = win.body;
      const cw = $f(body, 'conflictWarning');
      if (cw) cw.style.display = 'block';
      // Refresh tactical board only if no interaction is in progress
      // Check for: dragging, drawing, OR active input focus on reserve fields
      const activeElement = document.activeElement;
      const isReserveInputActive = activeElement && (
        activeElement.dataset?.field === 'posRiservaInput' ||
        activeElement.classList?.contains('tag-chip-input')
      );
      if (!win.state.draggingPositionId && !win.state.currentStroke && !isReserveInputActive) {
        const keepActiveId = win.state.activeLavagnaId;
        const keepMode = win.state.boardMode;
        const keepSelected = win.state.selectedPositionId;
        win.state.lavagne = (rec.lavagne || []).map(l => ({ ...l, posizioni: l.posizioni.map(p => ({...p, riserve: (p.riserve||[]).slice()})), disegni: (l.disegni||[]).map(d => ({...d, points: d.points.slice()})) }));
        if (win.state.lavagne.length === 0) win.state.lavagne.push(makeLavagnaFromModulo('Modulo base', '4-3-3'));
        win.state.activeLavagnaId = win.state.lavagne.some(l => l.id === keepActiveId) ? keepActiveId : win.state.lavagne[0].id;
        win.state.boardMode = keepMode;
        const activeLav = win.state.lavagne.find(l => l.id === win.state.activeLavagnaId);
        win.state.selectedPositionId = (activeLav && activeLav.posizioni.some(p => p.id === keepSelected)) ? keepSelected : null;
        renderTacticalBoardScoped(winId);
      }
    }
  });
}

// ---------- LAVAGNA TATTICA ----------
let editingLavagne = [];
let activeLavagnaId = null;
let boardMode = 'move';
let drawColor = DRAW_COLORS[0];
let drawArrow = true;
let selectedPositionId = null;
let currentStroke = null;
let draggingPositionId = null;
let boardSaveTimer = null;

function refreshTacticalBoardIfEditing(rec){
  if(editingType !== 'team' || editingId !== rec.id) return;
  if(!document.getElementById('tacticalBoardArea')) return;
  if(draggingPositionId || currentStroke) return; // non interrompere un gesto in corso (drag/disegno attivo)
  const keepActiveId = activeLavagnaId;
  const keepMode = boardMode;
  const keepSelected = selectedPositionId;
  editingLavagne = (rec.lavagne || []).map(l => ({ ...l, posizioni: l.posizioni.map(p=>({...p, riserve:(p.riserve||[]).slice()})), disegni: (l.disegni||[]).map(d=>({...d, points:d.points.slice()})) }));
  if(editingLavagne.length === 0) editingLavagne.push(makeLavagnaFromModulo('Modulo base', '4-3-3'));
  activeLavagnaId = editingLavagne.some(l=>l.id===keepActiveId) ? keepActiveId : editingLavagne[0].id;
  boardMode = keepMode;
  const activeLav = editingLavagne.find(l=>l.id===activeLavagnaId);
  selectedPositionId = (activeLav && activeLav.posizioni.some(p=>p.id===keepSelected)) ? keepSelected : null;
  renderTacticalBoard();
}

function initTacticalBoard(rec){
  const area = document.getElementById('tacticalBoardArea');
  if(!rec){
    area.innerHTML = '<div class="board-disabled-note">Salva prima la squadra (inserisci almeno il nome), poi riapri la scheda per usare la lavagna tattica.</div>';
    return;
  }
  editingLavagne = (rec.lavagne || []).map(l => ({ ...l, posizioni: l.posizioni.map(p=>({...p, riserve:(p.riserve||[]).slice()})), disegni: (l.disegni||[]).map(d=>({...d, points:d.points.slice()})) }));
  if(editingLavagne.length === 0){
    editingLavagne.push(makeLavagnaFromModulo('Modulo base', '4-3-3'));
  }
  activeLavagnaId = editingLavagne[0].id;
  boardMode = 'move';
  selectedPositionId = null;
  renderTacticalBoard();
}

function getActiveLavagna(){
  return editingLavagne.find(l => l.id === activeLavagnaId) || editingLavagne[0];
}

function renderTacticalBoard(){
  const area = document.getElementById('tacticalBoardArea');
  const lav = getActiveLavagna();
  if(!lav){ area.innerHTML = ''; return; }

  area.innerHTML = `
    <div class="board-tabs" id="boardTabs">
      ${editingLavagne.map(l => `<span class="board-tab ${l.id===lav.id?'active':''}" data-id="${l.id}">${escapeHtml(l.nome)}</span>`).join('')}
      <span class="board-tab new-tab" id="boardNewTab">+ nuova lavagna</span>
    </div>
    <div class="board-toolbar-row">
      <input type="text" id="lavagnaNomeInput" value="${escapeHtml(lav.nome)}" style="flex:1;" placeholder="Nome lavagna">
      <select id="lavagnaModuloSelect">${Object.keys(FORMATIONS).map(m=>`<option value="${m}" ${m===lav.modulo?'selected':''}>${m}</option>`).join('')}</select>
      <button class="btn small danger" id="deleteLavagnaBtn">🗑️</button>
    </div>
    <div class="mode-toggle-row">
      <button class="btn small ${boardMode==='move'?'primary':''}" id="modeMove">👤 Sposta giocatori</button>
      <button class="btn small ${boardMode==='draw'?'primary':''}" id="modeDraw">✏️ Disegna</button>
    </div>
    ${boardMode==='draw' ? `
    <div class="draw-toolbar">
      ${DRAW_COLORS.map(c=>`<span class="color-swatch ${c===drawColor?'active':''}" data-color="${c}" style="background:${c};"></span>`).join('')}
      <label><input type="checkbox" id="arrowToggle" ${drawArrow?'checked':''}> punta freccia</label>
      <button class="btn small" id="undoStrokeBtn">↩ annulla tratto</button>
      <button class="btn small danger" id="clearStrokesBtn">🗑️ cancella disegni</button>
    </div>` : ''}
    <div class="pitch-wrap" id="pitchWrap"></div>
    <div id="positionEditorArea"></div>
    <div class="board-save-status" id="boardSaveStatus">Salvataggio automatico attivo</div>
  `;

  document.querySelectorAll('.board-tab[data-id]').forEach(el => {
    el.onclick = () => { activeLavagnaId = el.dataset.id; selectedPositionId = null; renderTacticalBoard(); };
  });
  document.getElementById('boardNewTab').onclick = () => {
    const nome = prompt('Nome della nuova lavagna (es. "Fuori casa", "Contro squadre basse")', 'Nuova lavagna');
    if(nome === null) return;
    const nuova = makeLavagnaFromModulo(nome.trim() || 'Nuova lavagna', '4-3-3');
    editingLavagne.push(nuova);
    activeLavagnaId = nuova.id;
    scheduleBoardSave();
    renderTacticalBoard();
  };
  document.getElementById('deleteLavagnaBtn').onclick = () => {
    if(editingLavagne.length <= 1){ showToast('Deve restare almeno una lavagna'); return; }
    if(!confirm(`Eliminare la lavagna "${lav.nome}"?`)) return;
    editingLavagne = editingLavagne.filter(l => l.id !== lav.id);
    activeLavagnaId = editingLavagne[0].id;
    scheduleBoardSave();
    renderTacticalBoard();
  };
  document.getElementById('lavagnaNomeInput').oninput = (e) => { lav.nome = e.target.value; renderBoardTabsOnly(); scheduleBoardSave(); };
  document.getElementById('lavagnaModuloSelect').onchange = (e) => { switchModulo(lav, e.target.value); };

  document.getElementById('modeMove').onclick = () => { boardMode='move'; renderTacticalBoard(); };

  if(boardMode==='draw'){

function switchModulo(lav, nuovoModulo){
  const preset = FORMATIONS[nuovoModulo] || FORMATIONS['4-3-3'];
  const vecchie = lav.posizioni.slice();
  const nuove = preset.map(p => {
    const idx = vecchie.findIndex(v => v.ruolo === p.ruolo);
    if(idx > -1){
      const match = vecchie.splice(idx,1)[0];
      return { id: match.id, ruolo:p.ruolo, x:p.x, y:p.y, titolare:match.titolare, riserve:match.riserve.slice() };
    }
    return { id: uid('pos'), ruolo:p.ruolo, x:p.x, y:p.y, titolare:'', riserve:[] };
  });
  lav.modulo = nuovoModulo;
  lav.posizioni = nuove;
  selectedPositionId = null;
  scheduleBoardSave();
  renderTacticalBoard();
}

// Il campo è memorizzato come percentuali 0-100 su entrambi gli assi (indipendente
// dalla risoluzione), ma renderizzato in un viewBox 100x150 (proporzioni reali 2:3,
// stesse del contenitore CSS) cosi' cerchi e angoli non vengono deformati.
function toVB(p){ return { x: p.x, y: p.y * 1.5 }; }

function pitchBackgroundSVG(){
  return `
    <rect x="3" y="4" width="94" height="142" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
    <line x1="3" y1="75" x2="97" y2="75" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
    <circle cx="50" cy="75" r="9" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
    <circle cx="50" cy="75" r="0.7" fill="rgba(255,255,255,0.35)"/>
    <rect x="22" y="4" width="56" height="20" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
    <rect x="38" y="4" width="24" height="8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
    <rect x="22" y="122" width="56" height="20" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
    <rect x="38" y="138" width="24" height="8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
  `;
}

function strokeToSVG(stroke){
  if(stroke.points.length < 2) return '';
  const pts = stroke.points.map(toVB);
  const d = pts.map((p,i) => `${i===0?'M':'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
  let arrowHead = '';
  if(stroke.arrow){
    const n = pts.length;
    const p1 = pts[n-2], p2 = pts[n-1];
    const angle = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    const size = 3.4;
    const a1 = angle + Math.PI*0.82, a2 = angle - Math.PI*0.82;
    const x1 = p2.x + size*Math.cos(a1), y1 = p2.y + size*Math.sin(a1);
    const x2 = p2.x + size*Math.cos(a2), y2 = p2.y + size*Math.sin(a2);
    arrowHead = `<polygon points="${p2.x.toFixed(2)},${p2.y.toFixed(2)} ${x1.toFixed(2)},${y1.toFixed(2)} ${x2.toFixed(2)},${y2.toFixed(2)}" fill="${stroke.color}"/>`;
  }
  return `<path d="${d}" fill="none" stroke="${stroke.color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>${arrowHead}`;
}

function positionTokenSVG(pos){
  const sel = pos.id === selectedPositionId;
  const label = pos.titolare ? (pos.titolare.length>12 ? pos.titolare.slice(0,11)+'…' : pos.titolare) : '—';
  const v = toVB(pos);
  return `
    <g class="pos-token ${sel?'selected':''}" data-id="${pos.id}" transform="translate(${v.x},${v.y})">
      <circle r="4.2"></circle>
      <text class="role-label" y="1.1">${escapeHtml(pos.ruolo)}</text>
      <text class="starter-label" y="7.5">${escapeHtml(label)}</text>
    </g>
  `;
}

function renderPitchSVG(){
  const wrap = document.getElementById('pitchWrap');
  if(!wrap) return;
  const lav = getActiveLavagna();
  wrap.innerHTML = `
    <svg viewBox="0 0 100 150">
      ${pitchBackgroundSVG()}
      <g id="strokesLayer">${lav.disegni.map(strokeToSVG).join('')}</g>
      <g id="tokensLayer">${lav.posizioni.map(positionTokenSVG).join('')}</g>
    </svg>
  `;
  const svg = wrap.querySelector('svg');
  attachPitchPointerHandlers(svg, lav);
}

function svgPointFromEvent(svg, evt){
  const rect = svg.getBoundingClientRect();
  const x = Math.max(0, Math.min(100, ((evt.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(0, Math.min(100, ((evt.clientY - rect.top) / rect.height) * 100));
  return {x, y};
}

let currentStrokePathEl = null;
let currentStrokeD = '';

function attachPitchPointerHandlers(svg, lav){
  svg.addEventListener('pointerdown', (e) => {
    svg.setPointerCapture(e.pointerId);
    const pt = svgPointFromEvent(svg, e);
    if(boardMode === 'move'){
      const tokenEl = e.target.closest('.pos-token');
      if(tokenEl){
        draggingPositionId = tokenEl.dataset.id;
        selectedPositionId = tokenEl.dataset.id;
        renderPositionEditor();
        updateTokenSelectionVisual();
      }
    } else {
      currentStroke = { id: uid('stroke'), color: drawColor, arrow: drawArrow, points: [pt] };
      const v = toVB(pt);
      currentStrokeD = `M ${v.x.toFixed(2)} ${v.y.toFixed(2)}`;
      currentStrokePathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
      currentStrokePathEl.setAttribute('fill','none');
      currentStrokePathEl.setAttribute('stroke', drawColor);
      currentStrokePathEl.setAttribute('stroke-width','1.2');
      currentStrokePathEl.setAttribute('stroke-linecap','round');
      currentStrokePathEl.setAttribute('stroke-linejoin','round');
      currentStrokePathEl.setAttribute('d', currentStrokeD);
      svg.querySelector('#strokesLayer').appendChild(currentStrokePathEl);
    }
  });

  svg.addEventListener('pointermove', (e) => {
    const pt = svgPointFromEvent(svg, e);
    if(boardMode === 'move' && draggingPositionId){
      const pos = lav.posizioni.find(p => p.id === draggingPositionId);
      if(pos){
        pos.x = pt.x; pos.y = pt.y;
        const v = toVB(pos);
        const tokenEl = svg.querySelector(`.pos-token[data-id="${pos.id}"]`);
        if(tokenEl) tokenEl.setAttribute('transform', `translate(${v.x},${v.y})`);
      }
    } else if(boardMode === 'draw' && currentStroke && currentStrokePathEl){
      currentStroke.points.push(pt);
      const v = toVB(pt);
      currentStrokeD += ` L ${v.x.toFixed(2)} ${v.y.toFixed(2)}`;
      currentStrokePathEl.setAttribute('d', currentStrokeD);
    }
  });

  svg.addEventListener('pointerup', () => {
    if(boardMode === 'move' && draggingPositionId){
      draggingPositionId = null;
      scheduleBoardSave();
    } else if(boardMode === 'draw' && currentStroke){
      if(currentStroke.points.length > 1){
        lav.disegni.push(currentStroke);
        scheduleBoardSave();
      }
      currentStroke = null;
      currentStrokePathEl = null;
      currentStrokeD = '';
      renderPitchSVG();
    }
  });

  svg.addEventListener('pointercancel', () => {
    draggingPositionId = null;
    currentStroke = null;
    currentStrokePathEl = null;
    currentStrokeD = '';
  });
}

async function persistTeamBoard(){
  if(editingType !== 'team' || !editingId) return;
  const t = teams.find(x => x.id === editingId);
  if(!t) return;
  t.lavagne = editingLavagne;
  const statusEl = document.getElementById('boardSaveStatus');
  try{
    const merged = await mergeSaveRow('teams', editingId, { lavagne: editingLavagne });
    if (merged) {
      editingBaseline = Object.assign({}, editingBaseline, { lavagne: editingLavagne });
      const idx2 = teams.findIndex(x => x.id === editingId);

function parseAiResponse(text){
  let clean = (text||'').trim();
  // Rimuove blocchi di ragionamento (thinking mode) tipo <think>...</think>
  clean = clean.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
  // Rimuove eventuali code fence markdown
  clean = clean.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  // Se resta ancora testo prima/dopo, isola il primo blocco { ... } valido
  const first = clean.indexOf('{');
  const last = clean.lastIndexOf('}');
  if(first > -1 && last > first) clean = clean.slice(first, last+1);
  try{
    const obj = JSON.parse(clean);
    return {
      keywords: Array.isArray(obj.keywords) ? obj.keywords : [],
      punti_giocatore: Array.isArray(obj.punti_giocatore) ? obj.punti_giocatore : [],
      punti_squadra: Array.isArray(obj.punti_squadra) ? obj.punti_squadra : [],
      flag_rischio: Array.isArray(obj.flag_rischio) ? obj.flag_rischio : [],
      parseFailed: false, raw: text
    };
  }catch(e){
    return { keywords:[], punti_giocatore:[], punti_squadra:[], flag_rischio:[], parseFailed:true, raw:text };
  }
}

async function persistPlayer(p, fields){
  const changed = Array.isArray(fields)
    ? fields.reduce((o,k) => { o[k]=p[k]; return o; }, {})
    : (({id, ...rest}) => rest)(p);
  const merged = await mergeSaveRow('players', p.id, changed);
  if (merged) {
    Object.assign(p, merged);
    const idx = players.findIndex(x => x.id === p.id);
    if (idx > -1) players[idx] = Object.assign({}, players[idx], merged, {id: p.id});
  }
  return merged;
}

function refreshAiSummaryAreaIfEditing(p){
  if(editingType!=='player' || editingId!==p.id) return;
  const area = document.getElementById('aiSummaryArea');
  if(area){ area.innerHTML = renderAiSummaryBlock(p); bindAiSummaryHandlers(); }
}

function videoMatchesPlayer(v, rec){
  if(v.playerId) return v.playerId === rec.id;
  const a = normalize_(v.giocatore||'');
  const b = normalize_(rec.nome||'');
  if(!a || !b) return false;
  return a===b || a.includes(b) || b.includes(a);
}

function renderAiSummaryBlock(p){
  const modeLabel = aiSettings.mode==='lmstudio' ? 'LM Studio (locale)' : aiSettings.mode==='ollama' ? 'Ollama (locale/cloud)' : 'OpenRouter (cloud)';
  const s = p.aiSummary;
  const req = p.aiRequest;
  let html = `<div class="ai-empty">Modalità attiva: <span class="mode-badge">${escapeHtml(modeLabel)}</span> · cambiala da ⚙️ AI in alto</div>`;

  if(req && req.status === 'pending'){
    html += `<div class="stale-warn">🕒 In coda per LM Studio, richiesto da ${escapeHtml(req.requestedBy)} · ${formatRelative(req.requestedAt)}. Verrà elaborato quando lo script sul PC è in esecuzione.</div>`;
    html += `<div style="margin-top:8px;"><button class="btn small danger" id="aiCancelBtn">Annulla richiesta</button></div>`;
  } else if(req && req.status === 'error'){
    html += `<div class="stale-warn">⚠️ Il worker ha segnalato un errore: ${escapeHtml(req.error||'sconosciuto')}</div>`;
  }

  if(!s){
    html += `<div class="ai-empty">Nessun riassunto ancora per questo giocatore.</div>`;
  } else {
    const stale = s.sourceHash !== computeNotesSignature(p);
    if(stale) html += `<div class="stale-warn">⚠️ Le note sono state modificate dopo questo riassunto. Potrebbe non essere aggiornato.</div>`;
    if(s.parseFailed){
      html += `<div class="stale-warn">Il modello non ha risposto nel formato atteso. Testo grezzo:</div><div class="orig-note-block">${escapeHtml(s.raw)}</div>`;
    } else {
      if(s.keywords.length) html += `<div class="ai-kw-row">${s.keywords.map(k=>`<span class="ai-kw">${escapeHtml(k)}</span>`).join('')}</div>`;
      if(s.punti_giocatore.length){ html += `<div class="ai-block-label">Giocatore</div><ul class="ai-list">${s.punti_giocatore.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`; }
      if(s.punti_squadra.length){ html += `<div class="ai-block-label">Squadra</div><ul class="ai-list">${s.punti_squadra.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`; }
      if(s.flag_rischio.length){ html += `<div class="ai-block-label">Rischi</div><ul class="ai-list risk">${s.flag_rischio.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`; }
      if(!s.keywords.length && !s.punti_giocatore.length && !s.punti_squadra.length && !s.flag_rischio.length){
        html += `<div class="ai-empty">Il riassunto è vuoto: probabilmente non c'erano abbastanza note da sintetizzare.</div>`;
      }
    }
    html += `<div class="ai-meta">Generato da ${escapeHtml(s.generatedBy)} · ${formatRelative(s.generatedAt)} · <span class="mode-badge">${escapeHtml(s.mode==='lmstudio'?'LM Studio':s.mode==='ollama'?'Ollama':'OpenRouter')}</span></div>`;
  }

  const genLabel = s ? '🔄 Rigenera ora' : '✨ Genera ora';
const modeIsLm = aiSettings.mode === 'lmstudio';
const modeLabelShort = aiSettings.mode==='ollama' ? 'Ollama' : aiSettings.mode==='lmstudio' ? 'LM Studio, se sei su questo PC' : 'OpenRouter';
  html += `<div class="card-actions" style="margin-top:12px;">
    <button class="ai-generate-btn" id="aiGenerateBtn">${genLabel} (${modeLabelShort})</button>
  </div>`;
  if(modeIsLm){
    html += `<div class="card-actions" style="margin-top:6px;">
      <button class="btn small" id="aiAsyncBtn">🕒 Richiedi async (worker PC)</button>
    </div>`;
  }
  if(aiSettings.openrouterKey){
    html += `<div style="margin-top:8px;"><button class="btn small" id="aiEmergencyBtn">🚨 Emergenza: genera ora con OpenRouter</button></div>`;
  } else {
    html += `<div class="ai-empty" style="margin-top:8px;">Configura una chiave OpenRouter in ⚙️ AI per avere un'opzione di emergenza se LM Studio non è disponibile.</div>`;
  }
  return html;
}

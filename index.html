<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier Fanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2E22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DossierFanta">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --pitch-dark:#0F2E22;
    --pitch:#123626;
    --pitch-light:#1B4A35;
    --grass:#4C9A6A;
    --chalk:#F3F1E7;
    --chalk-dim:#C9C7B8;
    --amber:#D9A441;
    --red:#C1543F;
    --blue:#5B9BD5;
    --ink:#0B1913;
    --line: rgba(243,241,231,0.12);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 42px);
    color:var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .num{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--pitch-dark) 85%, transparent);
    padding:14px 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .brand h1{ margin:0; font-size:19px; letter-spacing:0.02em; font-weight:800; text-transform:uppercase; }
  .brand h1 span{ color:var(--amber); }
  .brand .who{ font-size:11px; color:var(--chalk-dim); cursor:pointer; border:1px solid var(--line); padding:4px 8px; border-radius:20px; white-space:nowrap; }
.header-tools{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.header-tools .who{ font-size:11px; color:var(--chalk-dim); cursor:pointer; border:1px solid var(--line); padding:5px 11px; border-radius:20px; white-space:nowrap; background:var(--pitch); transition:all .15s; }
.header-tools .who:hover{ border-color:var(--amber); color:var(--amber); transform:translateY(-1px); }
  .status-line{ font-size:10.5px; color:var(--chalk-dim); margin-top:6px; display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--grass); }
  .dot.off{ background:var(--red); }
  .tabs{ display:flex; gap:6px; margin-top:10px; }
  .tab{ flex:1; text-align:center; padding:9px 6px; border-radius:8px; font-size:12.5px; font-weight:700; letter-spacing:0.01em; cursor:pointer; border:1px solid var(--line); color:var(--chalk-dim); }
  .tab.active{ background:var(--grass); color:var(--ink); border-color:var(--grass); }
  main{ padding:12px 16px 90px; max-width:820px; margin:0 auto; }

  .searchbar{ display:flex; gap:8px; margin:10px 0 14px; flex-wrap:wrap; }
  .searchbar input{ flex:1; min-width:160px; }
  .searchbar select{ flex:0 0 auto; }
  .searchbar input{ flex:1; background:var(--pitch); border:1px solid var(--line); color:var(--chalk); padding:10px 12px; border-radius:8px; font-size:14px; }
  .searchbar select{ background:var(--pitch); border:1px solid var(--line); color:var(--chalk); padding:10px 8px; border-radius:8px; font-size:13px; }
.searchbar{ margin-bottom:8px; }
.controls-panel{ display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; background:var(--pitch); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin:0 0 14px; }
.control-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.control-label{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.09em; color:var(--amber); opacity:0.85; margin-right:2px; }
.controls-panel select{ background:var(--pitch-light); border:1px solid var(--line); color:var(--chalk); padding:7px 8px; border-radius:7px; font-size:12.5px; transition:border-color .15s; }
.controls-panel select:hover{ border-color:rgba(217,164,65,0.45); }
.controls-panel select:focus{ outline:none; border-color:var(--grass); }
.controls-panel .btn{ background:var(--pitch-light); transition:border-color .15s; }
.controls-panel .btn:hover{ border-color:rgba(217,164,65,0.45); }
  .fab{ position:fixed; bottom:20px; right:20px; z-index:30; background:var(--amber); color:var(--ink); border:none; border-radius:50%; width:56px; height:56px; font-size:26px; font-weight:900; box-shadow:0 6px 18px rgba(0,0,0,0.4); }

  .card{ background:var(--pitch); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; position:relative; overflow:hidden; }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .role-P::before{ background:#D9A441; } .role-D::before{ background:#4C9A6A; } .role-C::before{ background:#5B9BD5; } .role-A::before{ background:#C1543F; }
  .role-TEAM::before{ background:var(--chalk-dim); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-title{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge{ font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; letter-spacing:0.03em; }
  .badge.P{ background:rgba(217,164,65,0.18); color:var(--amber); }
  .badge.D{ background:rgba(76,154,106,0.18); color:var(--grass); }
  .badge.C{ background:rgba(91,155,213,0.18); color:var(--blue); }
  .badge.A{ background:rgba(193,84,63,0.18); color:var(--red); }
  .card-title b{ font-size:15px; }
  .card-title .team-link{ font-size:12px; color:var(--blue); cursor:pointer; text-decoration:underline; }
  .priority{ font-size:12px; color:var(--amber); white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .scouting-badge{ font-size:10px; font-weight:800; padding:2px 6px; border-radius:20px; }
  .scouting-badge.complete{ background:rgba(76,154,106,0.18); color:var(--grass); border:1px solid rgba(76,154,106,0.3); }
  .scouting-badge.incomplete{ background:rgba(217,164,65,0.18); color:var(--amber); border:1px solid rgba(217,164,65,0.3); }

  .stat-row{ display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; font-size:12px; color:var(--chalk-dim); }
  .stat-row b{ color:var(--chalk); }
  .tag-row{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:10.5px; background:var(--pitch-light); border:1px solid var(--line); padding:3px 8px; border-radius:20px; color:var(--chalk-dim); }
  .tag.clickable{ cursor:pointer; }
  .tag.clickable:hover{ border-color:var(--amber); color:var(--amber); }

  .tag-filter-bar{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
  .tag-filter-pill{ font-size:11.5px; background:var(--pitch); border:1px solid var(--line); padding:5px 10px; border-radius:20px; color:var(--chalk-dim); cursor:pointer; }
  .tag-filter-pill.active{ background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:700; }
  .tag-filter-clear{ font-size:11.5px; color:var(--red); background:none; border:none; cursor:pointer; padding:5px 4px; }

  .tag-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tag-chip{ font-size:12px; background:var(--pitch-light); border:1px solid var(--line); padding:4px 6px 4px 10px; border-radius:20px; color:var(--chalk); display:flex; align-items:center; gap:6px; }
  .tag-chip button{ background:none; border:none; color:var(--chalk-dim); cursor:pointer; font-size:13px; padding:0 2px; }
  .tag-picker-input{ display:flex; gap:8px; }
  .tag-picker-input input{ flex:1; background:var(--pitch); border:1px solid var(--line); color:var(--chalk); padding:9px 10px; border-radius:8px; font-size:14px; }
  .tag-picker-hint{ font-size:11px; color:var(--chalk-dim); margin-top:6px; }
  .note-preview{ margin-top:8px; font-size:12.5px; color:var(--chalk-dim); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta-line{ margin-top:8px; font-size:10.5px; color:var(--chalk-dim); opacity:0.8; }
  .card-actions{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ border:1px solid var(--line); background:transparent; color:var(--chalk); padding:6px 12px; border-radius:7px; font-size:12px; cursor:pointer; }
  .btn.primary{ background:var(--grass); color:var(--ink); border-color:var(--grass); font-weight:700; }
  .btn.danger{ color:var(--red); border-color:rgba(193,84,63,0.4); }
  .btn.small{ padding:4px 9px; font-size:11px; }
  .btn.compare-on{ background:var(--amber); color:var(--ink); border-color:var(--amber); }

  .empty{ text-align:center; color:var(--chalk-dim); padding:60px 20px; font-size:14px; }

  .overlay{ position:fixed; inset:0; background:rgba(6,15,10,0.75); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .modal{ background:var(--pitch-dark); width:100%; max-width:760px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px 16px 24px; border-top:1px solid var(--line); }
  .modal h2{ margin:0; font-size:17px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .save-status{ font-size:11px; color:var(--chalk-dim); margin-bottom:14px; min-height:14px; }
  .conflict-warning{ background:rgba(193,84,63,0.15); border:1px solid rgba(193,84,63,0.4); color:#f0b8ac; font-size:11.5px; padding:8px 10px; border-radius:8px; margin-bottom:12px; display:none; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; color:var(--chalk-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em; }
  .field input, .field select, .field textarea{ width:100%; background:var(--pitch); border:1px solid var(--line); color:var(--chalk); padding:9px 10px; border-radius:8px; font-size:14px; font-family:inherit; }
  .field textarea{ min-height:70px; resize:vertical; line-height:1.4; }

  .section-block{ border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .section-block summary{ padding:11px 14px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--amber); cursor:pointer; background:var(--pitch); list-style:none; }
  .section-block summary::-webkit-details-marker{ display:none; }
  .section-block summary::before{ content:'▸ '; }
  .section-block[open] summary::before{ content:'▾ '; }
  .section-body{ padding:12px 14px 2px; }
  .subsection-block{ border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .subsection-block summary{ padding:9px 12px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--grass); cursor:pointer; background:rgba(76,154,106,0.08); list-style:none; }
  .subsection-block summary::-webkit-details-marker{ display:none; }
  .subsection-block summary::before{ content:'▸ '; }
  .subsection-block[open] summary::before{ content:'▾ '; }
  .subsection-body{ padding:10px 12px 2px; }

  /* Solo da PC/schermi larghi: griglia più densa, più campi per riga.
     Sotto questa soglia (tablet/telefono) il layout resta invariato, uno sotto l'altro. */
  @media (min-width: 820px){
    .modal{ max-width:920px; }
    .section-body, .subsection-body{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
      gap:4px 16px; align-items:start;
    }
    .section-body.has-subsections{ display:block; }
    .section-body.no-grid{ display:block; }
    .section-body .field, .subsection-body .field{ margin-bottom:12px; }
    .field-wide{ grid-column:1 / -1; }
  }

  .modal-actions{ display:flex; gap:10px; margin-top:18px; position:sticky; bottom:0; background:var(--pitch-dark); padding-top:10px; }
  .modal-actions .btn{ flex:1; text-align:center; padding:11px; }
  .close-x{ background:none; border:none; color:var(--chalk-dim); font-size:20px; }

  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card-fascia{ font-size:10.5px; font-weight:800; background:rgba(217,164,65,0.18); color:var(--amber); border:1px solid rgba(217,164,65,0.3); padding:2px 8px; border-radius:20px; }
.searchbar .btn{ align-self:center; }

  .custom-field-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .custom-field-row input{ flex:1; background:var(--pitch); border:1px solid var(--line); color:var(--chalk); padding:9px 10px; border-radius:8px; font-size:13px; }
  .add-custom{ font-size:12px; color:var(--grass); background:none; border:none; padding:4px 0 14px; cursor:pointer; }

  .compare-picker{ background:var(--pitch); border:1px dashed var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; font-size:13px; color:var(--chalk-dim); }
  .compare-picker summary{ cursor:pointer; list-style:none; font-weight:700; color:var(--chalk); }
  .compare-picker summary::-webkit-details-marker{ display:none; }
  .compare-picker summary::before{ content:'▸ '; color:var(--amber); }
  .compare-picker[open] summary::before{ content:'▾ '; }
  .compare-picker summary .count-badge{ font-weight:400; color:var(--chalk-dim); font-size:12px; }
  .pill-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .pill{ font-size:12px; background:var(--pitch-light); border:1px solid var(--line); border-radius:20px; padding:5px 10px; cursor:pointer; }
  .pill.selected{ background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:700; }
  .compare-empty{ text-align:center; color:var(--chalk-dim); padding:40px 20px; font-size:14px; }

  .compare-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px; }
  table.compare-table{ border-collapse:collapse; width:100%; min-width:420px; font-size:12.5px; }
  table.compare-table th, table.compare-table td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; word-break:break-word; }
  table.compare-table th:not(:first-child), table.compare-table td:not(:first-child){ min-width:110px; max-width:150px; }
  table.compare-table thead th{ background:var(--pitch); position:sticky; top:0; z-index:2; font-size:12px; }
  table.compare-table th:first-child, table.compare-table td:first-child{ position:sticky; left:0; background:var(--pitch-dark); z-index:1; font-weight:700; color:var(--chalk-dim); min-width:104px; max-width:120px; font-size:11.5px; }
  table.compare-table thead th:first-child{ z-index:3; background:var(--pitch); }
  @media (max-width: 420px){
    table.compare-table{ font-size:12px; }
    table.compare-table th, table.compare-table td{ padding:7px 6px; }
  }
  tr.section-header-row td{ background:var(--pitch-light); color:var(--amber); font-weight:800; text-transform:uppercase; font-size:11px; letter-spacing:0.03em; cursor:pointer; padding:9px 10px; }
  tr.section-header-row td:first-child{ background:var(--pitch-light); }

  .toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--chalk); color:var(--ink); padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700; z-index:60; opacity:0; pointer-events:none; transition:opacity 0.25s; }
  .toast.show{ opacity:1; }

  .mode-badge{ font-size:10px; background:var(--pitch-light); border:1px solid var(--line); padding:2px 7px; border-radius:20px; color:var(--chalk-dim); }
  .ai-generate-btn{ background:var(--blue); color:var(--ink); border:none; font-weight:700; padding:9px 14px; border-radius:8px; font-size:12.5px; cursor:pointer; }
  .ai-generate-btn:disabled{ opacity:0.5; }
  .ai-empty{ font-size:12.5px; color:var(--chalk-dim); margin-bottom:10px; }
  .ai-kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .ai-kw{ font-size:11px; background:rgba(91,155,213,0.18); color:var(--blue); border:1px solid rgba(91,155,213,0.3); padding:3px 9px; border-radius:20px; }
  .ai-block-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--chalk-dim); margin:10px 0 4px; }
  .ai-list{ margin:0; padding-left:18px; font-size:12.5px; line-height:1.6; }
  .ai-list.risk li{ color:#f0b8ac; }
  .ai-meta{ font-size:10.5px; color:var(--chalk-dim); margin-top:12px; opacity:0.85; }

  .highlight-card{ display:flex; gap:10px; background:var(--pitch); border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px; }
  .highlight-thumb-wrap{ position:relative; width:120px; min-width:120px; aspect-ratio:16/9; border-radius:7px; overflow:hidden; cursor:pointer; background:#000; }
  .highlight-thumb-wrap img.highlight-thumb{ width:100%; height:100%; object-fit:cover; display:block; }
  .highlight-thumb-wrap iframe{ width:100%; height:100%; border:0; }
  .highlight-play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; background:rgba(0,0,0,0.25); }
  .highlight-info{ flex:1; min-width:0; }
  .highlight-cat{ font-size:10px; background:rgba(217,164,65,0.18); color:var(--amber); border:1px solid rgba(217,164,65,0.3); padding:2px 7px; border-radius:20px; display:inline-block; margin-bottom:4px; }
  .highlight-title{ font-size:12.5px; font-weight:700; line-height:1.3; }
  .highlight-meta{ font-size:11px; color:var(--chalk-dim); margin-top:3px; }
  .highlight-why{ font-size:11px; color:var(--chalk-dim); margin-top:5px; line-height:1.4; font-style:italic; }
  .stale-warn{ background:rgba(217,164,65,0.15); border:1px solid rgba(217,164,65,0.4); color:var(--amber); font-size:11.5px; padding:7px 10px; border-radius:8px; margin:8px 0; }
  .ai-raw-toggle{ font-size:11px; color:var(--chalk-dim); text-decoration:underline; cursor:pointer; margin-top:8px; display:inline-block; }

  .settings-row{ display:flex; gap:8px; margin-bottom:12px; }
  .settings-row .btn{ flex:1; }
  .settings-row .btn.mode-active{ background:var(--grass); color:var(--ink); border-color:var(--grass); font-weight:700; }
  .settings-hint{ font-size:11px; color:var(--chalk-dim); margin:-6px 0 14px; line-height:1.4; }

  .ai-kw-td{ display:flex; flex-wrap:wrap; gap:4px; }
  .section-toggle-original{ float:right; font-weight:400; text-transform:none; letter-spacing:0; color:var(--chalk-dim); font-size:10.5px; text-decoration:underline; }
  .orig-note-block{ white-space:pre-wrap; font-size:12px; line-height:1.5; max-width:260px; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .asta-team-card{ background:var(--pitch); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .asta-team-card.mine{ border-color:var(--amber); }
  .asta-team-top{ display:flex; justify-content:space-between; align-items:center; }
  .asta-team-name{ font-size:15px; font-weight:800; }
  .asta-team-name .mine-badge{ font-size:10px; color:var(--amber); margin-left:6px; }
  .asta-budget-line{ font-size:12.5px; color:var(--chalk-dim); margin-top:4px; }
  .asta-budget-line b{ color:var(--chalk); }
  .budget-bar{ height:6px; background:var(--pitch-light); border-radius:4px; margin-top:6px; overflow:hidden; }
  .budget-bar-fill{ height:100%; background:var(--grass); }
  .budget-bar-fill.low{ background:var(--red); }
/* --- v9: sidebar asta (desktop, solo in Modalità Asta) --- */
.asta-sidebar{ position:fixed; top:0; right:0; bottom:0; width:290px; z-index:45; background:var(--pitch-dark); border-left:1px solid var(--line); padding:12px 14px 24px; overflow-y:auto; transform:translateX(105%); transition:transform .28s cubic-bezier(.22,1,.36,1); box-shadow:-10px 0 34px rgba(0,0,0,0.4); }
.asta-sidebar.open{ transform:translateX(0); }
@media (max-width:1023px){ .asta-sidebar{ display:none; } }
@media (min-width:1024px){ body.asta-sidebar-active{ padding-right:310px; } }
.sidebar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
.sidebar-title{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.07em; color:var(--amber); }
.sidebar-team{ background:var(--pitch); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; transition:border-color .15s ease, background .15s ease, transform .15s ease; }
.sidebar-team.mine{ border-color:rgba(217,164,65,0.55); background:rgba(217,164,65,0.06); }
.sidebar-team.drag-over{ border-color:var(--grass); background:rgba(76,154,106,0.16); transform:scale(1.02); box-shadow:0 0 0 2px rgba(76,154,106,0.3); }
.sidebar-team-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.sidebar-team-name{ font-size:13px; font-weight:800; }

/* --- v8: budget bar vive --- */

  .wm-window {
    position: fixed;
    background: var(--pitch-dark);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 380px;
    min-height: 280px;
    z-index: 100;
    animation: wm-open 0.18s ease-out;
  }
  @keyframes wm-open {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .wm-window.wm-focused {
    border-color: rgba(76,154,106,0.45);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(76,154,106,0.25);
  }
  .wm-chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;

    border-bottom: 1px solid var(--line);
    cursor: default;
    user-select: none;
    flex-shrink: 0;
  }
  .wm-window.wm-focused .wm-chrome {
    background: var(--pitch);
  }
  .wm-title {
    flex: 1;
    font-size: 13px;

    color: var(--chalk);

    text-overflow: ellipsis;

  .wm-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 16px 16px;
  }
  .wm-resize {
    position: absolute; bottom: 0; right: 0;
    width: 18px; height: 18px;
    cursor: nwse-resize;
  }
  .wm-resize::after {
    content: ''; position: absolute; bottom: 4px; right: 4px;
    width: 7px; height: 7px;
    border-right: 2px solid var(--chalk-dim);
    border-bottom: 2px solid var(--chalk-dim);

  .wm-taskbar {

/* ═══════════ v10 · DOSSIER DESIGN SYSTEM ═══════════ */
:root{
  --display:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  --amber-hi:#E9BC5F;
  --card-edge:rgba(243,241,231,0.09);
}
/* --- sfondo ambientale: luce + cerchio di centrocampo --- */
body{
  background-color:var(--pitch-dark);
  background-image:
    radial-gradient(1100px 520px at 88% -8%, rgba(76,154,106,0.12), transparent 62%),
    radial-gradient(820px 460px at -8% 108%, rgba(217,164,65,0.06), transparent 58%),
    radial-gradient(circle at 50% 38%, transparent 150px, rgba(243,241,231,0.035) 151px, rgba(243,241,231,0.035) 153px, transparent 154px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 42px);
  background-attachment:fixed;
}
/* --- tipografia base --- */
.num{ font-family:var(--mono); }
.brand h1{ font-family:var(--display); font-weight:900; font-size:21px; letter-spacing:.05em; }
.brand h1 span{ color:var(--amber-hi); }
.brand .who{ font-family:var(--mono); font-size:10px; letter-spacing:.03em; transition:all .15s; }
.brand .who:hover{ border-color:rgba(217,164,65,.5); color:var(--amber-hi); transform:translateY(-1px); }
.status-line{ font-family:var(--mono); letter-spacing:.02em; }
/* --- pallino connessione vivo --- */
.dot{ animation:connPulse 2.4s ease-in-out infinite; }
@keyframes connPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(76,154,106,.55);} 55%{ box-shadow:0 0 0 6px rgba(76,154,106,0);} }
.dot.off{ animation:none; }
/* --- tab stile schedario --- */
.tabs{ gap:5px; }
.tab{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; font-size:11.5px;
  border-radius:9px 9px 4px 4px;
  transition:all .18s cubic-bezier(.22,1,.36,1);
}
.tab:hover:not(.active){ color:var(--chalk); border-color:rgba(217,164,65,.35); transform:translateY(-1px); }
.tab.active{
  background:linear-gradient(180deg,#54A573,#3E8A5F);
  box-shadow:0 4px 14px rgba(76,154,106,.35), inset 0 1px 0 rgba(255,255,255,.18);
}
/* --- card: scheda di scouting --- */
.card{
  background:linear-gradient(160deg,#17392C 0%,#123125 55%,#0F2A20 100%);
  border:1px solid var(--card-edge);
  border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 6px 18px rgba(0,0,0,.28);
  transition:transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s, border-color .18s;
}
.card::before{ width:5px; }
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(217,164,65,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 14px 30px rgba(0,0,0,.42), 0 0 0 1px rgba(217,164,65,.10);
}
.role-P:hover::before{ box-shadow:0 0 14px rgba(217,164,65,.65); }
.role-D:hover::before{ box-shadow:0 0 14px rgba(76,154,106,.65); }
.role-C:hover::before{ box-shadow:0 0 14px rgba(91,155,213,.65); }
.role-A:hover::before{ box-shadow:0 0 14px rgba(193,84,63,.65); }
.card-title b{ font-family:var(--display); font-weight:800; letter-spacing:-.01em; font-size:15.5px; }
.card-title .team-link{ font-family:var(--mono); font-size:11px; }
/* --- badge ruolo stampato --- */
.badge{
  font-family:var(--display); font-weight:800; text-transform:uppercase;
  letter-spacing:.07em; font-size:9.5px; border-radius:4px; padding:2px 7px;
}
/* --- stelle priorità con bagliore --- */
.priority{ letter-spacing:1.5px; text-shadow:0 0 10px rgba(217,164,65,.4); }
.scouting-badge{ font-family:var(--mono); font-size:9px; letter-spacing:.03em; }
/* --- stats: pozzetto dati monospace --- */
.stat-row{
  font-family:var(--mono); font-size:11px;
  background:rgba(11,25,19,.4);
  border:1px solid rgba(243,241,231,.05);
  border-radius:8px;
  padding:6px 9px;
  gap:6px 12px;
}
.stat-row b{ font-weight:700; }
/* --- fascia: timbro ambra --- */
.card-fascia{
  font-family:var(--display); font-weight:800; text-transform:uppercase;
  letter-spacing:.06em; font-size:9px;
  background:linear-gradient(120deg, rgba(217,164,65,.24), rgba(217,164,65,.10));
  border:1px solid rgba(217,164,65,.45);
  color:var(--amber-hi);
  border-radius:3px; padding:2px 7px;
}
/* --- tag / note / meta --- */
.tag{ font-family:var(--mono); font-size:9.5px; letter-spacing:.02em; transition:all .15s; }
.tag.clickable:hover{ transform:translateY(-1px); }
.meta-line{ font-family:var(--mono); font-size:9px; letter-spacing:.03em; }
.note-preview{ font-size:12px; line-height:1.45; }
.tag-filter-pill{ font-family:var(--mono); transition:all .15s; }
.tag-filter-pill:hover{ transform:translateY(-1px); border-color:rgba(217,164,65,.4); }
/* --- pulsanti --- */
.btn{
  font-family:var(--display); font-weight:700; letter-spacing:.04em;
  transition:all .16s cubic-bezier(.22,1,.36,1);
}
.btn:hover{ transform:translateY(-1px); border-color:rgba(217,164,65,.45); color:var(--amber-hi); }
.btn:active{ transform:translateY(0) scale(.97); }
.btn.primary{ box-shadow:0 3px 10px rgba(76,154,106,.28); }
.btn.primary:hover{ background:#57A877; box-shadow:0 5px 16px rgba(76,154,106,.45); color:var(--ink); }
.btn.danger:hover{ border-color:rgba(193,84,63,.6); color:#E07B67; }
.card-actions .btn{ text-transform:uppercase; font-size:10px; letter-spacing:.05em; border-radius:6px; }
/* --- focus input/select --- */
.searchbar input:focus, .searchbar select:focus, .controls-panel select:focus,
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--grass);
  box-shadow:0 0 0 3px rgba(76,154,106,.16);
}
/* --- barre budget con riflesso vivo --- */
.budget-bar{ background:rgba(11,25,19,.5); }
.budget-bar-fill{ position:relative; overflow:hidden; }
.budget-bar-fill::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
  transform:translateX(-120%);
  animation:barSheen 3s ease-in-out infinite;
}
@keyframes barSheen{ 0%{transform:translateX(-120%);} 60%,100%{transform:translateX(120%);} }
/* --- FAB ⚡ e pill di stato --- */
.quick-fab{ transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; }
.quick-fab:hover{ transform:scale(1.1) rotate(-8deg); }

// ---------- SALVATAGGIO SICURO (merge invece di sovrascrittura totale) ----------
// Problema che risolve: due persone che modificano lo stesso record (giocatore/squadra/piano)
// quasi in contemporanea. Prima ogni salvataggio riscriveva l'INTERO blob JSON della riga,
// quindi chi salvava per ultimo cancellava senza accorgersene le modifiche recenti dell'altro,
// anche su campi completamente diversi. Ora: si calcola solo cosa è CAMBIATO localmente
// rispetto a una "baseline" nota, si rilegge il dato più fresco dal server subito prima di
// scrivere, e si scrivono solo i campi cambiati sopra quel dato fresco. Chi ha toccato campi
// diversi non si pesta più i piedi; resta un conflitto solo se entrambi toccano lo STESSO campo
// nella stessa finestra di pochi istanti, caso in cui vince l'ultimo salvataggio (accettabile).
function computeChangedFields(baseline, current){
  const out = {};
  const b = baseline || {};
  const c = current || {};
  const keys = new Set([...Object.keys(b), ...Object.keys(c)]);
  const valuesEqual = (x, y) => {
    if (x === y) return true;
    if (x == null && y == null) return true;
    if (x == null || y == null) return false;
    // stesso valore scritto come numero da una parte e stringa dall'altra (capita con dati
    // importati o vecchi salvataggi) non deve contare come "modifica"
    if ((typeof x === 'number' || typeof y === 'number') && !isNaN(Number(x)) && !isNaN(Number(y))) {
      return Number(x) === Number(y);
    }
    try { return JSON.stringify(x) === JSON.stringify(y); }
    catch(e){ return false; }
  };
  keys.forEach(k => {
    if (k === 'id') return;
    if (!valuesEqual(b[k], c[k])) out[k] = c[k];
  });
  return out;
}
async function mergeSaveRow(table, id, changedFields){
  if (!changedFields || !Object.keys(changedFields).length) return null;
  const r = await sb.from(table).select('data').eq('id', id).maybeSingle();
  const serverData = (r && r.data && r.data.data) ? r.data.data : {};
  const merged = Object.assign({}, serverData, changedFields);
  const res = await sb.from(table).upsert({ id, data: merged, updated_at: new Date().toISOString() });
  if (res && res.error) throw res.error;
  return merged;
}

}

function showConfirmModal({title, body, confirmLabel, cancelLabel}){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = '200';
    overlay.innerHTML = `
      <div class="modal" style="max-width:400px;">

        <div style="font-size:13.5px; color:var(--chalk-dim); line-height:1.5; margin-bottom:18px;">${body||''}</div>
        <div class="modal-actions">
          <button class="btn" id="confirmModalCancel" style="flex:1;">${escapeHtml(cancelLabel||'Annulla')}</button>
          <button class="btn danger" id="confirmModalOk" style="flex:1;">${escapeHtml(confirmLabel||'Conferma')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (result) => { overlay.remove(); resolve(result); };
    document.getElementById('confirmModalCancel').onclick = () => cleanup(false);
    document.getElementById('confirmModalOk').onclick = () => cleanup(true);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) cleanup(false); });
  });
}
function formatRelative(iso){
  if(!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return 'poco fa';
  if(diff < 3600) return Math.floor(diff/60)+' min fa';
  if(diff < 86400) return Math.floor(diff/3600)+' ore fa';
  return Math.floor(diff/86400)+' giorni fa';

function teamFragilitaDifensiva(nomeSquadra){
const t = teams.find(x => normalize_(x.nome) === normalize_(nomeSquadra));
return (t && t.fragilitaDifensiva!=null) ? Number(t.fragilitaDifensiva) : 5.5; // default neutro se manca il rating
}
// Ritorna { [nomeSquadra]: { [giornata]: fragilitaDifensivaAvversario } } per tutte le squadre nel calendario
function buildDefensiveWeaknessByTeam(){
const byTeam = {};
calendario.forEach(fix => {
if(!fix.giornata) return;
const casa = fix.squadraCasa, trasf = fix.squadraTrasferta;
if(!byTeam[casa]) byTeam[casa] = {};
if(!byTeam[trasf]) byTeam[trasf] = {};
// facilità per gli attaccanti di una squadra = fragilità difensiva dell'avversario di giornata
byTeam[casa][fix.giornata] = teamFragilitaDifensiva(trasf);
byTeam[trasf][fix.giornata] = teamFragilitaDifensiva(casa);
});
return byTeam;
}
function attaccanteRilevanza(p){
return (Number(p.golPrevisti)||0)*100 + (Number(p.titolaritaVoto)||0)*10 + (Number(p.golAnnoScorso)||0);
}
function computeAttackerPairScore(a1, a2, weaknessByTeam){
const d1 = weaknessByTeam[a1.squadra] || {};
const d2 = weaknessByTeam[a2.squadra] || {};
const giornate = [...new Set([...Object.keys(d1), ...Object.keys(d2)])];
if(giornate.length === 0) return null;
let totale = 0, conflitti = 0, coperte = 0;
giornate.forEach(g => {
const v1 = d1[g], v2 = d2[g];
if(v1==null && v2==null) return;
const migliore = Math.max(v1 ?? 0, v2 ?? 0);
totale += migliore;
coperte++;
if((v1==null || v1<6) && (v2==null || v2<6)) conflitti++;
});
if(coperte === 0) return null;
return { mediaMigliore: totale/coperte, conflitti, giornateCoperte: coperte };
}
function computeAllAttackerPairs(){
const attaccanti = players.filter(p => p.posFanta==='A' && p.squadra);
// Un solo attaccante per squadra: il più rilevante (gol previsti, poi titolarità, poi gol anno scorso)
const perSquadra = new Map();
attaccanti.forEach(p => {
const key = normalize_(p.squadra);
const attuale = perSquadra.get(key);
if(!attuale || attaccanteRilevanza(p) > attaccanteRilevanza(attuale)) perSquadra.set(key, p);
});
const titolari = [...perSquadra.values()];
const weaknessByTeam = buildDefensiveWeaknessByTeam();
const pairs = [];
for(let i=0; i<titolari.length; i++){
for(let j=i+1; j<titolari.length; j++){
const a = titolari[i], b = titolari[j];
const score = computeAttackerPairScore(a, b, weaknessByTeam);
if(score) pairs.push({ a, b, ...score });
}
}
return pairs.sort((x,y) => y.mediaMigliore - x.mediaMigliore || x.conflitti - y.conflitti);
}

function simGetMedia(p){ const v=p.fmAnnoScorso; return (v!=null && String(v).trim()!=='')?Number(v):null; }
function simGetPresenze(p){ const v=p.presenzeAnnoScorso; return (v!=null && String(v).trim()!=='')?Number(v):null; }
function simMyTeamName(){ const m=leagueTeams.find(t=>t.isMine); return m?m.nome:null; }
function simIsMyPurchase(p){ const tn=simMyTeamName(); return !!(tn && p.asta && p.asta.team===tn); }

function simComputePlayer(p){
  const partite=Number(simSettings.partiteTotali)||38;
  const votoUff=simSettings.votoUfficio!=null?Number(simSettings.votoUfficio):6;
  const media=simGetMedia(p);
  const presRaw=simGetPresenze(p);
  const presenze=(presRaw==null)?partite:Math.min(Math.max(0,presRaw),partite);
  const nonGiocate=partite-presenze;
  const mediaEff=(media==null)?votoUff:media;
  const totale=mediaEff*presenze+votoUff*nonGiocate;
  return { media, presenzeRaw:presRaw, presenze, nonGiocate, mediaEff, totale, mediaProiettata:totale/partite, avvisi:[media==null?'media mancante':null, presRaw==null?'presenze mancanti':null].filter(Boolean) };
}
function simFindFascia(media){ let best=simSettings.fasce[0],idx=0; simSettings.fasce.forEach((f,i)=>{ if(media>=Number(f.min)){best=f;idx=i;} }); return {fascia:best,idx}; }
function simComputeTeam(){
  const sel=simSelectedIds.map(id=>players.find(p=>p.id===id)).filter(Boolean);
  const results=sel.map(p=>({p, ...simComputePlayer(p)}));
  const n=results.length;
  const sommaMedie=results.reduce((s,r)=>s+r.mediaProiettata,0);
  const mediaBase=n?sommaMedie/n:0;
  let mod={attiva:false,n:0,media:null,bonus:0,fasciaIdx:null};
  if(simSettings.modificatoreOn && n){
    const gruppo=simSettings.repartoMod==='ALL'?results:results.filter(r=>r.p.posFanta===simSettings.repartoMod);
    if(gruppo.length){
      const mediaRep=gruppo.reduce((s,r)=>s+r.mediaProiettata,0)/gruppo.length;
      const {fascia,idx}=simFindFascia(mediaRep);
      mod={attiva:true,n:gruppo.length,media:mediaRep,bonus:Number(fascia.bonus)||0,fasciaIdx:idx};
    }
  }
  const punteggioGiornata=sommaMedie+mod.bonus;
  return {results,n,sommaMedie,mediaBase,mod,punteggioGiornata,punteggioStagione:punteggioGiornata*(Number(simSettings.partiteTotali)||38)};
}

  const t=simComputeTeam();
  if(t.n===0){ area.innerHTML='<div class="ai-empty">Seleziona almeno un giocatore per vedere la simulazione.</div>'; return; }

function dashBudgetOf(team){ return (team && team.budgetTotale!=null) ? team.budgetTotale : auctionSettings.budgetTotale; }

function dashCountUp(el, target, dur, decimals, suffix){
  if(!el) return;
  suffix = suffix||'';
  const start = parseFloat(el.dataset.cur||'0')||0;
  const t0 = performance.now();
  function step(now){
    const k = Math.min(1,(now-t0)/dur);
    const e = 1-Math.pow(1-k,3);
    el.textContent = (start+(target-start)*e).toFixed(decimals)+suffix;
    if(k<1) requestAnimationFrame(step); else el.dataset.cur = target;
  }
  requestAnimationFrame(step);
}
function setNum(el, val, animate, decimals, suffix){
  if(!el) return;
  decimals = decimals||0; suffix = suffix||'';
  if(animate){ dashCountUp(el, val, 900, decimals, suffix); }
  else { el.textContent = Number(val).toFixed(decimals)+suffix; el.dataset.cur = val; }
}

function updateDash(animate){
  const myTeam = leagueTeams.find(t=>t.isMine);
  const myStats = myTeam ? computeTeamStats(myTeam.nome) : null;
  const heroBody = document.querySelector('.dash-hero-body');
  const heroEmpty = document.getElementById('dashHeroEmpty');
  if(!myTeam || !myStats){
    if(heroBody) heroBody.style.display = 'none';
    if(heroEmpty) heroEmpty.style.display = '';
  } else {
    if(heroBody) heroBody.style.display = '';
    if(heroEmpty) heroEmpty.style.display = 'none';
    const budgetTot = dashBudgetOf(myTeam);
    const remaining = budgetTot - myStats.spent;
    const pctSpent = budgetTot>0 ? Math.min(1, myStats.spent/budgetTot) : 0;
    const totalSlots = Object.values(auctionSettings.slots).reduce((a,b)=>a+(b||0),0);
    const filled = Object.values(myStats.slotsFilled).reduce((a,b)=>a+b,0);
    const pctComplete = totalSlots>0 ? Math.round(filled/totalSlots*100) : 0;
    const arc = document.getElementById('dashBudgetArc');
    if(arc){
      arc.style.strokeDashoffset = (DASH_GAUGE_C*(1-pctSpent)).toFixed(2);
      arc.style.stroke = pctSpent>0.9 ? '#C1543F' : pctSpent>0.7 ? '#D9A441' : '#54A573';
    }
    setNum(document.getElementById('dashBudgetNum'), remaining, animate, 0);
    setNum(document.getElementById('dashSpentNum'), myStats.spent, animate, 0);
    setNum(document.getElementById('dashPlayersNum'), myStats.assigned.length, animate, 0);
    setNum(document.getElementById('dashCompleteNum'), pctComplete, animate, 0, '%');
  }
  ['P','D','C','A'].forEach(r=>{
    const slotTot = auctionSettings.slots[r]||0;
    let filled=0, spentR=0;
    if(myStats){
      filled = myStats.slotsFilled[r]||0;
      spentR = myStats.assigned.filter(p=>p.posFanta===r).reduce((s,p)=>s+(Number(p.asta.prezzo)||0),0);
    }
    const bar = document.getElementById('dashBar-'+r);
    if(bar) bar.style.width = (slotTot>0 ? Math.min(100, filled/slotTot*100) : 0)+'%';
    const sl = document.getElementById('dashSlot-'+r); if(sl) sl.textContent = filled+'/'+slotTot;
    const sp = document.getElementById('dashSpent-'+r); if(sp) sp.textContent = spentR;
  });
  renderDashWarTable();
  renderDashMarket();
  renderDashTicker();
  renderDashTopValue();
}

function renderDashWarTable(){
  const body = document.getElementById('dashWarTableBody');
  if(!body) return;
  if(leagueTeams.length===0){ body.innerHTML = '<div class="dash-empty">Nessuna squadra della lega.<br>Configurale in ⚙️ Impostazioni asta.</div>'; return; }
  const rows = leagueTeams.map(t=>{
    const st = computeTeamStats(t.nome);
    const budgetTot = dashBudgetOf(t);
    const filled = Object.values(st.slotsFilled).reduce((a,b)=>a+b,0);
    return { t, st, budgetTot, remaining: budgetTot-st.spent, filled };
  }).sort((a,b)=> b.filled-a.filled || b.remaining-a.remaining);
  const sig = JSON.stringify(rows.map(r=>[r.t.nome, r.remaining, r.filled, r.st.spent]));
  if(dashSignatures.war===sig) return;
  dashSignatures.war = sig;
  body.innerHTML = rows.map((r,i)=>`

function dashValueScore(p){
  const gol = Number(p.golPrevisti)||0;
  const tit = Number(p.titolaritaVoto)||0;
  const fm = Number(p.fmAnnoScorso)||6;
  const price = Math.max(Number(p.asta&&p.asta.prezzo)||0, 1);
  const quality = gol*4 + tit*1.5 + Math.max(0,(fm-6))*5 + getPlayerPriority(p);
  return quality/price;
}
function renderDashTopValue(){
  const body = document.getElementById('dashTopValueList');
  if(!body) return;
  const myTeam = leagueTeams.find(t=>t.isMine);
  if(!myTeam){ body.innerHTML = '<div class="dash-empty">Imposta la tua squadra per vedere i tuoi colpi migliori.</div>'; return; }
  const mine = players.filter(p=>p.asta && p.asta.team===myTeam.nome);
  if(mine.length===0){ body.innerHTML = '<div class="dash-empty">Non hai ancora acquistato giocatori.</div>'; return; }
  const ranked = mine.map(p=>({p, score:dashValueScore(p)})).sort((a,b)=>b.score-a.score).slice(0,5);
  const sig = JSON.stringify(ranked.map(r=>[r.p.id, r.score.toFixed(2)]));
  if(dashSignatures.value===sig) return;
  dashSignatures.value = sig;
  const medals = ['🥇','🥈','🥉','4°','5°'];
  body.innerHTML = ranked.map((r,i)=>`
    <div class="dash-value-item">

}

async function runBulkImport(type){
  const statusEl = document.getElementById('importStatus');
  if(type === 'creators'){ await runCreatorOpinionsImport(statusEl); return; }
  if(type === 'videos'){ await runPlayerVideosImport(statusEl); return; }
  if(type === 'calendario'){ await runCalendarioImport(statusEl); return; }
  
  // Validazione del tipo di importazione
  if(!['players', 'teams'].includes(type)){
    statusEl.textContent = 'Tipo di importazione non valido. Usa "players" o "teams".';
    return;
  }
  
  const raw = document.getElementById('importTextarea').value.trim();
  if(!raw){
    statusEl.textContent = 'Incolla i dati JSON da importare.';
    return;
  }
  
  let items;
  try{
    items = JSON.parse(raw);
    if(!Array.isArray(items)) throw new Error('Deve essere un array JSON, es. [ {...}, {...} ]');
    
    // Validazione struttura elementi
    const requiredFields = type === 'players' ? ['nome'] : ['nome'];
    const invalidItems = items.filter((it, idx) => {
      const missing = requiredFields.filter(f => !it[f]);
      if(missing.length > 0){
        console.warn(`Elemento ${idx + 1} manca di: ${missing.join(', ')}`);
        return true;
      }
      return false;
    });
    
    if(invalidItems.length > 0){
      statusEl.textContent = `Trovati ${invalidItems.length} elementi non validi. Controlla la console per i dettagli.`;
      return;
    }
    
  }catch(e){
    console.error('Errore parsing JSON import:', e);
    statusEl.textContent = 'JSON non valido: ' + e.message;
    return;
  }
  
  if(items.length === 0){ statusEl.textContent = 'Nessun elemento da importare.'; return; }
  
  // Conferma prima di procedere con import massivi
  if(items.length > 50){
    const confirmed = confirm(`Stai per importare ${items.length} elementi. Continuare?`);
    if(!confirmed){
      statusEl.textContent = 'Importazione annullata.';
      return;
    }
  }
  
  statusEl.textContent = `Importazione di ${items.length} elementi...`;
  const table = type==='players' ? 'players' : 'teams';
  const prefix = type==='players' ? 'p' : 't';
  const rows = items.map(it => {
    const id = it.id || uid(prefix);
    const { id: _drop, ...data } = it;
    data.updatedBy = myName || 'import';
    data.updatedAt = new Date().toISOString();
    return { id, data, updated_at: data.updatedAt };
  });
  try{
    const CHUNK = 150;
    for(let i=0; i<rows.length; i+=CHUNK){
      const batch = rows.slice(i, i+CHUNK);
      statusEl.textContent = `Importazione ${Math.min(i+CHUNK, rows.length)}/${rows.length}...`;
      const { error } = await sb.from(table).upsert(batch);
      if(error) throw error;
    }
    statusEl.textContent = `Importati ${rows.length} elementi.`;
    await loadAll();
    render();
    if(currentTab==='teams') renderTeams();
    if(currentTab==='compare') renderCompare();
    showToast(`${rows.length} elementi importati`);
    setTimeout(() => { const ov = document.getElementById('importOverlay'); if(ov) ov.remove(); }, 900);
  }catch(e){
    console.error('Errore importazione bulk:', e);
    statusEl.textContent = 'Errore durante l\'importazione: ' + (e.message || e);
  }
}

// ---------- CSV parsing (fonti creator) ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const pushField = () => { row.push(field); field = ''; };
  const pushRow = () => { pushField(); rows.push(row); row = []; };
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ pushField(); }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ pushRow(); }
      else field += c;
    }
  }
  if(field.length || row.length) pushRow();
  const nonEmpty = rows.filter(r => r.some(f => f.trim() !== ''));
  if(nonEmpty.length === 0) return [];
  const headers = nonEmpty[0].map(h => h.trim());
  return nonEmpty.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => { obj[h] = (r[i]||'').trim(); });
    return obj;
  });
}

function findPlayerIdByName(nome){
  const target = normalize_(nome);
  let p = players.find(p => normalize_(p.nome) === target);
  if(p) return p.id;
  p = players.find(p => normalize_(p.nome).includes(target) || target.includes(normalize_(p.nome)));
  return p ? p.id : null;
}
function normalize_(s){
  return (s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}

function extractYouTubeId(url){
  const m = String(url||'').match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function getCsvField(r, ...keys){
  for(const k of keys){
    if(r[k] != null && r[k] !== '') return r[k];
  }
  return '';
}

function subscribeRealtime(){
  sb.channel('players-changes').on('postgres_changes', {event:'*', schema:'public', table:'players'}, payload => {
    handleRemoteChange('player', payload);
  }).subscribe();
  sb.channel('teams-changes').on('postgres_changes', {event:'*', schema:'public', table:'teams'}, payload => {
    handleRemoteChange('team', payload);
  }).subscribe();
  sb.channel('league-teams-changes').on('postgres_changes', {event:'*', schema:'public', table:'league_teams'}, payload => {
    handleLeagueTeamsChange(payload);
  }).subscribe();
  sb.channel('creator-opinions-changes').on('postgres_changes', {event:'*', schema:'public', table:'creator_opinions'}, payload => {
    if(payload.eventType === 'DELETE'){
      creatorOpinions = creatorOpinions.filter(o => o.id !== payload.old.id);
    } else {
      const rec = { id: payload.new.id, ...payload.new.data };
      const idx = creatorOpinions.findIndex(o => o.id === rec.id);
      if(idx>-1) creatorOpinions[idx] = rec; else creatorOpinions.push(rec);
    }
    if(editingType==='player') renderAstaValutazione(players.find(p=>p.id===editingId) || {});
    refreshPlayerWindowsForAsta();
  }).subscribe();
  sb.channel('player-videos-changes').on('postgres_changes', {event:'*', schema:'public', table:'player_videos'}, payload => {
    if(payload.eventType === 'DELETE'){
      playerVideos = playerVideos.filter(v => v.id !== payload.old.id);
    } else {
      const rec = { id: payload.new.id, ...payload.new.data };
      const idx = playerVideos.findIndex(v => v.id === rec.id);
      if(idx>-1) playerVideos[idx] = rec; else playerVideos.push(rec);
    }
    if(editingType==='player'){
      const p = players.find(x=>x.id===editingId);
      if(p) renderHighlightsSection(p);
    }
    refreshPlayerWindowsForVideos();
  }).subscribe();
  sb.channel('calendario-changes').on('postgres_changes', {event:'*', schema:'public', table:'calendario_serie_a'}, payload => {
    if(payload.eventType === 'DELETE'){
      calendario = calendario.filter(c => c.id !== payload.old.id);
    } else {
      const rec = { id: payload.new.id, ...payload.new.data };
      const idx = calendario.findIndex(c => c.id === rec.id);
      if(idx>-1) calendario[idx] = rec; else calendario.push(rec);
    }
  }).subscribe();
}

function playerSearchBlob(p){
  if(p._searchBlobCache) return p._searchBlobCache;
  const parts = [
    p.nome, p.squadra, p.posReale,
    p.noteAnnoScorso, p.titolaritaNote, p.valutazioneSquadraNote, p.noteVarie, p.noteFisico, p.prezzoPrevisto,
    p.cambioAllenatoreNote, p.ruoliDiversiNote, p.trendNote, p.rendimentoBigMatch,
    ...(p.tag||[]),
  ];
  if(p.custom) Object.entries(p.custom).forEach(([k,v]) => { parts.push(k); parts.push(v); });
  if(p.aiSummary && !p.aiSummary.parseFailed){
    parts.push(...(p.aiSummary.keywords||[]));
    parts.push(...(p.aiSummary.punti_giocatore||[]));
    parts.push(...(p.aiSummary.punti_squadra||[]));
    parts.push(...(p.aiSummary.flag_rischio||[]));
  }
  const blob = parts.filter(Boolean).join(' \n ').toLowerCase();
  p._searchBlobCache = blob;
  return blob;
}

const SCOUTING_FIELDS = ['posReale','noteAnnoScorso','titolaritaVoto','titolaritaNote','valutazioneSquadraNote','golPrevisti','prezzoPrevisto','noteVarie','noteFisico','fragilita'];

function computeScoutingCompleteness(p){
  let filled = 0;
  SCOUTING_FIELDS.forEach(k => {
    const v = p[k];
    if(v!=null && String(v).trim() !== '') filled++;
  });
  const total = SCOUTING_FIELDS.length;
  const pct = Math.round((filled/total)*100);
  return { filled, total, pct, isComplete: pct >= 60 };
}

function filteredPlayers(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
const role = document.getElementById('roleFilter').value;
const scouting = document.getElementById('scoutingFilter').value;
const fasciaF = document.getElementById('fasciaFilter').value;
const sortBy = document.getElementById('sortBy').value;
const posRealeF = document.getElementById('posRealeFilter').value;
  players.forEach(p => { delete p._searchBlobCache; });
  return players.filter(p => {
if(role && p.posFanta !== role) return false;
if(fasciaF && p.fascia !== fasciaF) return false;
if(posRealeF && (p.posReale||'').trim() !== posRealeF) return false;
    if(activeTagFilter && !(p.tag||[]).includes(activeTagFilter)) return false;
    if(activeTeamTagFilterRosa){
      const team = getTeamByName(p.squadra);
      if(!team || !(team.tag||[]).includes(activeTeamTagFilterRosa)) return false;
    }
    if(scouting){
      const c = computeScoutingCompleteness(p);
      if(scouting==='complete' && !c.isComplete) return false;
      if(scouting==='incomplete' && c.isComplete) return false;
    }
    if(q && !playerSearchBlob(p).includes(q)) return false;
    return true;
  }).sort(comparePlayersForSort);
}

const FASCIA_SORT_RANK = {Top:5, Semitop:4, Medio:3, Regolarista:2, Scommessa:1};
function sortValueFor(p, key){
if(key==='nome') return (p.nome||'').toLowerCase();
if(key==='priorita') return getPlayerPriority(p);
if(key==='fascia') return p.fascia ? (FASCIA_SORT_RANK[p.fascia]||0) : -Infinity;
const v = p[key];
return (v==null || String(v).trim()==='') ? -Infinity : Number(v);
}
let sortDir = 'desc';
function comparePlayersForSort(a,b){
const key = document.getElementById('sortBy') ? document.getElementById('sortBy').value : 'priorita';
const asc = sortDir === 'asc';
if(key==='nome'){
return asc ? (a.nome||'').localeCompare(b.nome||'') : (b.nome||'').localeCompare(a.nome||'');
}
const va = sortValueFor(a,key), vb = sortValueFor(b,key);
const ea = (va === -Infinity), eb = (vb === -Infinity);
if(ea !== eb) return ea ? 1 : -1;
if(va!==vb) return asc ? (va-vb) : (vb-va);
return (a.nome||'').localeCompare(b.nome||'');
}

async function persistLeagueTeam(row){
  const {id, ...data} = row;
  const merged = await mergeSaveRow('league_teams', id, data);
  if (merged) {
    const idx = leagueTeams.findIndex(x => x.id === id);
    const mergedRec = Object.assign({id}, merged);
    if (idx > -1) leagueTeams[idx] = mergedRec; else leagueTeams.push(mergedRec);
  }
}

async function persistAuctionSettings(){
  const merged = await mergeSaveRow('league_teams', '_settings', auctionSettings);
  if (merged) auctionSettings = merged;
}

function computeTeamStats(teamName){
  const assigned = players.filter(p => p.asta && p.asta.team === teamName);
  const spent = assigned.reduce((sum,p) => sum + (Number(p.asta.prezzo)||0), 0);
  const slotsFilled = { P:0, D:0, C:0, A:0 };
  assigned.forEach(p => { if(slotsFilled[p.posFanta]!=null) slotsFilled[p.posFanta]++; });
  return { assigned, spent, slotsFilled };
}

function soldInCategoria(reparto, fascia, excludeId){
  return players.filter(p => p.id!==excludeId && p.posFanta===reparto && p.fascia===fascia && p.asta && p.asta.prezzo!=null)
    .sort((a,b) => new Date(b.asta.assegnatoAt||0) - new Date(a.asta.assegnatoAt||0));
}

// Prezzo di riferimento per un giocatore: la TUA stima manuale ha sempre priorità se
// presente e numerica (stesso principio già usato per l'Oracolo — il giudizio umano vince
// sull'automatico); altrimenti si usa l'FVM di fantacalcio.it (adattato a 500 crediti),
// già compilato per tutti i giocatori nel campo custom.fvm. `prezzoPrevisto` a volte può
// contenere testo libero non numerico (es. "circa 60-70") se modificato dall'editor
// generico invece che dal campo numerico dedicato: in quel caso si ignora e si passa a FVM.
function referencePrice(p){
  const manual = p.prezzoPrevisto;
  if(manual!=null && String(manual).trim()!=='' && !isNaN(Number(manual))){
    return { value: Number(manual), source: 'manuale' };
  }
  const fvm = p.custom && p.custom.fvm;
  if(fvm!=null && String(fvm).trim()!=='' && !isNaN(Number(fvm))){
    return { value: Number(fvm), source: 'fvm' };
  }
  return null;
}

// ---------- Istantanea FVM annuale ----------
// Congela l'FVM di quest'anno in un campo personalizzato datato (es. custom.fvmSnapshot2026),
// separato da custom.fvm che invece viene sovrascritto ogni stagione col nuovo listone. Serve
// per calibrare in futuro: tra un anno, spesaAnnoScorso ÷ questa istantanea dice quanto la
// lega si scosta dal listino ufficiale, senza dover andare a caccia di listoni vecchi.
function fvmSnapshotKey(){
  return 'fvmSnapshot' + new Date().getFullYear();
}
function fvmSnapshotStatus(){
  const key = fvmSnapshotKey();
  let withFvm = 0, alreadySnapshotted = 0;
  players.forEach(p => {
    const fvm = p.custom && p.custom.fvm;
    const hasFvm = fvm!=null && String(fvm).trim()!=='' && !isNaN(Number(fvm));
    if(hasFvm) withFvm++;
    const snap = p.custom && p.custom[key];
    if(hasFvm && snap!=null && String(snap).trim()!=='') alreadySnapshotted++;
  });
  return { key, withFvm, alreadySnapshotted, total: players.length };
}
function refreshFvmSnapshotStatus(){
  const el = document.getElementById('fvmSnapshotStatus');
  if(!el) return;
  const st = fvmSnapshotStatus();
  if(st.withFvm===0){
    el.textContent = 'Nessun giocatore ha ancora un FVM da congelare.';
  } else if(st.alreadySnapshotted >= st.withFvm){
    el.textContent = `Istantanea ${st.key.replace('fvmSnapshot','')} già salvata per tutti i ${st.withFvm} giocatori con FVM.`;
  } else {
    el.textContent = `${st.alreadySnapshotted} / ${st.withFvm} giocatori con FVM hanno già l'istantanea ${st.key.replace('fvmSnapshot','')}.`;
  }
}
async function runFvmSnapshot(onProgress){
  const key = fvmSnapshotKey();
  const targets = players.filter(p => {
    const fvm = p.custom && p.custom.fvm;
    const hasFvm = fvm!=null && String(fvm).trim()!=='' && !isNaN(Number(fvm));
    const already = p.custom && p.custom[key]!=null && String(p.custom[key]).trim()!=='';
    return hasFvm && !already;
  });
  let done = 0, errors = 0;
  const CONCURRENCY = 6;
  let idx = 0;
  async function worker(){
    while(idx < targets.length){
      const p = targets[idx++];
      try{
        p.custom = Object.assign({}, p.custom, { [key]: p.custom.fvm });
        await persistPlayer(p, ['custom']);
      }catch(e){ errors++; console.warn('fvm snapshot fallito per', p.id, e); }
      done++;
      if(onProgress) onProgress(done, targets.length);
    }
  }
  const workers = [];
  for(let i=0;i<CONCURRENCY;i++) workers.push(worker());
  await Promise.all(workers);
  refreshFvmSnapshotStatus();
  return { total: targets.length, done, errors };
}

function computeAutoPredictedPrice(reparto, fascia, targetPlayer){
  const excludeId = targetPlayer ? targetPlayer.id : null;
  const sold = soldInCategoria(reparto, fascia, excludeId).slice(0,5);
  const targetRef = targetPlayer ? referencePrice(targetPlayer) : null;
  if(sold.length < 2){
    // troppo poche vendite reali in questa fascia per fidarsi della sola media: se abbiamo
    // un riferimento per questo giocatore (FVM o tua stima) partiamo da quello, meglio di niente
    if(targetRef) return { value: Math.round(targetRef.value), count: sold.length, source: targetRef.source };
    return null;
  }
  const avgSold = sold.reduce((s,p)=>s+Number(p.asta.prezzo),0) / sold.length;
  if(!targetRef || sold.length>=4) return { value: Math.round(avgSold), count: sold.length, source:'mercato' };
  // con poche vendite (2-3) e un riferimento disponibile, mescoliamo i due: più vendite reali
  // abbiamo, più ci fidiamo del mercato effettivo rispetto al riferimento FVM/manuale
  const w = (sold.length-1)/3; // 2 vendite -> peso mercato ~0.33, 3 vendite -> ~0.67
  const blended = avgSold*w + targetRef.value*(1-w);
  return { value: Math.round(blended), count: sold.length, source:'blend' };
}

function computeMarketTemperature(reparto, fascia){
  const pool = soldInCategoria(reparto, fascia, null)
    .map(p => ({ p, ref: referencePrice(p) }))
    .filter(x => x.ref)
    .slice(0,5);
  if(pool.length < 2) return { level:'nd', count: pool.length, confidence:'nessuna' };
  const ratios = pool.map(x => Number(x.p.asta.prezzo) / x.ref.value);
  const avgRatio = ratios.reduce((a,b)=>a+b,0) / ratios.length;
  const manualCount = pool.filter(x => x.ref.source==='manuale').length;
  const sogliaCalda = auctionSettings.tempSogliaCalda!=null ? auctionSettings.tempSogliaCalda : 1.15;
  const sogliaFredda = auctionSettings.tempSogliaFredda!=null ? auctionSettings.tempSogliaFredda : 0.85;
  let level = 'normale';
  if(avgRatio > sogliaCalda) level = 'caldo';
  else if(avgRatio < sogliaFredda) level = 'freddo';
  // con solo 2-3 vendite il segnale è debole (poco più che aneddotico): lo mostriamo comunque,
  // ma segnaliamo che è ancora un dato "morbido" piuttosto che dare un verdetto sicuro di sé
  const confidence = pool.length>=4 ? 'alta' : 'bassa';
  return { level, avgRatio, count: pool.length, manualCount, confidence };
}

function autoPredictedSourceLabel(auto){
  if(auto.source==='mercato') return `media ultime ${auto.count} vendite in questa fascia`;
  if(auto.source==='blend') return `mix mercato (${auto.count} vendite) + FVM, dati ancora pochi`;
  if(auto.source==='manuale') return `dalla tua stima, nessuna vendita ancora in questa fascia`;
  return `da FVM, nessuna vendita ancora in questa fascia`;
}
function marketTempConfidenceNote(temp){
  return temp.confidence==='bassa' ? ' ⚠️ ancora poco affidabile' : '';
}

function computeRivalsActiveInReparto(reparto){
  return leagueTeams.filter(t => !t.isMine).map(t => {
    const {spent, slotsFilled} = computeTeamStats(t.nome);
    const budgetTot = t.budgetTotale!=null ? t.budgetTotale : auctionSettings.budgetTotale;
    const slotsLeft = (auctionSettings.slots[reparto]||0) - (slotsFilled[reparto]||0);
    return { nome: t.nome, remaining: budgetTot - spent, slotsLeft };
  }).filter(t => t.slotsLeft > 0).sort((a,b) => b.remaining - a.remaining);
}

function teamPericolosita(nomeSquadra){
  const t = teams.find(x => normalize_(x.nome) === normalize_(nomeSquadra));
  return (t && t.pericolosita!=null) ? Number(t.pericolosita) : 5.5; // default neutro se manca il rating
}

// Ritorna { [nomeSquadra]: { [giornata]: difficolta } } per tutte le squadre nel calendario
function buildFixtureDifficultyByTeam(){
  const byTeam = {};
  calendario.forEach(fix => {
    if(!fix.giornata) return;
    const casa = fix.squadraCasa, trasf = fix.squadraTrasferta;
    if(!byTeam[casa]) byTeam[casa] = {};
    if(!byTeam[trasf]) byTeam[trasf] = {};
    // difficoltà per chi gioca in casa = pericolosità avversario (trasferta più dura: +1)
    byTeam[casa][fix.giornata] = teamPericolosita(trasf);
    byTeam[trasf][fix.giornata] = Math.min(10, teamPericolosita(casa) + 1);
  });
  return byTeam;
}

function computeGoalkeeperPairScore(gk1, gk2, fixtureByTeam){
  const d1 = fixtureByTeam[gk1.squadra] || {};
  const d2 = fixtureByTeam[gk2.squadra] || {};
  const giornate = [...new Set([...Object.keys(d1), ...Object.keys(d2)])];
  if(giornate.length === 0) return null;
  let totale = 0, conflitti = 0, coperte = 0;
  giornate.forEach(g => {
    const v1 = d1[g], v2 = d2[g];
    if(v1==null && v2==null) return;
    const migliore = Math.min(v1 ?? 10, v2 ?? 10);
    totale += migliore;
    coperte++;
    if((v1==null || v1>=7) && (v2==null || v2>=7)) conflitti++;
  });
  if(coperte === 0) return null;
  return { mediaMigliore: totale/coperte, conflitti, giornateCoperte: coperte };
}

function gkTitolareScore(p){
return (Number(p.titolaritaVoto)||0)*10000 + (Number(p.presenzeAnnoScorso)||0)*10 + (Number(p.partiteDaTitolareAnnoScorso)||0);
}
function computeAllGoalkeeperPairs(){
const portieri = players.filter(p => p.posFanta==='P' && p.squadra);
// Un solo portiere per squadra: il titolare presunto (voto titolarità, poi presenze)
const perSquadra = new Map();
portieri.forEach(p => {
const key = normalize_(p.squadra);
const attuale = perSquadra.get(key);
if(!attuale || gkTitolareScore(p) > gkTitolareScore(attuale)) perSquadra.set(key, p);
});
const titolari = [...perSquadra.values()];
const fixtureByTeam = buildFixtureDifficultyByTeam();
const pairs = [];
for(let i=0; i<titolari.length; i++){
for(let j=i+1; j<titolari.length; j++){
const a = titolari[i], b = titolari[j];
const score = computeGoalkeeperPairScore(a, b, fixtureByTeam);
if(score) pairs.push({ a, b, ...score });
}
}
return pairs.sort((x,y) => x.mediaMigliore - y.mediaMigliore || x.conflitti - y.conflitti);
}

  if(!prevBody) return null;
  area = document.createElement('div');
  area.id = 'astaValutazioneArea';
  area.className = 'asta-valutazione-inline';
  prevBody.appendChild(area);
  return area;
}

function renderAstaValutazione(rec, refreshOnly){
  const area = ensureAstaValutazioneArea();
  if(!area) return;
  const posFantaEl = document.getElementById('f_posFanta');
  const reparto = posFantaEl ? posFantaEl.value : (rec.posFanta || 'C');
  const fasce = FASCE_PER_RUOLO[reparto] || FASCE_PER_RUOLO.C;
  const currentFascia = (refreshOnly && !fasce.includes(rec.fascia)) ? fasce[0] : (rec.fascia && fasce.includes(rec.fascia) ? rec.fascia : fasce[0]);

  area.innerHTML = `
    <div class="field"><label>Fascia (${reparto})</label>
      <select id="f_fascia">${fasce.map(f=>`<option value="${f}" ${f===currentFascia?'selected':''}>${f}</option>`).join('')}</select>
    </div>
    <div class="field-row">
      <div class="field"><label>Valore effettivo (tuo tetto)</label><input type="number" id="f_valoreEffettivo" value="${rec.valoreEffettivo??''}" placeholder="es. 60"></div>
      <div class="field"><label>Prezzo previsto (tuo, manuale)</label><input type="number" id="f_prezzoPrevistoNum" value="${rec.prezzoPrevisto??''}" placeholder="es. 70"></div>
    </div>
    ${auctionSettings.modalitaAsta ? `
      <div id="autoPredictedBox" class="ai-empty"></div>
      <div id="marketTempBox" class="ai-empty"></div>
      <div id="rivalsBox" class="ai-empty"></div>
    ` : `<div class="ai-empty">Previsione automatica, temperatura di mercato e rivali attivi compaiono qui durante l'asta, quando attivi 🟢 Modalità Asta nella tab Asta.</div>`}
  `;

  const refresh = () => {
    if(!auctionSettings.modalitaAsta) return;
    const auto = computeAutoPredictedPrice(reparto, document.getElementById('f_fascia').value, rec);
    document.getElementById('autoPredictedBox').innerHTML = auto
      ? `🤖 Previsione automatica: <b>~${auto.value} cr</b> <span style="color:var(--chalk-dim);">(${autoPredictedSourceLabel(auto)})</span>`
      : `🤖 Previsione automatica: <span style="color:var(--chalk-dim);">dati insufficienti per ora</span>`;

    const temp = computeMarketTemperature(reparto, document.getElementById('f_fascia').value);
    const t = TEMP_LABELS[temp.level];
    document.getElementById('marketTempBox').innerHTML = `${t.icon} Mercato ${reparto}/${document.getElementById('f_fascia').value}: <b>${t.label}</b><br><span style="color:var(--chalk-dim); font-size:11.5px;">${t.hint}${temp.count?` · ${temp.count} vendite confrontate`+(temp.manualCount?` (${temp.manualCount} con tua stima, ${temp.count-temp.manualCount} con FVM)`:' (da FVM)')+marketTempConfidenceNote(temp):''}</span>`;

    const rivals = computeRivalsActiveInReparto(reparto);
    document.getElementById('rivalsBox').innerHTML = rivals.length
      ? `👀 Rivali ancora attivi su ${reparto}: ${rivals.map(r=>`${escapeHtml(r.nome)} (${r.remaining}cr, ${r.slotsLeft} slot)`).join(' · ')}`
      : `👀 Nessun rivale con slot liberi su ${reparto} al momento.`;
  };

  document.getElementById('f_fascia').onchange = () => { refresh(); scheduleAutosave(); };
  document.getElementById('f_valoreEffettivo').addEventListener('input', scheduleAutosave);
  document.getElementById('f_prezzoPrevistoNum').addEventListener('input', () => { refresh(); scheduleAutosave(); });
  refresh();
}

function renderAsta(){
  const area = document.getElementById('astaTeamsArea');
  if(leagueTeams.length === 0){
    area.innerHTML = '<div class="empty">Nessuna squadra della lega configurata.<br>Tocca ⚙️ Impostazioni asta per aggiungere le squadre (inclusa la vostra) e il budget.</div>';
    return;
  }
  const sorted = leagueTeams.slice().sort((a,b) => (b.isMine?1:0)-(a.isMine?1:0) || (a.nome||'').localeCompare(b.nome||''));

  let tempPanel = '';
  if(auctionSettings.modalitaAsta){
    const repartiLabel = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};
    tempPanel = `<div class="section-block" open style="margin-bottom:14px;">
      <summary>🌡️ Temperatura mercato</summary>
      <div class="section-body">
        ${Object.keys(FASCE_PER_RUOLO).map(reparto => `
          <div class="slot-group-title" style="margin-top:8px;">${repartiLabel[reparto]}</div>
          ${FASCE_PER_RUOLO[reparto].map(fascia => {
            const temp = computeMarketTemperature(reparto, fascia);
            const t = TEMP_LABELS[temp.level];
            return `<div class="slot-row"><span>${t.icon} ${fascia}</span><span style="color:var(--chalk-dim); font-size:11.5px;">${t.label}${temp.count?` · ${temp.count} vendite`+(temp.confidence==='bassa'?' ⚠️':''):''}</span></div>`;
          }).join('')}
        `).join('')}
      </div>
    </div>`;
  }

  area.innerHTML = tempPanel + sorted.map(t => {
    const budgetTot = t.budgetTotale!=null ? t.budgetTotale : auctionSettings.budgetTotale;
    const {spent, slotsFilled} = computeTeamStats(t.nome);
    const remaining = budgetTot - spent;
    const pct = budgetTot>0 ? Math.min(100, (spent/budgetTot)*100) : 0;
    const low = remaining < budgetTot*0.15;
    const slots = auctionSettings.slots;
    return `
    <div class="asta-team-card ${t.isMine?'mine':''}" data-team="${escapeHtml(t.nome)}">
      <div class="asta-team-top">
        <div class="asta-team-name">${escapeHtml(t.nome)}${t.isMine?'<span class="mine-badge">★ LA MIA</span>':''}</div>
      </div>
      <div class="asta-budget-line">Speso <b>${spent}</b> / ${budgetTot} · Rimane <b>${remaining}</b></div>
      <div class="budget-bar"><div class="budget-bar-fill ${low?'low':''}" style="width:${pct}%;"></div></div>
      <div class="slot-summary">
        <span>P: <b>${slotsFilled.P}/${slots.P}</b></span>
        <span>D: <b>${slotsFilled.D}/${slots.D}</b></span>
        <span>C: <b>${slotsFilled.C}/${slots.C}</b></span>
        <span>A: <b>${slotsFilled.A}/${slots.A}</b></span>
      </div>
    </div>`;
  }).join('');
  area.querySelectorAll('.asta-team-card').forEach(el => {
el.onclick = () => openTeamRosterDetail(el.dataset.team);
el.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; el.classList.add('drag-over'); });
el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
el.addEventListener('drop', (e) => {
e.preventDefault();
el.classList.remove('drag-over');
const pid = e.dataTransfer.getData('text/plain');
if (pid) openAssignFormForTeam(pid, el.dataset.team);
});
});
  if(quickMode) renderQuickList();
}

function openTeamRosterDetail(teamName){
  const {assigned, spent} = computeTeamStats(teamName);
  const teamRow = leagueTeams.find(t => t.nome === teamName);
  const budgetTot = teamRow && teamRow.budgetTotale!=null ? teamRow.budgetTotale : auctionSettings.budgetTotale;
  const slots = auctionSettings.slots;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'rosterOverlay';
  const deptLabels = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};
  let body = '';
  ['P','D','C','A'].forEach(dept => {
    const inDept = assigned.filter(p => p.posFanta === dept).sort((a,b)=> (b.asta.prezzo||0)-(a.asta.prezzo||0));
    const n = slots[dept] || 0;
    body += `<div class="slot-group"><div class="slot-group-title">${deptLabels[dept]} (${inDept.length}/${n})</div>`;
    for(let i=0; i<Math.max(n, inDept.length); i++){
      const p = inDept[i];
      if(p){
        body += `<div class="slot-row"><span>${escapeHtml(p.nome)}</span><span class="slot-price">${p.asta.prezzo} cr <button data-id="${p.id}">✕</button></span></div>`;
      } else {
        body += `<div class="slot-row empty"><span>-- slot vuoto --</span></div>`;
      }
    }
    body += `</div>`;
  });
  overlay.innerHTML = `
  <div class="modal">
    <div class="modal-head">
      <h2>${escapeHtml(teamName)}</h2>
      <button class="close-x" id="closeRoster">✕</button>
    </div>
    <div class="save-status">Speso ${spent} / ${budgetTot} · Rimane ${budgetTot-spent}</div>
    ${body}
    <div class="modal-actions"><button class="btn" id="closeRoster2" style="flex:1;">Chiudi</button></div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('closeRoster').onclick = () => overlay.remove();
  document.getElementById('closeRoster2').onclick = () => overlay.remove();
  overlay.querySelectorAll('.slot-row button').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      await unassignPlayer(btn.dataset.id);
      overlay.remove();
      openTeamRosterDetail(teamName);
    };
  });
}

async function assignPlayer(playerId, teamName, prezzo){
  const p = players.find(x=>x.id===playerId);
  if(!p) return;
  const previous = p.asta ? {...p.asta} : null;
  p.asta = { team: teamName, prezzo: Number(prezzo)||0, assegnatoDa: myName||'anonimo', assegnatoAt: new Date().toISOString() };
  render();
  if(currentTab==='asta') renderAsta();
  renderQuickStatusPill();
  refreshQuickPanelIfOpen();
  try{
    await persistPlayer(p, ['asta']);
  }catch(e){
    console.error('Errore assegnazione giocatore:', e);
    p.asta = previous;
    render();
    if(currentTab==='asta') renderAsta();
    renderQuickStatusPill();
    refreshQuickPanelIfOpen();
    showToast('Errore di salvataggio, assegnazione annullata: riprova');
  }
}

async function unassignPlayer(playerId){
  const p = players.find(x=>x.id===playerId);
  if(!p) return;
  const previous = p.asta ? {...p.asta} : null;
  p.asta = null;
  render();
  if(currentTab==='asta') renderAsta();
  renderQuickStatusPill();
  refreshQuickPanelIfOpen();
  try{
    await persistPlayer(p, ['asta']);
  }catch(e){
    console.error('Errore rimozione assegnazione:', e);
    p.asta = previous;
    render();
    if(currentTab==='asta') renderAsta();
    renderQuickStatusPill();
    refreshQuickPanelIfOpen();
    showToast('Errore di salvataggio, ripristinata assegnazione precedente');
  }
}

function openAssignForm(playerId){
  const p = players.find(x=>x.id===playerId);
  if(!p) return;
  if(leagueTeams.length === 0){ showToast('Configura prima le squadre in ⚙️ Impostazioni asta'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'assignFormOverlay';
  overlay.innerHTML = `
  <div class="modal">
    <div class="modal-head">
      <h2>Assegna ${escapeHtml(p.nome)}</h2>
      <button class="close-x" id="closeAssignForm">✕</button>
    </div>
    <div class="field"><label>Squadra</label>
      <select id="assignTeamSelect">${leagueTeams.map(t=>`<option value="${escapeHtml(t.nome)}" ${p.asta&&p.asta.team===t.nome?'selected':''}>${escapeHtml(t.nome)}${t.isMine?' (mia)':''}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Prezzo pagato</label><input type="number" id="assignPrezzoInput" value="${p.asta?p.asta.prezzo:''}" placeholder="es. 45"></div>
    <div class="modal-actions">
      ${p.asta?'<button class="btn danger" id="unassignBtn">Rimuovi assegnazione</button>':''}
      <button class="btn primary" id="confirmAssignBtn" style="flex:1;">Conferma</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('closeAssignForm').onclick = () => overlay.remove();
  document.getElementById('confirmAssignBtn').onclick = async () => {
    const team = document.getElementById('assignTeamSelect').value;
    const prezzo = document.getElementById('assignPrezzoInput').value;
    await assignPlayer(playerId, team, prezzo);
    overlay.remove();
    showToast('Assegnato');
  };
  const unassignBtn = document.getElementById('unassignBtn');
  if(unassignBtn) unassignBtn.onclick = async () => {
    await unassignPlayer(playerId);
    overlay.remove();
    showToast('Assegnazione rimossa');
  };
}

function openAssignFormForTeam(playerId, teamName){
  openAssignForm(playerId);
  const sel = document.getElementById('assignTeamSelect');
  if (sel && teamName) sel.value = teamName;
  // Se sto trascinando il giocatore su una squadra DIVERSA da quella a cui è già assegnato,
  // il prezzo pagato alla vecchia squadra non c'entra nulla con la nuova: lo svuoto, altrimenti
  // durante l'asta dal vivo si rischia di confermare per sbaglio un prezzo che non è quello vero.
  const p = players.find(x => x.id === playerId);
  const prezzoInput = document.getElementById('assignPrezzoInput');
  if (prezzoInput && p && p.asta && teamName && p.asta.team !== teamName) {
    prezzoInput.value = '';
    prezzoInput.placeholder = 'es. 45 · prezzo per ' + teamName;
  }
}

function renderLeagueTeamsManage(){
  const area = document.getElementById('leagueTeamsArea');
  if(!area) return;
  const sorted = leagueTeams.slice().sort((a,b)=> (a.nome||'').localeCompare(b.nome||''));
  area.innerHTML = sorted.map(t => `
    <div class="team-manage-row">
      <span style="flex:1;">${escapeHtml(t.nome)}${t.isMine?' <span class="mine-badge" style="color:var(--amber);">★ mia</span>':''}</span>
      <button class="btn small danger" data-id="${t.id}">Elimina</button>
    </div>
  `).join('') || '<div class="ai-empty">Nessuna squadra ancora.</div>';
  area.querySelectorAll('button').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm('Eliminare questa squadra? Le assegnazioni dei giocatori a questa squadra resteranno ma il nome non comparirà più tra le squadre della lega.')) return;
      const id = btn.dataset.id;
      leagueTeams = leagueTeams.filter(t=>t.id!==id);
      await sb.from('league_teams').delete().eq('id', id);
      renderLeagueTeamsManage();
      renderAsta();
    };
  });
}

let quickActiveTeam = null;
let quickShowTaken = false;
let quickHighlightIndex = -1;
let quickAssignLog = []; // {playerId, playerName, team, prezzo, ts}

function toggleQuickMode(){
  quickMode = !quickMode;
  document.getElementById('astaQuickToggle').classList.toggle('mode-active', quickMode);
  document.getElementById('quickFabToggle').classList.toggle('active', quickMode);
  document.getElementById('quickFloatingPanel').style.display = quickMode ? '' : 'none';
  if(quickMode) renderQuickMode();
}
document.getElementById('astaQuickToggle').onclick = toggleQuickMode;
document.getElementById('quickFabToggle').onclick = toggleQuickMode;

function renderAstaSidebar(){
const sidebar = document.getElementById('astaSidebar');
if(!sidebar) return;
const active = !!auctionSettings.modalitaAsta && WM.isDesktop;
sidebar.classList.toggle('open', active);
document.body.classList.toggle('asta-sidebar-active', active);
if(!active) return;
const header = document.querySelector('header');
if(header) sidebar.style.top = header.offsetHeight + 'px';
const content = document.getElementById('astaSidebarContent');
if(!content) return;
const sorted = leagueTeams.slice().sort((a,b)=> (b.isMine?1:0)-(a.isMine?1:0) || (a.nome||'').localeCompare(b.nome||''));

content.innerHTML = sorted.map(t => {
const budgetTot = t.budgetTotale!=null ? t.budgetTotale : auctionSettings.budgetTotale;
const {spent, slotsFilled} = computeTeamStats(t.nome);
const remaining = budgetTot - spent;
const pct = budgetTot>0 ? Math.min(100,(spent/budgetTot)*100) : 0;
const low = remaining < budgetTot*0.15;
const slots = auctionSettings.slots;
return `
<div class="sidebar-team ${t.isMine?'mine':''}" data-team="${escapeHtml(t.nome)}">
<div class="sidebar-team-top">
<span class="sidebar-team-name">${escapeHtml(t.nome)}${t.isMine?' <span class="mine-star">★</span>':''}</span>
<span class="sidebar-remaining ${low?'low':''}">${remaining}<small>cr</small></span>
</div>
<div class="budget-bar"><div class="budget-bar-fill ${low?'low':''}" style="width:${pct}%;"></div></div>
<div class="sidebar-team-meta">speso ${spent}/${budgetTot} · P ${slotsFilled.P}/${slots.P} · D ${slotsFilled.D}/${slots.D} · C ${slotsFilled.C}/${slots.C} · A ${slotsFilled.A}/${slots.A}</div>
</div>`;
}).join('');
content.querySelectorAll('.sidebar-team').forEach(el => {
el.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; el.classList.add('drag-over'); });
el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
el.addEventListener('drop', (e)=>{ e.preventDefault(); el.classList.remove('drag-over'); const pid=e.dataTransfer.getData('text/plain'); if(pid) openAssignFormForTeam(pid, el.dataset.team); });
});
}

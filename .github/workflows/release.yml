# Release — Crea GitHub Release con bundle per tutte le piattaforme
#
# Trigger: push di un tag `v*` (es. `v0.1.0`, `v0.2.0-m1`).
# Builda .msi + .exe + .deb + .AppImage + .dmg + .app e li allea a una
# Release GitHub con changelog auto-generato.
#
# Prerequisiti:
#   - Repo pubblico (GitHub Actions minutes gratuiti illimitati per repo pubblici)
#   - Per firmare i binari: settings → Secrets → AZURE_CLIENT_ID ecc.
#     (vedi https://tauri.app/v2/guides/distribution/sign-windows)
#     Senza secrets, l'MSI viene buildato non firmato (Windows SmartScreen avviserà).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versione tag (es. v0.1.0)'
        type: string
        required: true

permissions:
  contents: write # serve per creare release e uploadare asset

jobs:
  build-and-release:
    name: Build + Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: msi,nsis
            artifact_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: deb,appimage
            artifact_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg,app
            artifact_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # === Linux: dev dependencies ===
      - name: Install Linux dev dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config build-essential

      # === Node + Rust ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('./src-tauri/Cargo.lock', './src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      # === Windows code signing (opzionale) ===
      # Se i secrets sono configurati, Tauri firma automaticamente l'MSI/exe.
      # Senza secrets, salta questo step e builda non firmato.
      - name: Configure Windows signing env
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "Windows signing enabled (Azure Trusted Signing)"
          # Tauri legge queste env vars automaticamente quando configurato in tauri.conf.json

      # === Build ===
      - name: Build Tauri bundle
        run: npx @tauri-apps/cli@latest build --bundles ${{ matrix.bundles }}
        env:
          # Abilita signing solo se i secrets sono presenti
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}

      # === Staging artifacts per upload ===
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Copia con rename per includere tag versione nel filename
          VERSION="${{ steps.tag.outputs.name }}"
          find src-tauri/target/release/bundle -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) | while read -r f; do
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            cp "$f" "artifacts/DossierFanta_${VERSION}_${{ matrix.label }}.${ext}"
          done
          ls -la artifacts/

      # === Upload come GitHub release asset ===
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DossierFanta ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }} # prerelease se tag ha trattino (es. v0.1.0-rc1)
          files: artifacts/*
          body: |
            ## DossierFanta ${{ steps.tag.outputs.name }}

            ### Installazione

            | Piattaforma | File |
            |---|---|
            | Windows (.msi) | `DossierFanta_${{ steps.tag.outputs.name }}_windows-x64.msi` |
            | Windows (.exe, NSIS) | `DossierFanta_${{ steps.tag.outputs.name }}_windows-x64.exe` |
            | Linux (.deb) | `DossierFanta_${{ steps.tag.outputs.name }}_linux-x64.deb` |
            | Linux (.AppImage) | `DossierFanta_${{ steps.tag.outputs.name }}_linux-x64.AppImage` |
            | macOS (.dmg) | `DossierFanta_${{ steps.tag.outputs.name }}_macos-arm64.dmg` |

            ### Requisiti

            - **Windows 10/11**: WebView2 Runtime (preinstallato su Win10+)
            - **Linux**: webkit2gtk-4.1, gtk3 (su Ubuntu: `sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0`)
            - **macOS 11+**: nessun prerequisito

            ### Note M1

            App offline-first: nessuna connessione richiesta al primo avvio.
            Il DB SQLite locale `mio.db` viene creato automaticamente in:
            - Windows: `%APPDATA%\com.dossierfanta.app\mio.db`
            - Linux: `~/.local/share/com.dossierfanta.app/mio.db`
            - macOS: `~/Library/Application Support/com.dossierfanta.app/mio.db`

            Schema v2.2 applicato al primo avvio (10 tabelle + 1 vista + 2 trigger + 3 preset).

            ---
            *[Changelog completo](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)*

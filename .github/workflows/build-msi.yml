# Build MSI (Windows) — chiusura M1 (WARN A5) + M2.2 — FIX A3 (H9)
#
# Questo workflow builda l'installer .msi per Windows usando
# tauri-apps/tauri-action@v0, che gestisce automaticamente:
#   - installazione Rust target x86_64-pc-windows-msvc
#   - WiX Toolset (necessario per .msi)
#   - NSIS (fallback .exe installer)
#   - upload del .msi come artifact scaricabile
#
# M2.2 — FIX A3 (H9): build riproducibile. Lo step "Verify Cargo.lock"
# controlla che src-tauri/Cargo.lock sia committato e sincronizzato con
# Cargo.toml. In caso contrario (file mancante o out-of-sync), il workflow
# fallisce esplicitamente invece di rigenerare il lockfile in modo non
# deterministico. Lo step "Verify Cargo.lock" esegue `cargo check --locked`
# PRIMA del build Tauri: se il lockfile è out-of-sync, fallisce lì con
# messaggio chiaro. Il build Tauri successivo userà il Cargo.lock esistente
# (già verificato in sync). Questo garantisce che l'.msi prodotto in CI è
# identico a quello che l'utente ottiene localmente con lo stesso commit.
#
# NOTA M2.2 — bugfix post-ispezione: NON passare `args: --locked` a
# tauri-action. `--locked` è un flag di cargo, NON di tauri CLI. Tauri 2
# CLI non lo supporta e lo rifiuta con "error: unexpected argument
# '--locked' found". `args` qui è per flag di tauri (es. --debug,
# --target, --bundles). Il controllo --locked è già garantito dallo
# step "Verify Cargo.lock" sopra.
#
# Trigger:
#   - push di tag v*: builda e crea una Release draft con l'.msi allegato
#   - workflow_dispatch: builda e uploada solo l'artifact (nessuna Release)
#
# Verifica manuale:
#   1. Vai su GitHub → tab Actions → "Build MSI (Windows)"
#   2. Clic "Run workflow" → scegli il branch (default: main)
#   3. Attendi ~10-15 min
#   4. Scarica l'artifact "DossierFanta-windows-msi" dalla pagina di esecuzione
#   5. Verifica che il file .msi sia presente e > 5MB

name: Build MSI (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # richiesto da tauri-action per creare Release su tag push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      # M2.2 — FIX A3 (H9): verifica Cargo.lock committato + sincronizzato
      # PRIMA di buildare. Se fallisce qui, il problema è notificato
      # esplicitamente (anziché in un passo successivo meno chiaro).
      - name: Verify Cargo.lock (M2.2 — FIX A3)
        shell: bash
        working-directory: src-tauri
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock assente. Esegui scripts/generate-cargo-lock.sh localmente e committa."
            echo "::error::Vedi M2.2 — FIX A3 (H9) nel report finale."
            exit 1
          fi
          echo "Cargo.lock presente ($(wc -c < Cargo.lock) byte)"
          # M2.2 — bugfix post-ispezione: cargo verify-lock NON esiste come
          # sottocomando cargo standard. La verifica di coerenza Cargo.lock
          # vs Cargo.toml si fa con `cargo check --locked` (o `cargo metadata
          # --locked`): se il lockfile è out-of-sync il comando fallisce con
          # errore "the lock file needs to be updated but --locked was passed".
          # Stesso fix applicato in scripts/generate-cargo-lock.sh.
          cargo check --locked --manifest-path Cargo.toml
          echo "Cargo.lock sincronizzato con Cargo.toml ✓"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DossierFanta ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # M2.2 — FIX A3 (H9): il controllo "build riproducibile" è già
          # garantito dallo step "Verify Cargo.lock" sopra, che esegue
          # `cargo check --locked` PRIMA di questo step. Se il lockfile è
          # out-of-sync, fallisce lì con un messaggio chiaro, NON qui.
          #
          # NON passare `args: --locked` a tauri-action: `--locked` è un
          # flag di cargo, NON di tauri CLI. Tauri 2 CLI non lo supporta
          # e lo rifiuta con "error: unexpected argument '--locked' found".
          # `args` qui è per flag di tauri (es. --debug, --target, --bundles).
          #
          # Il build Tauri userà il Cargo.lock esistente (già verificato
          # in sync dallo step sopra). Tauri-action invoca `cargo build`
          # internamente: se Cargo.lock è già in sync (verificato), nessun
          # auto-update del lockfile avviene comunque.

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DossierFanta-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

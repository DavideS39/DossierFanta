# CI — Continuos Integration
#
# Eseguito su ogni push e PR verso main/master.
# Verifica che il codice compili e i test passino, senza buildare i bundle.
# Veloce (~2-3 min): niente webkit deps, solo cargo check + test + tsc.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check-and-test:
    name: Rust check + test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config build-essential

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./src-tauri/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('./src-tauri/Cargo.lock', './src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: cargo fmt (check only)
        run: cargo fmt -- --check
        continue-on-error: true # non bloccante in M1, fix in M2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true # non bloccante in M1

      - name: cargo check
        run: cargo check --color=never

      - name: cargo test (M1 smoke test)
        run: cargo test --test m1_smoke_test -- --nocapture

  frontend-check:
    name: Frontend TypeScript check
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vite production build
        run: npm run build

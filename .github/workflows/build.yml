# Build — Bundle per tutte le piattaforme
#
# Eseguito manualmente (workflow_dispatch) o dopo un push su main.
# Builda i bundle nativi (.msi + .exe su Windows, .deb + .AppImage su Linux,
# .dmg + .app su macOS) e li carica come artefatti GitHub.
#
# NOTA: NON crea una Release. Per quello usa il workflow release.yml
# (push di un tag `v*`).

name: Build

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Usa build profile debug (più veloce, binario più grande)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false # se Windows fallisce, continua Linux/macOS
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: msi,nsis
            artifact_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: deb,appimage
            artifact_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg,app
            artifact_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === Linux: dev dependencies ===
      - name: Install Linux dev dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config build-essential

      # === Node.js (frontend) ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      # === Rust ===
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('./src-tauri/Cargo.lock', './src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      # === Build ===
      - name: Build Tauri bundle
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            npx @tauri-apps/cli@latest build --debug --bundles ${{ matrix.bundles }}
          else
            npx @tauri-apps/cli@latest build --bundles ${{ matrix.bundles }}
          fi

      # === Upload artifacts ===
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DossierFanta-${{ matrix.label }}
          path: |
            ${{ matrix.artifact_glob }}
          retention-days: 30
          if-no-files-found: error

      # === Summary ===
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## Build result: ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d src-tauri/target/release/bundle ]; then
            echo "### Artifacts prodotti:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \) -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Nessun artifact trovato in src-tauri/target/release/bundle/" >> $GITHUB_STEP_SUMMARY
          fi

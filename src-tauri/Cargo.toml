[package]
name = "dossierfanta"
version = "0.2.0"
description = "DossierFanta v2.2 — Taccuino di progettazione fantacalcio (M2)"
authors = ["DossierFanta"]
edition = "2021"
rust-version = "1.77"

# Library name is used by tauri-build for the .dll on Windows
[lib]
name = "dossierfanta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
log = "0.4"
dirs = "5"

[features]
# By default Tauri runs in production mode (no devtools)
default = []

# Enable devtools in debug builds via `tauri dev`
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"   # Optimize for size for the .msi bundle
lto = true
codegen-units = 1
panic = "abort"
strip = true

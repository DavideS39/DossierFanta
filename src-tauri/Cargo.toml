[package]
name = "dossierfanta"
version = "0.3.3"
description = "DossierFanta v2.5 — M3a.3 sync multi-canale Supabase + Iroh, peer key persistente, listone come DB"
authors = ["DossierFanta"]
edition = "2021"
rust-version = "1.77"

# Library name is used by tauri-build for the .dll on Windows
[lib]
name = "dossierfanta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
log = "0.4"
dirs = "5"
# M3 — Auto-fetch listone via GitHub Releases + fallback inline scraper
# (design doc DossierFanta v2.5, Cap.7).
# - reqwest: client HTTP per api.github.com/releases/latest + download players.json
#   (feature "json" per deserializzare JSON response, "stream" per download
#   progressivo di file fino a 2 MB).
# - futures-util: StreamExt per consumare il body streaming di reqwest.
# - scraper: parsing HTML (CSS selector) per il fallback inline che scarica
#   direttamente fantacalcio.it se GitHub è irraggiungibile. Mantiene gli
#   stessi selettori del parser Python in dossier-fanta-data/scraper.
# - tokio: runtime async (richiesto da reqwest streaming + Iroh). Tauri 2 include
#   già tokio ma lo rendiamo esplicito per chiarezza.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
futures-util = "0.3"
scraper = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# M3a — Sync live CRDT P2P (design doc Cap.5):
# - yrs: stato CRDT authoritativo lato Rust. Mirror di Yjs frontend.
#   Permette validation server-side degli update, merge di updates offline,
#   snapshot Yjs per sync iniziale veloce.
# - iroh: P2P transport con NAT traversal automatico + fallback relay.
#   Gossip protocol per broadcast updates a tutti i peer connessi.
# - iroh-gossip: subscription + broadcast di messaggi binari su un topic
#   condiviso. M3a.1 (PB2 fix) — sostituisce i placeholder
#   `std::future::pending` in `iroh_subscribe_updates` con un subscribe loop
#   reale. Versione allineata a `iroh` 0.13 (iroh-gossip ha versioning
#   indipendente: 0.13 → usa `iroh-net` 0.13, che è la sotto-crate di rete
#   di iroh 0.13). La feature `tokio` di iroh è stata rimossa in 0.13
#   (tokio è ora l'unico runtime supportato).
#   (Cargo.lock aggiornato e committato come da vincolo H9 M2.2)
yrs = "0.21"
iroh = "0.13"
iroh-base = "0.13"
iroh-net = "0.13"
iroh-gossip = "0.13"
bytes = "1"

# M3a.2 buildfix #3 — Pin schannel alla 0.1.29 (funzionante in M3a.1).
# La patch release 0.1.30 di schannel (binding Rust per Schannel, il TLS
# nativo di Windows) causa un panic runtime durante l'inizializzazione
# statica di IrohState / YjsState (mutex poisoned) su alcuni sistemi
# Windows. Sintomi nel binario: "the generated Tauri `Context` panicked
# during creation" + "IrohState mutex poisoned" + "panic in a function
# that cannot unwind".
# Fissiamo esplicitamente alla 0.1.29 (versione usata in M3a.1, funzionante).
# Il prefisso `=` forza Cargo a usare ESATTAMENTE questa versione anche se
# altre crate (iroh-net, native-tls) ne richiederebbero una più recente.
schannel = "=0.1.29"

# B.9 — Fallback WebSocket LAN-only (insurance policy)
# Attivato solo dietro feature flag `lan-only`. Quando attivo:
#  - Iroh non viene inizializzato
#  - Sync via WebSocket su LAN (ws://192.168.x.x:port)
#  - Discovery via mDNS (service "_dossierfanta._tcp.local.")
# Il flag è documentato ma NON attivato di default. Si attiva solo se
# Iroh presenta bug in production.
tokio-tungstenite = { version = "0.24", optional = true }
# M3a.1 (Fix aggiuntivo B) — mDNS discovery per trovare automaticamente
# i peer DossierFanta sulla stessa LAN quando il flag `lan-only` è attivo.
mdns-sd = { version = "0.11", optional = true }

[features]
# By default Tauri runs in production mode (no devtools)
default = []

# Enable devtools in debug builds via `tauri dev`
custom-protocol = ["tauri/custom-protocol"]

# B.9 — Fallback WebSocket LAN-only (insurance policy)
# Attivare con: cargo build --features lan-only
# Quando attivo: Iroh non viene inizializzato, sync via WebSocket LAN,
# discovery automatico dei peer via mDNS.
# Perde p2p a distanza, mantiene sync live in casa.
lan-only = ["dep:tokio-tungstenite", "dep:mdns-sd"]

[profile.release]
opt-level = "s"   # Optimize for size for the .msi bundle
lto = true
codegen-units = 1
panic = "abort"
strip = true
